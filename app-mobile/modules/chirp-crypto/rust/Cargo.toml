[package]
name = "chirp-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Chirp end-to-end encrypted direct messages: encrypted store, Olm DM protocol, trust pins, plus the uniffi boundary the iOS module wraps."

[lib]
# `lib` keeps `cargo test` and host consumers working; `staticlib` is what the iOS
# xcframework is built from (scripts/build-ios.sh).
crate-type = ["lib", "staticlib"]

[features]
# Pulls in the uniffi CLI (clap, cargo_metadata, the bindgen itself) for the
# `uniffi-bindgen` binary ONLY. The shipped library never enables it.
bindgen-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[dependencies]
# Olm only, stable session config V1. Default features (libolm-compat,
# precomputed-tables) and every experimental/low-level feature are off.
vodozemac = { version = "=0.11.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.1"
getrandom = "0.4.3"
thiserror = "2.0.21"
base64 = "0.23.1"
# MPL-2.0 (approved, design section 11). Pinned exactly: the Swift bindings generated
# by the bindgen must come from the same version as the scaffolding in this crate.
uniffi = { version = "=0.32.2", default-features = false }

[dev-dependencies]
# Test-only: deterministic Ed25519 vectors (vodozemac cannot seed an Account).
ed25519-dalek = "3.0.0"

[workspace]
