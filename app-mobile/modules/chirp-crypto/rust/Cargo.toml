[package]
name = "chirp-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Chirp end-to-end encrypted direct messages: encrypted store, Olm DM protocol, trust pins. Host-only core; no mobile bindings."

[dependencies]
# Olm only, stable session config V1. Default features (libolm-compat,
# precomputed-tables) and every experimental/low-level feature are off.
vodozemac = { version = "=0.11.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.1"
getrandom = "0.4.3"
thiserror = "2.0.21"

[dev-dependencies]
# Test-only: deterministic Ed25519 vectors (vodozemac cannot seed an Account).
ed25519-dalek = "3.0.0"

[workspace]
