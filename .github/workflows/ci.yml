name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend pytest (PG16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chirp
          POSTGRES_PASSWORD: chirp
          POSTGRES_DB: chirp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chirp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis is a REAL dependency of the test suite, not a convenience: the WS
      # fan-out tests publish through it and assert the gateway forwards the
      # event, so with no Redis here they fail on connection refused rather than
      # on anything they are meant to prove.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend with dev extras
        working-directory: backend
        run: pip install -e ".[dev,firebase]"
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://chirp:chirp@localhost:5432/chirp_test
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q

  mobile:
    name: mobile tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      - name: Install
        working-directory: app-mobile
        run: npm ci
      - name: Type-check
        working-directory: app-mobile
        run: npx tsc --noEmit
