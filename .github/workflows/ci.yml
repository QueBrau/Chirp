name: CI

on:
  push:
    branches: [main]
  pull_request:

# Explicit least-privilege regardless of org/repo Actions defaults (c185 - the
# repo is public; this workflow references no secrets and needs only checkout).
permissions:
  contents: read

jobs:
  backend:
    name: backend pytest (PG16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chirp
          POSTGRES_PASSWORD: chirp
          POSTGRES_DB: chirp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chirp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis is a REAL dependency of the test suite, not a convenience: the WS
      # fan-out tests publish through it and assert the gateway forwards the
      # event, so with no Redis here they fail on connection refused rather than
      # on anything they are meant to prove.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installs from the SAME lockfile family the Cloud Run image uses, rather
      # than re-resolving pyproject's open ranges. Before this, CI and prod could
      # install different versions of stripe or firebase-admin from identical
      # source, and nothing anywhere would report it — a green check that did not
      # describe what shipped. requirements-dev.lock is requirements.lock plus the
      # test extras, generated from the same pyproject in the same command.
      - name: Install backend from the lockfile
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://chirp:chirp@localhost:5432/chirp_test
          REDIS_URL: redis://localhost:6379/0
          # Board card c103. conftest's database_url fixture skips when the DB is
          # unreachable, which is right on a laptop and dangerous here: skips are
          # not failures, so a postgres service that never came up would let the
          # whole DB-backed suite skip and pytest would still exit 0 — a green
          # check proving nothing. Measured against a dead port before this
          # landed: 22 passed, 157 skipped, exit 0. This flag turns that skip
          # into a hard failure. If it ever fires, fix the service; do not
          # unset the flag.
          CHIRP_REQUIRE_DB: "1"
        run: python -m pytest -q

  migrations:
    # Board cards c41 and c101. Two branches parented on the same revision give
    # alembic two heads, and then `alembic upgrade head` either refuses outright
    # or runs one branch and silently never creates the other's tables — which is
    # how c41 reached prod. The backend job would eventually catch it, but only as
    # an opaque fixture error a minute and a half in, and not at all if the DB
    # probe had bailed first.
    #
    # This runs on the PULL REQUEST MERGE COMMIT, which is the property that
    # makes it actually solve c101: for a pull_request event GITHUB_SHA is
    # GitHub's merge of the head into the base, and actions/checkout defaults to
    # GITHUB_SHA. So this sees the branch's migrations AND main's together and
    # fails the PR *before* the merge, rather than passing on each side
    # separately and breaking main the moment they meet.
    #
    # No database and no app install — alembic reads the versions directory
    # offline, so this is the fastest gate in the file and fails first.
    name: alembic single head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install alembic
        run: pip install alembic
      - name: Assert exactly one migration head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          count="$(printf '%s\n' "$heads" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::alembic has $count heads, expected exactly 1."
            echo "Heads found:"
            printf '%s\n' "$heads"
            echo ""
            # Two heads is the symptom; a duplicated down_revision is the cause,
            # and naming the two files beats alembic's generic complaint. This
            # runs ONLY after the head count has already failed, deliberately:
            # sharing a parent is legitimate when an alembic merge revision joins
            # the branches back together, and that case is single-head and must
            # not be blocked.
            python - <<'PY'
          import collections, pathlib, re
          parents = collections.defaultdict(list)
          for path in sorted(pathlib.Path("alembic/versions").glob("*.py")):
              text = path.read_text()
              rev = re.search(r'^revision = ["\'](.+?)["\']', text, re.M)
              down = re.search(r'^down_revision = ["\'](.+?)["\']', text, re.M)
              if rev and down:
                  parents[down.group(1)].append(f"{rev.group(1)} ({path.name})")
          for parent, children in sorted(parents.items()):
              if len(children) > 1:
                  print(f"CAUSE: {len(children)} migrations all declare down_revision={parent}:")
                  for child in children:
                      print(f"  - {child}")
          PY
            echo ""
            echo "Two migrations share a parent. RE-POINT the newer one's"
            echo "down_revision at the real head - do NOT renumber it, the number"
            echo "is validly claimed on the board. See board cards c41 and c101."
            exit 1
          fi
          echo "single head: $heads"

  mobile:
    name: mobile tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      - name: Install
        working-directory: app-mobile
        run: npm ci
      - name: Type-check
        working-directory: app-mobile
        run: npx tsc --noEmit
      - name: Chart math
        working-directory: app-mobile
        # tsc cannot tell you an arc is drawn at the wrong angle - chart geometry
        # fails by rendering a confident, wrong picture rather than throwing, which
        # is exactly what verify:charts exists to catch (c118). Until this step, the
        # script only ran if a human remembered to type the command by hand.
        run: npm run verify:charts
      - name: Calendar-day rendering
        working-directory: app-mobile
        # Board card c165. A calendar day formatted as an instant renders the
        # PREVIOUS day everywhere west of Greenwich - every chapter meeting showed
        # one day early, and it was invisible to tsc, invisible to the backend suite
        # (the stored value was right), and invisible on any machine sitting at UTC.
        # verify:dates re-runs the assertions under several timezones on both sides
        # of Greenwich, and asserts the naive version still fails in them so the
        # check cannot go quietly vacuous.
        run: npm run verify:dates
      - name: Client/backend contract
        working-directory: app-mobile
        # Board card c121. tsc cannot tell you a client HTTP verb disagrees with
        # the backend route it targets - it is a string literal on both sides.
        # c115 shipped broken for days because of exactly that (POST vs the
        # backend registered PUT). This reads backend/app/routers/*.py and
        # app-mobile/src/api/*.ts as plain text - no server boot, no simulator -
        # and diffs every request() call against the real route table.
        run: npm run verify:contract

  web:
    # Board card c113. web/ is the PUBLIC MARKETING SITE and it had no gate at
    # all, so a break merged silently and surfaced at the next manual deploy.
    # That is worse than it sounds: web/ also carries the Stripe Connect return
    # and refresh bounce pages that payments.py depends on, and it deploys to
    # Firebase Hosting by hand rather than from this pipeline, so the gap between
    # "merged broken" and "someone notices" is however long it is until the next
    # deploy.
    #
    # Runs `build`, not just `typecheck`. tsc --noEmit alone would miss a broken
    # vite build - a bad import path, a missing asset, a failing plugin - which is
    # exactly the class of thing that only bites at deploy time.
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
