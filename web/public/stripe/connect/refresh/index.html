<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>That setup link expired — Chirp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<!--
  Stripe Connect refresh_url.

  Built by backend/app/routers/payments.py:40 as
  `${APP_PUBLIC_BASE_URL}/stripe/connect/refresh`. Stripe sends the user here when
  the single-use Account Link has expired or was already consumed.

  A new link can only be minted by POST /payments/connect/onboarding-link
  (payments.py:43-84), which requires an authenticated treasurer or president.
  This page has no auth by design, so it cannot mint one — it can only send the
  user back into the app to retry. Saying anything more confident than that would
  be a lie about what this page can do.
-->
<body class="on-brand">

<main class="bounce">
  <div class="bounce__card">
    <div class="bounce__mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </div>

    <h1 class="title">That setup link expired</h1>
    <p class="lede" style="margin: var(--space-4) auto 0; font-size: 15px">
      Stripe setup links are single-use and short-lived. Open Chirp and start
      payout setup again to get a fresh one.
    </p>

    <a class="btn btn--primary" href="chirp://">Open Chirp</a>

    <p class="caption" style="margin-top: var(--space-5)">
      In the app: Treasurer, then Payments, then Set up payments.
    </p>
  </div>
</main>

</body>
</html>
