<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back from Stripe — Chirp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<!--
  Stripe Connect return_url.

  Built by backend/app/routers/payments.py:40 as
  `${APP_PUBLIC_BASE_URL}/stripe/connect/return`. The path is a contract with the
  backend: if it moves, _onboarding_urls() has to move with it.

  This page deliberately does NOT try to report success or failure. Stripe sends
  the user here when the onboarding flow finishes OR is abandoned, with no query
  parameters distinguishing the two, and account verification continues
  asynchronously on Stripe's side afterwards. The app is the source of truth:
  get_chapter_payments_status() (payments.py:87-114) re-reads charges_enabled and
  details_submitted from Stripe on every call rather than trusting any
  client-supplied "I'm done" signal. So the only honest thing this page can say is
  "go back and let the app check".
-->
<body class="on-brand">

<main class="bounce">
  <div class="bounce__card">
    <div class="bounce__mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>

    <h1 class="title">You're back from Stripe</h1>
    <p class="lede" style="margin: var(--space-4) auto 0; font-size: 15px">
      We're checking your chapter's payout setup now. Verification can take a
      moment, and sometimes longer if Stripe needs another document.
    </p>

    <a class="btn btn--primary" href="chirp://">Open Chirp</a>

    <p class="caption" style="margin-top: var(--space-5)">
      If nothing happens, open the Chirp app and go to Treasurer, then Payments.
    </p>
  </div>
</main>

</body>
</html>
