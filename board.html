<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp Board</title>
<style>
  :root {
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-alt:#EFF1F7; --ground:#F6F7FB;
    --ink:#101223; --ink-2:#575B75; --ink-3:#9BA0B8;
    --line:rgba(16,18,35,.08); --border:rgba(16,18,35,.08);
    --accent:#5B5BF6; --accent-soft:#ECECFE; --success:#17A673; --success-soft:#E3F6EE;
    --danger:#E5484D; --danger-soft:#FDECEC; --warn:#F5A623; --warn-soft:#FDF3E1; --warn-ink:#B87503;
    --grad:linear-gradient(135deg,#6366F1,#8B5CF6);
    --shadow:0 1px 3px rgba(16,18,35,.05);
    --shadow-lift:0 6px 18px rgba(16,18,35,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C0D14; --surface:#15161F; --surface-alt:#1D1E2A; --ground:#0C0D14;
      --ink:#F2F3FA; --ink-2:#A6AAC4; --ink-3:#666B85;
      --line:rgba(242,243,250,.09); --border:rgba(242,243,250,.09);
      --accent:#7C7CFF; --accent-soft:rgba(124,124,255,.16); --success:#2BD597;
      --success-soft:rgba(43,213,151,.16); --danger:#FF6369; --danger-soft:rgba(255,99,105,.16);
      --warn:#FFB84D; --warn-soft:rgba(255,184,77,.16); --warn-ink:#FFB84D;
      --shadow:none; --shadow-lift:0 6px 18px rgba(0,0,0,.5);
    }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  /* App shell: the page never scrolls. Whatever view is active fills the leftover
     height and scrolls INSIDE itself — that is the whole fix for the wall of
     scroll this board used to be. */
  body { display:flex; flex-direction:column; gap:10px; overflow:hidden;
    background:var(--bg); color:var(--ink); padding:14px 16px 10px;
    font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:17px; font-weight:800; letter-spacing:-.3px; white-space:nowrap; }
  h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #status { font-size:12px; font-weight:500; color:var(--ink-3); flex:1; min-width:150px; text-align:right; }
  #status.dirty { color:var(--warn); }
  /* Only ever visible when a card cannot be drawn — see renderIntegrity(). Loud on
     purpose: the failure it reports is a card that looks filed and is not there. */
  #integrity { background:var(--danger-soft); color:var(--danger); border-radius:12px;
    padding:12px 16px; font-size:13px; font-weight:600; line-height:1.5; }
  button { font:inherit; border:0; cursor:pointer; border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface-alt); color:var(--ink-2); }
  [hidden] { display:none !important; }
  .view-toggle { display:inline-flex; background:var(--surface-alt); border-radius:999px; padding:3px; gap:2px; }
  .view-toggle button { background:none; color:var(--ink-2); padding:5px 12px; }
  .view-toggle button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  /* Status pills, shared by the drawer, area view and alpha gates. */
  .st { font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    border-radius:999px; padding:2px 7px; white-space:nowrap; }
  .st-done { background:var(--success-soft); color:var(--success); }
  .st-progress { background:var(--accent-soft); color:var(--accent); }
  .st-next { background:var(--warn-soft); color:var(--warn-ink); }
  .st-backlog { background:var(--surface-alt); color:var(--ink-3); }

  /* Alpha readiness — a strip, not a billboard. Recomputed from the cards on
     every render, never typed in by hand; the gate list expands on demand. */
  #alpha { border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:8px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); }
  .alpha__row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .alpha__row h2 { font-size:12px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
  .alpha__pct { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .alpha__row .bar { flex:1; min-width:120px; margin:0; height:6px; }
  .alpha__key { display:flex; gap:12px; font-size:11px; color:var(--ink-3); white-space:nowrap; }
  .alpha__key i { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .alpha__toggle { background:var(--surface-alt); color:var(--ink-2); padding:4px 11px; font-size:11px; }
  .alpha__toggle:hover { color:var(--accent); background:var(--accent-soft); }
  .alpha__sub { font-size:12px; color:var(--ink-3); }
  .alpha__gates { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:2px 14px; max-height:38vh; overflow-y:auto; }
  .alpha__gate { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:12px; padding:2px 0; }
  .alpha__gate.is-shipped { color:var(--ink-3); }

  /* Columns: each one owns its scroll. */
  #board { flex:1; min-height:0; display:flex; gap:10px; }
  #board .col { flex:1 1 0; min-width:0; }
  .col { display:flex; flex-direction:column; min-height:0; background:var(--surface-alt); border-radius:14px; padding:8px 8px 10px; }
  .col.drag-over { outline:2px dashed var(--accent); outline-offset:-3px; }
  .col h2 { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-2); padding:2px 6px 8px; display:flex; justify-content:space-between; }
  .col h2 .count { color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .stack { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:1px 2px 1px 1px; }
  .stack::-webkit-scrollbar { width:8px; }
  .stack::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
    padding:7px 9px 8px; cursor:pointer; flex:none;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lift); border-color:rgba(91,91,246,.35); }
  .card:active { transform:none; }
  .card.dragging { opacity:.4; }
  .card .meta { display:flex; gap:6px; align-items:center; min-height:18px; }
  /* Card id — monospace and muted so it reads as a label, not a heading.
     Selectable so an id can be copied straight out of the board. */
  .card .card-id { font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.5px;
    text-transform:uppercase; color:var(--accent); user-select:text; }
  /* The card is a headline; the full title and notes live in the drawer. Two
     clamped lines keeps ninety-odd cards readable as a wall of headlines. */
  .card .title { margin-top:3px; font-weight:600; font-size:12.5px; line-height:1.4; letter-spacing:-.005em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chip { font-size:10px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:2px 8px;
    background:var(--surface-alt); color:var(--ink-2); border:0; cursor:pointer; }
  .chip.owner-J { background:var(--accent-soft); color:var(--accent); }
  .chip.owner-Q { background:var(--success-soft); color:var(--success); }
  .chip.tag { cursor:default; }
  /* Row controls earn their pixels only when the pointer is on the card. */
  .card .copy, .card .del { opacity:0; transition:opacity .1s ease; }
  .card:hover .copy, .card:hover .del,
  .card .copy:focus-visible, .card .del:focus-visible { opacity:1; }
  .card .copy { margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:10px; font-weight:600;
    letter-spacing:.3px; border-radius:999px; padding:2px 7px; cursor:pointer; }
  .card .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .card .copy.ok { color:var(--success); background:var(--success-soft); opacity:1; }
  .card .copy.fail { color:var(--danger); background:var(--danger-soft); opacity:1; }
  .card .del { background:none; border:0; color:var(--ink-3); font-size:12px; padding:1px 5px; cursor:pointer; }
  .card .del:hover { color:var(--danger); }
  /* A left rail keyed to the column, so a card's status survives being read out
     of context — in the area view especially, where columns do not exist. */
  .col[data-col="done"] .card { border-left:3px solid var(--success); padding:5px 8px 6px; }
  .col[data-col="done"] .card .title { -webkit-line-clamp:1; }
  .col[data-col="progress"] .card { border-left:3px solid var(--accent); }
  .col[data-col="next"] .card { border-left:3px solid var(--warn); }
  .col[data-col="backlog"] .card { border-left:3px solid var(--warn); }
  .adder { margin-top:8px; flex:none; width:100%; background:transparent; border:1px dashed var(--line);
    border-radius:9px; padding:6px 10px; font:inherit; font-size:12px; color:var(--ink); outline:none; }
  .adder::placeholder { color:var(--ink-3); }
  .adder:focus { border-color:var(--accent); background:var(--surface); }
  @media (max-width:900px) {
    #board { overflow-x:auto; scroll-snap-type:x mandatory; }
    #board .col { flex:0 0 min(82vw,340px); scroll-snap-align:start; }
  }

  /* Feature-area view: the same cards grouped by what part of the app they
     build, so progress reads per surface instead of per status column. */
  #areas { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:22px; padding-bottom:6px; }
  .area-group > h2 { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:8px; }
  .area-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; align-items:start; }
  .area { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:12px 13px; }
  .area.is-empty { opacity:.55; }
  .area__h { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .area__h h3 { font-size:13.5px; font-weight:700; }
  .area__n { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:7px 0 10px; display:flex; }
  .bar i { display:block; height:100%; }
  .bar .b-done { background:var(--success); }
  .bar .b-prog { background:var(--accent); }
  .bar .b-next { background:var(--warn); }
  .area ul { list-style:none; display:flex; flex-direction:column; gap:5px; padding:0; }
  .area li { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:12px; }
  .area li b { font-weight:600; color:var(--ink); }
  .area li span.t { color:var(--ink-2); }
  .area li .cid { font-size:10.5px; color:var(--ink-3); font-weight:600; }

  /* Decisions log — its own tab, newest first, scrolls inside the shell. */
  #decisions { flex:1; min-height:0; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); padding:14px 18px; }
  #decisions h2 { font-size:14px; font-weight:800; margin-bottom:8px; display:flex; gap:8px; align-items:baseline; }
  #decisions h2 .count { font-size:11.5px; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums; }
  #decisions input.adder { margin:0 0 10px; }
  #decisions ul { list-style:none; padding:0; }
  #decisions li { margin:0; padding:7px 2px; border-top:1px solid var(--line); color:var(--ink-2);
    font-size:12.5px; line-height:1.5; }
  #decisions li:first-child { border-top:0; }
  footer { flex:none; font-size:11px; color:var(--ink-3); }

  /* Card detail drawer — the card is a headline; everything else lives here. */
  #drawer-scrim { position:fixed; inset:0; z-index:90; background:rgba(16,18,35,.38); backdrop-filter:blur(2px); }
  #drawer { position:fixed; top:0; right:0; bottom:0; z-index:91; width:min(660px,94vw);
    background:var(--surface); border-left:1px solid var(--line); box-shadow:-18px 0 50px rgba(16,18,35,.18);
    display:flex; flex-direction:column; gap:12px; padding:20px 22px 18px;
    transform:translateX(12px); opacity:0; transition:transform .18s ease, opacity .18s ease; }
  #drawer.open { transform:translateX(0); opacity:1; }
  .drawer__head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .drawer__id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:800; color:var(--accent); }
  .drawer__close { margin-left:auto; border:1px solid var(--line); background:var(--surface-alt);
    color:var(--ink-2); border-radius:999px; padding:6px 14px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
  .drawer__close:hover { color:var(--ink); }
  .drawer__title, .drawer__detail { width:100%; box-sizing:border-box; border:1px solid var(--line);
    border-radius:12px; background:var(--ground); color:var(--ink); font:inherit; padding:12px 14px; resize:vertical; }
  .drawer__title { font-size:16px; font-weight:700; line-height:1.35; }
  .drawer__detail { flex:1; min-height:220px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
  .drawer__title:focus, .drawer__detail:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .drawer__foot { display:flex; align-items:center; gap:12px; }
  .drawer__foot .copy { background:var(--surface-alt); border:0; color:var(--ink-2); font-size:12px;
    font-weight:600; border-radius:999px; padding:6px 13px; cursor:pointer; }
  .drawer__foot .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .drawer__foot .copy.ok { color:var(--success); background:var(--success-soft); }
  .drawer__hint { font-size:12px; color:var(--ink-3); }
  @media (max-width:560px) { #drawer { width:100vw; padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>Chirp <span>Board</span></h1>
  <div class="view-toggle" id="view-toggle">
    <button data-view="status" class="on">Status</button>
    <button data-view="area">Feature area</button>
    <button data-view="log">Decisions</button>
  </div>
  <div id="status">committed state</div>
  <button class="btn-ghost" id="reset">Reset to committed</button>
  <button class="btn-primary" id="export">Export board.html</button>
</header>
<div id="integrity" role="alert" hidden></div>
<section id="alpha"></section>
<div id="drawer-scrim" hidden></div>
<aside id="drawer" hidden aria-label="Card details"></aside>
<main id="board"></main>
<main id="areas" hidden></main>
<section id="decisions" hidden>
  <h2>Decisions log <span class="count" id="decision-count"></span></h2>
  <input class="adder" id="decision-add" placeholder="+ record a decision (date — what we decided)">
  <ul id="decision-list"></ul>
</section>
<footer>
  Drag cards between columns · click a card for its full title and notes · click the owner chip to cycle – / J / Q ·
  changes autosave locally, then <b>Export board.html</b> and commit the downloaded file over this one so the other dev gets it.
</footer>

ouched. Crashed runs are reclaimed by a startup sweep that decides liveness from the pid embedded in the name, so abandoned databases cannot pile up. SECOND BUG THIS EXPOSED, and the more interesting one: migrated_db ran DROP SCHEMA public CASCADE to reset the shared database. A database created by the chirp role inherits its public schema from template1, where it is owned by the bootstrap superuser, so a non-superuser cannot drop it - InsufficientPrivilegeError, 'must be owner of schema public', 154 errors on Jose's Homebrew PG14 - WHILE PASSING IN CI, where POSTGRES_USER is a superuser that owns everything. A works-in-CI-fails-locally split sitting in the suite. The reset is DELETED rather than worked around with an ownership grant, because the database is brand new by construction and there is nothing to reset. NOTE FOR HANDOFF: this obsoletes the 'ALTER SCHEMA public OWNER TO chirp' workaround written there today - after #22 the setup instruction is just 'run pytest', and leaving the grant documented will send the next person chasing something they do not need. The deadlock is also legible now: if anyone ever points two runs at one database again, the TRUNCATE raises a message naming the cause instead of 39 identical tracebacks. VERIFIED UNDER THE FAILING CONDITION ITSELF - full suite run with other sessions active: 176 passed, 3 skipped, 0 failed, 0 deadlocks, 0 leaked databases. That run exited 1 for one reason only: CHIRP_REQUIRE_DB=1 was set and this Mac has no redis-server, so the 3 fan-out tests skipped and c103's own skip ceiling caught them - working as designed, the flag is CI-only and CI has redis, and it incidentally proved that hook against the real suite rather than the scratch one it was built on. ADVERSARIAL REVIEW, run after the fix and reported here rather than quietly patched: four lenses, every finding independently refuted before acceptance - 9 raised, 5 refuted, 4 real, all four mine and all four fixed. HIGH: the stale sweep decided 'abandon       "detail": "Third session, CI lane. IMPORTANT CORRECTION TO THE ALARM, recorded first because the first version of this card overstated it: CI IS NOT CURRENTLY LYING. The real run behind PR #21 was '179 passed' with ZERO skipped - the postgres:16 AND redis:7 services both come up, every DB test runs, and CI even runs the 3 redis fan-out tests that skip on Jose's machine, which is why CI says 179 where local says 176 pass / 3 skip. Anyone who merged on that green check merged on real evidence. ci.yml has ALSO always run app-mobile `npx tsc --noEmit`. So both gates exist, both work, and nobody dropped the ball on CI setup. WHAT IS ACTUALLY WRONG is that the backend gate has no FLOOR. conftest.py's session-scoped database_url fixture calls pytest.skip() when the DB is unreachable, and skips are not failures - so the day the postgres service does not come up (image pull, health-check race, a drifted TEST_DATABASE_URL, a port change) the whole DB-backed suite skips and pytest still exits 0, posting a green check that proves nothing. MEASURED on main against a dead port: '22 passed, 157 skipped', EXIT CODE 0. 157 of 179 tests vanished and the run reported success. Latent, not live - but it is the c41 pattern again, the silent skip that reads as a pass, and it would fire in exactly the situation where nobody is looking hard. SECOND GAP: nothing checked alembic heads. FIX, on jose/c103-ci-migration-guard, PR #22, ALL THREE JOBS GREEN, NOT MERGED BY ME: (1) CHIRP_REQUIRE_DB=1, set only in ci.yml, turns the skip into a hard failure - laptop behaviour deliberately unchanged, no DB still skips; (2) a pytest_sessionfinish hook under the same flag fails the run if more than CHIRP_MAX_SKIPS (default 0) tests skipped, whatever the pass count - 0 is the right ceiling rather than a guess because a healthy CI run here skips nothing, per the 179/0 above; (3) a new 'alembic single head' job with no database and no app install that reads the versions directory offline in 13 seconds, so it is the fastest gate in the file and fails first. That job runs on the PULL REQUEST MERGE COMMIT (for a pull_request event GITHUB_SHA is GitHub's merge of head into base and actions/checkout defaults to it), so it sees a branch's migrations and main's TOGETHER - which is what makes it solve c101 instead of passing on both sides and breaking main on contact. VERIFIED, every claim: dead port + flag -> exit 1, 154 errors, message names the cause; dead port no flag -> exit 0, 157 skipped, unchanged; 1 skip + flag -> exit 1; 1 skip + flag + CHIRP_MAX_SKIPS=1 -> exit 0; heads gate on main -> PASS single head 0014; heads gate + a copy of q's 0013 -> FAIL naming both heads. ONE THING THIS PR CANNOT PROVE BY PASSING: a passing run looks identical with or without the fix, so the evidence for gap 1 is the measurements above, not the green check. LAST, worth stating plainly so nobody reads it as more than it is: app-mobile has NO test harness at all, only tsc. 'mobile tsc' passing means IT COMPILES, never that it works. Every behavioural claim about the app still rests on someone opening it."

      "area": "infra",
      "detail": "FIXED in PR #13. pubsub.subscribe() ran AFTER websocket.accept() with no try/except, so an unreachable Redis raised mid-handler and the client saw a socket that opened and instantly died: shaped exactly like a flaky network, with nothing server-side saying the cause was missing infrastructure. Since c61 proved Redis was never provisioned in prod, that was EVERY connection, not an edge case. Now closes with 4503 (mirrors HTTP 503) and logs at error level. The split from 4401 is the entire point: 4401 means the session is bad and the user should be sent to sign-in, 4503 means the session is fine and the client should back off \u2014 one generic code would let a Redis outage silently sign every user out. Teardown is suppressed too, so a Redis death mid-connection cannot raise in the finally block and mask whatever actually ended the connection. 3 tests in backend/tests/test_ws_redis_down.py, deliberately a separate file from Q's test_ws_fanout.py so PR #12 and PR #13 do not collide. Proven load-bearing by restoring the unguarded subscribe and watching the two behavioural tests fail, while the third (auth resolves BEFORE anything touches Redis) correctly kept passing since that ordering was never broken. 145 backend tests green. REVIEW FOLLOW-UP Aug 15: reviewing my own PR found TWO more bugs in this very fix. (1) The teardown sat on the wrong side of a re-raise \u2014 awaiting the forward task re-raises whatever it stored, and suppress(CancelledError) does not catch a ConnectionError, so a Redis that died after subscribe skipped the pubsub cleanup entirely and the exception escaped the finally block. CancelledError is a BaseException; suppressing one of the two lets the other through. (2) Nothing observed the forwarder dying at all: the handler only awaited the client drain, so a Redis dropping AFTER connect left the socket open delivering zero events with no log and no close frame \u2014 the exact c62 symptom, moved from connect time to steady state.       "detail": "CODE DONE, PR #19. campus_id removed from UserCreate and UserUpdate; bootstrap leaves the column null; the .edu redemption in c86 will be its only writer. SCOPE CORRECTION, recorded because the first telling overstated it: the deployed app NEVER exploited this - account-type.tsx sends email, display_name and account_type only, so every real signup already got a null campus. It was an open door nobody had walked through, not an active path. Removing the field beats validating it here because _Schema does not set extra=forbid, so an older client still sending campus_id has it IGNORED rather than 422d - no signup outage. THE FINDING INSIDE THE FINDING: removing it broke 23 tests, because bootstrapping with a claimed campus was the ONLY way anything in the suite assigned one. The vulnerability WAS the mechanism, which is exactly why a five-lens security review missed it - that review asked whether scoping was applied consistently, and it is. Tests now use a set_campus helper writing the column directly, the same shape _grant_platform_admin already uses. KNOWN CONSEQUENCE: a brand-new signup has no campus and therefore no campus feed or Yak until c86 ships; per the two-tier decision, chapter membership still grants org content, so the alpha path is unaffected. ORIGINAL: CAMPUS IS SELF-ASSERTED \u2014 ANY USER CAN READ ANY UNIVERSITY'S FEED AND YAKS TODAY. Found Aug 16 while designing the .edu rule, and it is the reason that rule is not a new restriction but the boundary itself. POST /auth/bootstrap takes campus_id STRAIGHT FROM THE REQUEST BODY (routers/auth.py:58, schemas/identity.py:37 UserCreate.campus_id) and writes it with no check against anything. UserUpdate.campus_id exists too, so it can be changed later at will. The campus feed's guard at routers/feed.py:113 is 'if user.campus_id != campus_id: 403' \u2014 which compares the path against a value THE USER CHOSE, so it enforces consistency and not identity. Note why the Aug 15 five-lens review missed it: the authorization lens checked that campus and org scoping were applied CONSISTENTLY everywhere, and they are. It never asked whether campus_id was trustworthy in the first place. FIX, and it is small and should land before any verification feature: campus_id becomes SERVER-OWNED. Remove it from UserCreate and UserUpdate, have bootstrap leave it null, and let the only writer be the verification flow in c86. A user with no verified campus simply has no campus feed \u2014 which is the correct state for someone who has not proven anything."

      "detail": "Seen on the wire during c94's live verification, on every single sign-in, both before and after that fix: GET /auth/me returns 401, then a second GET /auth/me returns 200. The cause is a token race that mirrors c94's session race one layer down. signInWithEmail (src/auth/session.ts) only calls setAuthToken AFTER awaiting credential.user.getIdToken(), but Firebase fires onAuthStateChanged as soon as the credential lands - so SessionProvider's listener calls loadMe() and fetchMe() goes out with no bearer token attached. WHY IT IS MORE THAN COSMETIC: a 401 is not a 404, so loadMe treats it as a transient failure and SPENDS ONE OF ITS THREE RETRIES on it, on every sign-in, before the user is even through the door. On a good network the token lands almost immediately and the recovery is invisible (measured ~1s to /feed), but on a bad one the budget that exists to survive real network trouble has already been partly consumed by a self-inflicted failure. It also means the c94 fix's wait is longer than it needs to be. FIX: have the SessionProvider auth listener set the token itself before calling loadMe (await firebaseUser.getIdToken() then setAuthToken), or make loadMe not count a 401-with-no-token-set against the retry budget. Prefer the former - it removes the failed request instead of tolerating it. Touching a shared file (SessionProvider), so claim it here first. FIXED Aug 16, commit 4a22a98, and the diagnosis held exactly. The auth listener now awaits firebaseUser.getIdToken() and calls setAuthToken BEFORE calling loadMe, and clears the token on sign-out. It is not redundant with signInWithEmail or the root layout's onIdTokenChanged, both of which also set the token: it is the only one ORDERED before the fetch that needs it, which was the whole bug. A failed token fetch still falls through to loadMe rather than stranding the session. VERIFIED LIVE against prod, both paths that showed the 401: a fresh sign-in now makes exactly ONE /auth/me call returning 200, and a cold page reload with a restored session likewise - zero 401s anywhere in either network trace, where before each produced a 401 followed by a 200. tsc clean."

tion plus a deploy, and every live user has campus_id NULL. c104 is the constraint: c96 must NOT deploy alone, because it grants campus on chapter join and bypasses Jose's own c88 ruling until c88's verification gate exists. c88 depends on c86 (migration 0015, in flight now) which depends on c87 (done, on Resend). So the safe order is c86/c88 lands, THEN migrate, THEN redeploy - migrate first, never the reverse. ALSO QUEUED FOR JOSE, from the security lane's live prod audit and not yet carded separately: Cloud Run runs as the default compute SA with roles/editor project-wide; Cloud SQL chirp-db has deletionProtection=false, a public IPv4 and sslMode=ALLOW_UNENCRYPTED_AND_ENCRYPTED; /docs and /openapi.json are public; the Firebase browser key has no referrer restrictions. Auth enforcement itself audited CLEAN, and the Stripe webhook audited clean (fails closed at 503, verifies before parsing, two-layer replay dedup). That audit is 6 of 9 lenses - mobile client, web/hosting and infra/deploy are unaudited because the session hit its usage limit. THE CROSS-CUTTING HAZARD EVERY SESSION HIT TODAY, recorded here so it is not relearned a seventh time: six or seven pytest runs were sharing one chirp_test on 5432 and tearing down each other's schema, producing failure walls of 72 and 76 on trees that are actually green. DO NOT TRUST ANY SUITE NUMBER FROM TODAY unless the session states it used an isolated database. Per lane: createdb, then ALTER SCHEMA public OWNER TO chirp, or you get ~154 bogus 'must be owner of schema public' errors that look exactly like broken code. WHO IS WHERE: email session on c86/c88 (migration 0015, campus gate, closing three scattered copies of the old check plus two holes it found - a third inline copy in yaks.py vote_yak and a campus-wide WRITE in feed.py create_post with no campus check at all); invites session on c105 (migration 0016, PR within the hour); CI session on c103/c106; officer session holding c84, c91, c80, c77, c78 and starting c91; ing, and removing someone else's post is a more powerful act than reading it. RECOMMENDATION IF JOSE WANTS ONE: leave it e-board-scoped. c105 bounded the exposure, the check already requires a real role on that specific campus, and locking a moderator out of an active incident because their yearly re-check lapsed is a worse failure than the one being prevented. Cheap to revisit - one function. SCOPE NOTE: block_yak_author in the same file DID carry a literal fourth copy of the old campus_id comparison and was fixed under c88. This card is only about the e-board paths."

      "detail": "Found Aug 16 while starting c90, and it is a DEPLOY-ORDER hazard rather than a bug in either half. PR #26 is correct and safe to MERGE. It is not safe to DEPLOY on its own, and the reason is on the client. THE CLIENT MAKES THE EXACT MISTAKE THE SERVER JUST STOPPED MAKING. app-mobile feed/index.tsx:77 and yak/index.tsx:76 both branch on `user.campus_id ?? null` - if campus_id exists they call the endpoint, if it is null they render a designed empty state. That was right when campus_id was the whole gate. Since c88 it is not: a chapter-joined user HAS a campus_id and is still refused, so they take the call-the-endpoint path and hit a 403. WHAT THE USER ACTUALLY SEES: feed/index.tsx load() is `catch { setLoadState(\"error\") }` - one bare catch, no status inspection. So campus_unverified renders as a GENERIC ERROR, indistinguishable from the wifi being down. That is strictly worse than today's honest 'your account isn't linked to a campus' empty state, and it is precisely the outcome Jose ruled against on Aug 16 when he asked for a real verify screen rather than an empty feed or a bare error toast. SO THE DEPLOY SEQUENCE IS THREE THINGS, NOT TWO. c104 already says c96 must not deploy without c88. This card adds the other end: c88 must not deploy without a client that can tell campus_unverified from a network failure. Deploying c96+c88 alone converts a clear dead end into a confusing one. THE MINIMAL FIX IS MUCH SMALLER THAN c90, and worth separating: read GET /auth/campus-verification (it exists, it ships in PR #26, and it returns verified plus verified_at precisely so the client can branch) and render a designed empty state for unverified. That unblocks the deploy. The FULL c90 screen - the form on the screen that refused you, with all six states - is the real destination and can follow. NOTE FOR WHOEVER TAKES IT: the status endpoint returns verified_at even when verified is false, on purpose, so a LAPSED yearly re-check gets 'your verification expired' rather than 'verify your .edu'. A returning student should not be told they have never been here. Do not collapse those two states."

      "detail": "HARD BLOCKER FOUND Aug 16 BEFORE ANY OPTION CAN BE CHOSEN - the account cannot do it. `gh api repos/QueBrau/Chirp` returns permissions admin:false, maintain:false for JoesyP; only push/pull/triage. Branch protection is an ADMIN-ONLY setting, so every option on this card, including the recommended one, needs either Q (the repo owner) to apply it or Q to grant Jose admin first. There is also no protection object on main today at all - the API returns 404, which confirms 'CI advisory, no branch protection' is literally true rather than just conventional. So the decision is still Jose's, but the ACTION is Braulio's, and that is a message to Q rather than a task anyone here can pick up. ORIGINAL: Filed Aug 16 by the roll-up session, on the CI session's finding and the invites session's explicit statement that this is the one gap their guard CANNOT cover. THE FACT: GitHub does not re-run a pull request's workflows when the base branch moves. So a PR's checks answer a question about main as it was when they last ran, and if main has moved since, the green is stale - it is a property of the RUN, not of the PR. PROVEN, not theorised, on this repo today: PR #24 sat MERGEABLE / CLEAN with two passing checks and NO alembic head gate at all, because its last run predated PR #22 merging the gate into the workflow file. Merging it on that green would have put two alembic heads on main - 0015 and 0016 both parented on 0017 - and the next person to run migrations against prod would have been the one to find out. It was caught by a session simulating the merge by hand, not by any check. NEAR MISS WORTH RECORDING: PR #26 was merged in the same window and its checks were ALSO pre-gate. It happened to be safe because 0015 was the only child of 0017 at that moment. That is luck, and the merge was mine, so this card exists partly because I got the right outcome for the wrong reason. THIS IS THE FOURTH SILENT-GREEN OF THE DAY and the only one still open. The other three are closed: a suite that skipped and still exited 0 (c103, fixed in PR #22); a card that parses fine and renders nowhere (fixed in c01d4e0, red banner plus scripts/board-check); a commit sitting on a branch nobody reads, where git commit and git push both succeed and the board simply never changes (fixed by the branch guard in the same commit). All four share one shape: a green signal that answers a question nobody asked. JOSE'S DECISION, and it is genuinely his because it reverses a call he made deliberately: the real fix is branch protection on main with 'require branches to be up to date before merging', which forces a re-run whenever the base moves. He has kept CI ADVISORY on purpose and no branch protection exists. OPTION A, turn on require-up-to-date for main only - closes this class entirely, costs a re-run and a wait on every merge that follows another merge, which with five sessions merging in a burst is real friction. OPTION B, leave CI advisory and adopt a manual rule: before merging, if main has moved since the PR's last run, push an empty commit or re-run checks and wait. Cheap, free, and depends on somebody remembering, which is exactly what failed today. OPTION C, a merge-queue, correct and more setup than this project wants right now. MY RECOMMENDATION IS A, scoped to main and to the three existing jobs, because the friction it adds is bounded and predictable while the failure it prevents is silent and lands on prod migrations. Note it does NOT make CI blocking in the sense Jose rejected - required-checks and up-to-date are separate settings, and A can be taken without making any check a merge blocker."

      "detail": "Claimed Aug 22, branch jose/c126-suspension-enforcement (worktree /Users/joseperdomo/Desktop/chirp-c126). From the approved security-hardening list, items 3 and 4, one card and one PR since they're related. VERIFIED BEFORE BUILDING rather than assumed: users.suspended_at / suspension_reason / suspended_by all exist (identity.py:57-59), so this is a wiring gap, not a missing data model - the ticket's size is as scoped, not bigger. (1) UserOut (identity.py, wrapped by MeOut) has no suspension field at all, and is used ONLY in self-facing contexts - POST /auth/bootstrap and GET /auth/me, never another user's view - so adding suspended_at here cannot leak anyone else's status. (2) The HTTP precedent is middleware/auth.py's get_current_user: `if user.suspended_at is not None: raise 403`, checked once at the one place every router's current-user dependency passes through. ws/gateway.py's websocket_gateway resolves the user at connect time and never makes this check - accepts unconditionally. Matching the HTTP pattern rather than inventing one: check at connection time, refuse with a distinct WS close code (4401 already means 'credentials didn't resolve to a user' per the existing comment; suspension is a different case - a resolved user who is blocked - same split as HTTP's 401 vs 403). SCOPE NOTE, stated up front: this closes new connections, matching what the ticket asks and what the HTTP precedent itself does (checked per-request, not continuously monitored). An already-open WS session for a user suspended mid-session is a different problem (would need periodic re-checks or a suspend-triggered kill) and is NOT part of this ticket - flagging it as a known residual gap rather than silently leaving it unmentioned. Tests: suspended user gets the field in MeOut, suspended user is refused at the gateway, non-suspended path unchanged on both. sally is taking c127/c128 in parallel - no overlap, different files. BUILT Aug 22, PR #55, branch jose/c126-suspension-enforcement. UserOut gains suspended_at, safe because it's self-facing only (grepped every call site: POST /auth/bootstrap, GET /auth/me, never another user's view). WS gateway mirrors the HTTP precedent exactly (suspended_at is not None -> refuse), new close code WS_ACCOUNT_SUSPENDED=4403 distinct from 4401 the same way HTTP splits 401/403. SCOPE HELD: closes new connections only, matching what HTTP does (checked per-request) - an already-open socket for someone suspended mid-session is a different problem, not built here. REAL FINDING, not assumed - a test that expected a 403 on /auth/me while suspended got 200 instead. GET /auth/me does NOT go through get_current_user at all; its own docstring says why, predating c76 by design (unregistered caller needs 404, not 401), and nobody revisited it when c76 landed. So /auth/me was NEVER suspension-gated - a suspended account gets a full 200 with real profile and memberships today, on main, before this change, while every other authenticated route 403s them. This field's addition makes that gap OBSERVABLE for the first time. Documented in the schema comment, the mobile type comment, and the test file rather than silently patched - whether /auth/me SHOULD be suspension-gated too is a separate, unresolved product question, not answered here. EVIDENCE: tests cover null-when-never-suspended, the real (200, field set) behavior once suspended plus a sibling route still 403ing the same caller, a schema-level test independent of route enforcement, and three WS cases (refused/still-connects/unsuspend-restores) - none need Redis, same as the existing 4401 tests. No migration - suspended_at already existed. Single alembic head (0013, chained onto 0016 per this project's numbering convention), unchanged. tsc clean. 285 pass / 3 skip / 0 fail on a fresh isolated db. MERGED Aug 22, PR #55, d512e62. Manager verified before merging: the self-facing-only claim checked against every UserOut usage site (holds), the gateway check sits before accept() mirroring the 4401 path, and the unsuspend-restores test pins that the column is read fresh per attempt. RULING on /auth/me (see decisions log): it stays reachable for suspended users, deliberately - the accident becomes the design, on the record, Jose can veto. FOLLOW-ON CARD: c129, the client side of this - nothing renders suspended_at or handles WS 4403 yet."

      "detail": "Client side of c126 (PR #55, merged). Backend now tells the truth - MeOut.suspended_at is non-null for a suspended caller (deliberately, per the manager's ruling: /auth/me is the ONE route that stays reachable while suspended, precisely so the client can render this), and the WS gateway closes with 4403 instead of accepting. The app currently does NOTHING with either signal. WHAT TO BUILD: a clear 'account suspended since <date>' state wherever the session resolves MeOut with a non-null suspended_at, instead of letting every other screen fail as a wall of unexplained 403s (their detail is already the machine-readable string 'account_suspended' - funnel it to the same state wherever it surfaces, not just from MeOut). WS: on a 4403 close, route to the same state instead of the normal reconnect-with-backoff loop - reconnecting into a suspension is pointless traffic and confusing UX (repeatedly failing silently). SCOPE, held deliberately: render the state well, do not build an appeals flow - that is a different, larger feature. DESIGN.md is binding - no default-looking UI, even for a wall; this screen is a real state a real user can land on and deserves the same craft bar as anything else in the app. BUILT Aug 22, PR #57, branch jose/c129-suspended-screen. SessionProvider gains a 'suspended' status set in loadMe's existing fetchMe branch (non-null suspended_at routes there instead of 'ready', still carries user/memberships for the screen to render). (tabs) auth guard redirects to /suspended the same way it already redirects signedOut/unregistered. New screen: danger-toned accent bar and icon rather than gold - DESIGN.md's one-gold-moment rule targets product surfaces, and gold on a suspension notice would read tone-deaf; documented as a considered exception, not an oversight. Shows suspended-since-date, names that a moderator decided it, sign-out as the only action - no appeals flow, scope held. REAL FINDING on the WS half, not assumed: grepped app/ and     "Aug 16 - Process, and it was established by a session getting it WRONG and being corrected by the session it was trying to authorize: A PEER SESSION CANNOT EXPAND ANOTHER SESSION'S SCOPE, however small the change looks. The roll-up session told the read-only security session to go ahead and ship three fixes it had found - close /docs and /openapi.json outside local, add a USER line to the Dockerfile, add a .dockerignore - on the reasoning that all three were additive, reversible and tiny. The security session DECLINED, on the grounds that Jose had scoped it as a read-only review of main and prod, so moving it from auditing to writing code is his call and not a peer's. It was right and the roll-up session withdrew the approval in the same turn. THE RULE, in the phrasing that came out of it: BLAST RADIUS IS NOT THE TEST, WHOSE CALL IT IS, IS THE TEST. Reasoning about how safe the code is answers a different question from who is allowed to write it, and the small-and-reversible case is exactly where the rule gets quietly skipped, because there is never a visible cost to skipping it. TWO SUPPORTING POINTS WORTH KEEPING: (1) if scope expansion could be granted by whichever peer asks, the boundary Jose set would only ever be as strong as the most confident session in the fleet; (2) part of what makes an audit worth reading is that the auditor did not touch the code it reviewed, so trading that for three kwargs and a Dockerfile line is a bad trade even when the three fixes are correct. The same session had already declined c105 ownership from a different peer earlier the same day, for the same reason, which is why this is a pattern and not an incident. PRACTICAL FORM: a peer may ROUTE work to a session that already has the scope for it, and may recommend a scope change to Jose, but may not grant one.",
