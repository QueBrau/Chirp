<style>
  :root {
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-alt:#EFF1F7; --ink:#101223;
    --ink-2:#575B75; --ink-3:#9BA0B8; --border:rgba(16,18,35,.08);
    --accent:#5B5BF6; --accent-soft:#ECECFE; --success:#17A673; --success-soft:#E3F6EE;
    --danger:#E5484D; --danger-soft:#FDECEC; --warn:#F5A623;
    --shadow:0 2px 16px rgba(16,18,35,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C0D14; --surface:#15161F; --surface-alt:#1D1E2A; --ink:#F2F3FA;
      --ink-2:#A6AAC4; --ink-3:#666B85; --border:rgba(242,243,250,.09);
      --accent:#7C7CFF; --accent-soft:rgba(124,124,255,.16); --success:#2BD597;
      --success-soft:rgba(43,213,151,.16); --danger:#FF6369; --danger-soft:rgba(255,99,105,.16);
      --shadow:none;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  h1 span { color:var(--accent); }
  #status { font-size:12.5px; font-weight:500; color:var(--ink-3); flex:1; }
  #status.dirty { color:var(--warn); }
  button { font:inherit; border:0; cursor:pointer; border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface-alt); color:var(--ink-2); }
  #board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:start; }
  @media (max-width:900px){ #board { grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ #board { grid-template-columns:1fr;} }
  .col { background:var(--surface-alt); border-radius:20px; padding:12px; min-height:120px; }
  .col.drag-over { outline:2px dashed var(--accent); outline-offset:-4px; }
  .col h2 { font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-2); padding:4px 8px 10px; display:flex; justify-content:space-between; }
  .col h2 .count { color:var(--ink-3); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:10px 12px; margin-bottom:8px; cursor:grab; }
  .card.dragging { opacity:.4; }
  .card .title { font-weight:600; font-size:14px; }
  .card .meta { display:flex; gap:6px; margin-top:8px; align-items:center; }
  .chip { font-size:11px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:3px 10px; background:var(--surface-alt); color:var(--ink-2); border:0; cursor:pointer; }
  .chip.owner-J { background:var(--accent-soft); color:var(--accent); }
  .chip.owner-Q { background:var(--success-soft); color:var(--success); }
  .chip.tag { cursor:default; }
  .card .copy { margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:11px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:3px 9px; cursor:pointer; }
  .card .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .card .copy.ok { color:var(--success); background:var(--success-soft); }
  .card .copy.fail { color:var(--danger); background:var(--danger-soft); }
  .card .del { background:none; border:0; color:var(--ink-3); font-size:14px; padding:2px 6px; cursor:pointer; }
  .card .del:hover { color:var(--danger); }
  .adder { width:100%; background:transparent; border:1px dashed var(--border); border-radius:12px; padding:9px 12px; font:inherit; font-size:13px; color:var(--ink); outline:none; }
  .adder::placeholder { color:var(--ink-3); }
  .adder:focus { border-color:var(--accent); background:var(--surface); }
  #decisions { margin-top:28px; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:16px 20px; }
  #decisions h2 { font-size:16px; font-weight:700; margin-bottom:10px; }
  #decisions li { margin:6px 0 6px 18px; color:var(--ink-2); font-size:13.5px; }
  #decisions li b { color:var(--ink); }
  #decisions input { width:100%; margin-top:10px; }
  footer { margin-top:16px; font-size:12px; color:var(--ink-3); }
</style>
</head>
<body>
<header>
  <h1>Chirp <span>Board</span></h1>
  <div id="status">committed state</div>
  <button class="btn-ghost" id="reset">Reset to committed</button>
  <button class="btn-primary" id="export">Export board.html</button>
</header>
<main id="board"></main>
<section id="decisions">
  <h2>Decisions log</h2>
  <ul id="decision-list"></ul>
  <input class="adder" id="decision-add" placeholder="+ record a decision (date — what we decided)">
</section>
<footer>
  How it works: drag cards between columns · click the owner chip to cycle – / J / Q · double-click a title to edit ·
  changes autosave locally, then <b>Export board.html</b> and commit the downloaded file over this one so the other dev gets it.
</footer>

    "Aug 13 \u2014 Payments: Stripe Connect EXPRESS accounts + DIRECT charges. The chapter is merchant of record, funds land in the chapter's balance, the chapter carries chargeback liability \u2014 Chirp never takes custody of the money. Platform fee 1% card / 2% ACH as application_fee_amount (ACH still lands cheaper for the chapter all-in, ~2.8% vs ~3.9%). The member picks the rail BEFORE the intent is created, because application_fee_amount is immutable once a PaymentIntent exists and PaymentSheet would otherwise pick the rail afterwards. Saved cards use a Stripe Customer per (member, chapter): under direct charges the Customer lives on the connected account, so a users.stripe_customer_id column works for the first chapter and silently breaks the second.",

    "Aug 14 \u2014 Process: migration-number rule earned its keep. As 0006 the Stripe migration would have been silently skipped on a prod already stamped past it \u2014 Alembic marks it applied and moves on, so processed_stripe_events and the unique index on ledger_entries.stripe_payment_intent_id would simply not exist, with nothing erroring and the webhook-replay guard absent on the money path. Renumbered to 0008, chain verified linear/single-head on main. Next free number: 0009 \u2014 claim it here first.",

    "Aug 14 \u2014 Backend: added GET /campuses/{campus_id} (Jose, c46). Trivial route, but it closes a real gap \u2014 users.campus_id existed with no way to resolve it to a name, which is WHY Profile and the Yak header hardcoded a mock campus. Any registered caller may read one; campus name/slug are public-facing labels, not org-scoped data. 3 tests. No migration.",
    "Aug 14 \u2014 Process: near-miss avoided. Jose's de-mock sweep and Q's c34 both wanted app/(tabs)/feed/index.tsx within the same hour; Q had claimed it on the board first (branch q/feed, migration 0009), so Jose dropped his changes to that ONE file and kept the rest. This is the roster-names collision from earlier today NOT happening, because the claim was on the board. Both devs independently reached the same root cause, which is also a good sign the finding is real.",
    "Aug 14 \u2014 Audit finding (13-agent sweep, every claim adversarially verified): the gap between 'backend is live' and 'the app shows real data' is BIGGER than the board implied, and it is not the USE_MOCKS flag. USE_MOCKS is false in every build (no .env or eas.json ever sets it), so those api-layer branches are dead code \u2014 the real problem is screens importing MOCK_* constants directly and using them as the signed-in identity. Home feed, Profile, Family Tree, Event detail, org Feed segment and the DM thread are all affected; filed as c34 (sharpened), c46 (Jose) and c47 (Q). Rule going forward: a screen must source identity from useSession()/useOwnChapter(), never from @/mocks/data \u2014 cosmetic-only mock imports (theme colors, campus label) are the sole allowed exception and should carry a comment saying so.",
    "Aug 14 \u2014 Process: the audit also closed two stale cards (c20 Firebase project, c26 events backend) that had been sitting in Next/backlog while the work was already Done and on prod, and found three more that overstate what is left (c5, c35, c36). Lesson: cards get moved when work lands, not when someone happens to notice; a stale board costs more than no board because it is trusted.",
    "Aug 14 \u2014 Infra: prod is CURRENT with main for the first time since sprint 0 \u2014 migration 0008 applied by Jose, then rev chirp-api-00007-kff shipped PRs #2, #3 and #7 in ONE redeploy. Ordering rule confirmed and now in INFRA-PRIVATE.html: MIGRATE FIRST, THEN DEPLOY. The Cloud Run deploy does not run migrations, and the post-#3 code selects ledger_entries.stripe_payment_intent_id, which does not exist until 0008 runs \u2014 deploying first would have 500'd the treasurer ledger. Also learned: cloud-sql-proxy is NOT bundled with the gcloud SDK and was missing entirely on Jose's Mac; the install command is now a documented prerequisite in the migration runbook.",
    "Aug 14 \u2014 Process: c43 SPLIT along the consumer line \u2014 whoever consumes an endpoint designs it. Q builds posts-with-counts inside c34 (he is wiring the feed that calls it); Jose builds events-with-rsvp-counts with c44 (events backend is his). This is the lesson from the roster-names overlap applied in advance: one owner per shape, no parallel competing mechanisms.",

    "Aug 14 \u2014 Engineering: with-counts routes use correlated scalar subqueries, never join+COUNT(DISTINCT). Joining posts to both post_likes and post_comments multiplies rows before counting (3 x 4 = 12) and COUNT(DISTINCT) hides it while making the query slower. Pattern: routers/feed.py _post_counts_select.",
    "Aug 15 \u2014 Money: dues payment intents are now PERSISTED and RESERVED before Stripe is called (migration 0010, dues_payment_intents + a partial unique index on (dues_cycle_id, user_id) WHERE status IN ('open','succeeded')). The old design only recorded a payment AFTER its webhook settled, so during ACH's multi-day 'processing' window nothing in the DB knew a payment was in flight: the cycle still read as unpaid, and because the Stripe idempotency key was scoped per-rail (dues:{cycle}:{user}:{rail}) a retry on the other rail created a GENUINELY different PaymentIntent. Both would succeed and both would append to an append-only ledger. Reserve-then-call is the fix; the ledger partial unique index is the backstop, and payment_failed/canceled webhooks now RELEASE the reservation so a genuinely failed payment can still be retried.",

<script>
(function () {
  var DATA = document.getElementById('board-data');
  var LS_KEY = 'chirp-board-draft';
  var committed = JSON.parse(DATA.textContent);
  var state = committed;
  try {
    var draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (draft && draft.updated > committed.updated) { state = draft; setStatus('local draft — export & commit to share', true); }
  } catch (e) {}

  var boardEl = document.getElementById('board');

  function setStatus(text, dirty) {
    var s = document.getElementById('status');
    s.textContent = text; s.className = dirty ? 'dirty' : '';
  }
  function persist() {
    state.updated = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    setStatus('unsaved changes — export & commit to share', true);
    render();
  }
  function cardById(id) { return state.cards.filter(function (c) { return c.id === id; })[0]; }

  /**
   * Copy `text`, then flash the result on the button itself.
   * navigator.clipboard needs a secure context and this board is normally opened
   * straight off disk (file://), where it's commonly unavailable or rejects — so
   * fall back to a throwaway textarea + execCommand rather than silently no-op.
   */
  function copyText(text, btn) {
    var label = btn.dataset.label;
    function flash(ok) {
      btn.textContent = ok ? 'copied' : 'copy failed';
      btn.className = 'copy ' + (ok ? 'ok' : 'fail');
      setTimeout(function () { btn.textContent = label; btn.className = 'copy'; }, 1200);
    }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      flash(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, legacy);
    } else {
      legacy();
    }
  }

  function render() {
    boardEl.innerHTML = '';
    state.columns.forEach(function (col) {
      var colEl = document.createElement('div');
      colEl.className = 'col'; colEl.dataset.col = col.id;
      var cards = state.cards.filter(function (c) { return c.col === col.id; });
      var h = document.createElement('h2');
      h.innerHTML = col.title + ' <span class="count">' + cards.length + '</span>';
      colEl.appendChild(h);
      cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'card'; el.draggable = true; el.dataset.id = c.id;
        var t = document.createElement('div'); t.className = 'title'; t.textContent = c.title;
        var meta = document.createElement('div'); meta.className = 'meta';
        var owner = document.createElement('button');
        owner.className = 'chip owner-' + (c.owner || 'none');
        owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
        owner.onclick = function () { c.owner = c.owner === '' ? 'J' : c.owner === 'J' ? 'Q' : ''; persist(); };
        meta.appendChild(owner);
        if (c.tag) { var tag = document.createElement('span'); tag.className = 'chip tag'; tag.textContent = c.tag; meta.appendChild(tag); }
        var copy = document.createElement('button');
        copy.className = 'copy'; copy.textContent = 'copy'; copy.dataset.label = 'copy';
        copy.title = 'Copy this card’s text';
        copy.onclick = function (ev) { ev.stopPropagation(); copyText(c.title, copy); };
        meta.appendChild(copy);
        var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
        del.onclick = function () { if (confirm('Delete card?')) { state.cards = state.cards.filter(function (x) { return x.id !== c.id; }); persist(); } };
        meta.appendChild(del);
        t.ondblclick = function () { var v = prompt('Edit card', c.title); if (v) { c.title = v; persist(); } };
        el.appendChild(t); el.appendChild(meta);
        el.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
        el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
        colEl.appendChild(el);
      });
      var adder = document.createElement('input');
      adder.className = 'adder'; adder.placeholder = '+ add card';
      adder.onkeydown = function (ev) {
        if (ev.key === 'Enter' && adder.value.trim()) {
          state.cards.push({ id: 'c' + Date.now(), col: col.id, title: adder.value.trim(), owner: '', tag: '' });
          persist();
        }
      };
      colEl.appendChild(adder);
      colEl.addEventListener('dragover', function (ev) { ev.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', function () { colEl.classList.remove('drag-over'); });
      colEl.addEventListener('drop', function (ev) {
        ev.preventDefault(); colEl.classList.remove('drag-over');
        var id = ev.dataTransfer.getData('text/plain');
        var c = cardById(id); if (c && c.col !== col.id) { c.col = col.id; persist(); }
      });
      boardEl.appendChild(colEl);
    });
    var dl = document.getElementById('decision-list');
    dl.innerHTML = '';
    state.decisions.forEach(function (d) { var li = document.createElement('li'); li.textContent = d; dl.appendChild(li); });
  }

  document.getElementById('decision-add').onkeydown = function (ev) {
    var inp = ev.target;
    if (ev.key === 'Enter' && inp.value.trim()) { state.decisions.push(inp.value.trim()); inp.value = ''; persist(); }
  };
  document.getElementById('reset').onclick = function () {
    if (confirm('Discard local draft and reload the committed board?')) {
      localStorage.removeItem(LS_KEY); state = committed; setStatus('committed state', false); render();
    }
  };
  document.getElementById('export').onclick = function () {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#board').innerHTML = '';
    clone.querySelector('#decision-list').innerHTML = '';
    clone.querySelector('#status').textContent = 'committed state';
    clone.querySelector('#status').className = '';
    clone.querySelector('#board-data').textContent = '\n' + JSON.stringify(state, null, 2) + '\n';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'board.html'; a.click();
    URL.revokeObjectURL(a.href);
    setStatus('exported — replace board.html in the repo and commit', false);
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  };

  render();
})();
</script>
