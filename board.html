    "Aug 16 - Product, and it ANSWERS the c96 scope question above: CHAPTER MEMBERSHIP GRANTS CHAPTER CONTENT ONLY. Campus feed and Yak stay strictly behind .edu verification, with NO exception for the campus_id that c96 now derives from a chapter join. Jose's call, made against four options, one of which was to let a chapter-derived campus count as sufficient. It does not. The engineering consequence is precise and easy to get wrong: c88's dependency must check the VERIFICATION TIMESTAMP, not merely a non-null campus_id, because c96 made non-null campus_id reachable with no email at all - a gate written the obvious way would be a bypass on day one. Jose also asked for a second tier inside chapter content, a chapter-public surface plus an actives-only one, which is a separate feature and is now c102 rather than scope creep on c88.",
    "Aug 16 - Infra: RESEND IS THE EMAIL PROVIDER (c87), AND WE ARE SHIPPING IT WITHOUT A SENDING DOMAIN ON PURPOSE. Key in Secret Manager next to the Stripe keys, one small interface in front of it so the verification code, future receipts and the privacy policy's removal notice all share a path, and the domain swap later is config rather than a rewrite. THE TRADEOFF, accepted with the constraint stated rather than discovered later: with no verified domain, Resend restricts sends to our own account address, so c87 and c86 can be built and PROVEN end to end against our inbox but cannot deliver to a real student. Combined with the .edu decision above, that puts c73's domain purchase ON THE ALPHA PATH rather than after it - Yak and the campus feed cannot function for a real student until mail can reach them. Naming it now because the previous campus deferral (see c96) went wrong in exactly this way: a dependency was judged by what it blocked rather than by what it was the only source of.",
    "Aug 16 - Infra: c74 TAKES THE NO-DOMAIN PATH TOO. Rather than wait on c73 for a support@ alias, a plain second Gmail becomes the published contact address, so the address students are told to email stops being the address that can reset every credential in the business. Interim by design; a real support@ forwarding into a non-owner mailbox is still where this lands. Cheap because the address is centralised as CONTACT_EMAIL in web/src/siteConfig.ts and /privacy, /terms and /contact all read that one constant - but it cannot be changed until the mailbox exists, since publishing an address that bounces is worse than the current state.",
    "Aug 16 - Process: TWO AGENT SESSIONS SHARING ONE WORKING TREE IS A HAZARD, NOT A WORKFLOW. Both sessions were checked out on the SAME branch in the same directory while one of them was rebasing constantly - a rebase moves HEAD under the other session and swallows uncommitted work with no error anyone would attribute to the real cause. Fixed by giving the second lane its own git worktree (jose/c87-email) rather than by carefully agreeing on which files each would touch. A file-level split is a convention that holds until someone forgets; separate worktrees make the collision impossible. Worth reaching for whenever two agents work the board in parallel.",
    "Aug 16 - OPEN SCOPE QUESTION, raised by c96 and needing an answer before alpha: DEFERRING c86 DOES NOT COST NOTHING, IT COSTS TWO TABS. The two-tier decision said hold email and .edu verification until after alpha because chapter membership grants org content with no email, and the org half of that is verified true - Orgs, events, members, dues and invites all work perfectly against prod with campus_id null. What was never traced is the other half: nothing anywhere in the backend WRITES users.campus_id, and bootstrap's own comment names the c86 .edu redemption as the only intended writer. So deferring c86 does not defer a nice-to-have, it means every alpha user permanently has no campus, which darkens Home's Campus tab and the whole Yak tab, and makes alpha gate c71 ('a campus-only student can post') unreachable by construction. Either alpha ships with two of five tabs dark and c71 dropped from the gate list, or c86 moves ahead of alpha. Worth naming the general lesson too: a deferral was reasoned about in terms of what it BLOCKED (email) and not what it was the ONLY SOURCE OF (campus), and nobody noticed for days because the org half kept working.",
    "Aug 16 - Method: REPRODUCE ON THE OLD CODE BEFORE YOU TRUST THE FIX. c94 was verified by first checking the PRE-FIX sign-in.tsx back out and driving prod until the bug appeared on the wire (sign-in 200, /auth/me 200, URL parked on /sign-in for 12s), and only then restoring the fix and re-running the identical steps. Without that first half, 'it works now' is a claim about a browser session, not about the bug - the flow might have been passing for an unrelated reason, or never exercised at all. The cost was about two minutes. Note what it also bought: the reproduction run is where the 401-before-200 on /auth/me (c95) became visible, which no amount of reading the fixed code would have surfaced.",
    "Aug 16 - Method: A CARD'S OWN DIAGNOSIS IS A HYPOTHESIS, NOT A FINDING. c94 said the sign-in submit path 'has no equivalent post-success navigation'. It does - router.replace('/(tabs)/feed'), right there in continueAfterAuth. Had that been taken at face value the fix would have been a second navigate call next to the one already there, which changes nothing, and the bug would have come back with a reputation for being unfixable. Reading the file first turned a missing-call theory into a race, and the race is what the destination guard actually punishes. Write cards with the symptom and the evidence; treat the suggested cause as the first thing to check rather than the thing to implement.",
    "Aug 16 - Process: WHEN YOU FIX ONE UNFOLLOWABLE COMMAND, AUDIT THE WHOLE DOC FOR ITS FAMILY. c93 was filed against a single --set-env-vars line. Auditing DEPLOY.md end to end for the same failure shape - a command that succeeds while doing the wrong thing - turned up four more: a literal STRONG_PASSWORD that would have set the real prod DB password to that string, the same literal repeated into the DATABASE_URL secret, a literal INTERNAL_IP that stores a valid-looking but dead REDIS_URL, and inline # comments in web/README.md and SETUP-FIREBASE.md that break under Jose's interactive_comments-off zsh. None of these fail loudly; that is exactly why they survived this long. The rule: a paste-trap is rarely alone, because they all come from the same habit of writing the shape of a command instead of the command.",
    "Aug 16 - Incident + method: THE MIGRATION FAILED AND THE REDEPLOY SUCCEEDED, which is the exact ordering the runbook warns about. Prod briefly served code that reads users.suspended_at against a schema without it - latent rather than visible, because health checks and unauthenticated requests never reach get_current_user, so nothing looked wrong. Two causes, both in the commands handed over: the local DATABASE_URL rewrite assumed a host:port form, while the secret is Cloud Run's UNIX-SOCKET form (@/chirp?host=/cloudsql/...), so the substitution silently did nothing and asyncpg tried a socket that does not exist on a Mac; and the shell had interactive_comments off, so every # line ran as a command and a trailing comment was fed to alembic as an argument. Rules from it: hand over commands with NO inline # comments, build a local DB URL by DECOMPOSING the secret rather than regexing it, and never treat 'health is 200' as evidence a deploy is healthy when the broken path is behind auth. Resolved by applying 0011; verified end to end with a real signed-in request returning 200, not by reading the alembic log.",
    "Aug 16 - Infra: PROD ENV CHANGES USE --update-env-vars, NEVER --set-env-vars. The latter replaces the whole env block, so any flag list that is not exhaustive silently deletes everything it omits. DEPLOY.md's redeploy example does exactly that and would have wiped the CORS_ORIGINS fix from c64 on the next deploy, failing in the browser rather than at deploy time. The safe redeploy carries no env flags at all: env vars, secrets, Cloud SQL instances and the VPC connector all persist across a --source deploy. Carded as c93.",
    "Aug 16 - Security process: A VULNERABILITY CAN BE LOAD-BEARING, AND THAT IS WHY REVIEWS MISS IT. Removing client-supplied campus_id from POST /auth/bootstrap (c85) broke 23 tests, because claiming a campus at bootstrap was the ONLY way anything in the suite assigned one. The Aug 15 five-lens review's authorization pass found nothing here and was not wrong: it checked that campus and org scoping were applied CONSISTENTLY at every call site, and they are. It never asked whether the value being compared was trustworthy. The lesson to carry into c86 and c88: for any field that gates access, ask WHO WRITES IT before checking who reads it, and treat 'the tests need this to work' as evidence the mechanism is load-bearing rather than as a reason to keep it.",
    "Aug 16 - Process: A CLAIMED MIGRATION NUMBER THAT TURNS OUT UNNEEDED GETS RELEASED OUT LOUD. 0012 was claimed for c69 before the work started, per the claim-before-you-write rule, and the purge job needed no schema change. Rather than quietly keeping it or quietly reusing it, the card says RELEASED and names the next free number. A silently-held number is the same failure as a silently-duplicated one: the next person reads the board, sees 0012 taken, skips to 0014, and there is now a permanent hole nobody can explain. Claiming is cheap, so releasing has to be equally cheap or people stop claiming.",
    "Aug 16 - Product: THE .EDU RULE IS TWO TIERS, NOT ONE GATE. Jose's calls, made Aug 16 against three options each. (1) Joining a chapter by invite code grants ORG content - the chapter's private feed, events, roster and dues - because an officer letting you in is itself a vouch. The CAMPUS-WIDE feed and Yak stay behind .edu verification, because that is the surface where a stranger reading your school's posts actually costs something. (2) Verification is RE-CHECKED YEARLY: store verified_at and require a fresh code annually, so the verified population stays close to actually-enrolled rather than drifting into a 2035 account reading a 2026 campus. (3) An unverified user gets a REAL VERIFY SCREEN, not an empty feed and not a bare error - the form is on the screen that refused them. THE CONSEQUENCE THAT MATTERS FOR ALPHA: the chapter experience needs NO email infrastructure, so c87 and c86 do not block Q's old chapter using org tools and paying dues. They block Yak and the campus feed only. That is worth knowing before anyone treats transactional email as an alpha blocker.",
    "Aug 16 - Product + Security: CAMPUS ACCESS REQUIRES PROVING YOU GO THERE. Anyone may sign up with a personal email; seeing a campus feed or Yak requires verifying an .edu address on that campus's domain allowlist. This is Jose's call and it is the right one, but the framing changed once we read the code: campus_id is client-supplied at bootstrap and unvalidated, so this is not a new restriction on an existing boundary, it IS the boundary (c85). Three consequences worth writing down. First, campus_id becomes server-owned and the verification redemption is its only writer - a user who has proven nothing has no campus, which is the correct state rather than an edge case. Second, the sign-in email can NEVER be the proof: Apple's Hide My Email returns a private-relay address and Google returns gmail.com, so authentication (who you are) and verification (where you study) are permanently two different questions with two different addresses. Third, this is blocked on something we do not have at all - there is no transactional email anywhere in the repo (c87), and university mail servers filter gmail senders, so it is coupled to owning a domain.",
    "Aug 16 \u2014 Process: STALE BRANCHES ARE TAGGED, NOT JUST DELETED. Cleaned origin down to main + the two branches with open PRs. jose/auth-orgs was fully merged and just went. q/website (a complete second marketing site Q built in parallel, never deployed, superseded by the React one already live) and q/mock-identity-fixes (21 behind, and main already carries a better version of its alumni fix \u2014 inner join with the reason written down, plus a 114-line test against that branch's 59) both carried unmerged commits, so each got an archive/<branch> tag pushed to origin BEFORE the branch was deleted. Deleting another dev's unmerged work from shared origin is destructive even when the work is dead; a tag costs nothing and makes it recoverable by anyone, not just whoever still has the local copy. Harvested before deleting, too: q/website's commit message caught a claim our LIVE terms also makes, which is now c76.",
    "Aug 16 \u2014 Design: the site's phone header carries a REAL MENU rather than hiding links. The previous approach dropped the two longest nav items at phone width and relied on the footer, which meant two of four pages were only reachable by scrolling to the bottom of a different page. Rule this sets: responsive design removes CHROME, never DESTINATIONS. If something does not fit, it moves behind a control that says what it is \u2014 not out of the document. (c72)",
    "Aug 15 \u2014 Design: the site's vertical rhythm is now a NAMED LAYER (--rhythm-section / -tight / -hero / -head) sitting between the pages and the --space-* scale, and it is the only thing besides running-text size that a phone changes. The rule this encodes: a token named for its value must keep that value everywhere, so responsive steps get semantic tokens of their own rather than a media query that quietly redefines --space-96 to 56px. Second half of the same decision: --body stays 15px and keeps mirroring app-mobile/src/theme, because the site's buttons and nav ARE the app's chrome, while prose moved to a new --reading step (16px, 17px on a phone). The site and the app are allowed to diverge on reading distance and on nothing else. (c72)",
    "Aug 15 \u2014 Design: responsive breakpoints on the site key on HEIGHT as well as width where the rule is about vertical room. A phone in landscape is 844x390 \u2014 it passes every width test and then spends half the screen on hero padding, which is the same bug the phone card was filed for. Width-only breakpoints are correct for 'how much room across' (mockup size, tap targets, column counts) and wrong for 'how much room down'. (c72)",
    "Aug 11 \u2014 Product: Chirp is for ALL students; greek chapters are orgs you join under the Orgs tab. Same auth for everyone.",
    "Aug 11 \u2014 Design: default scaffold theme rejected. Dribbble-modern direction is binding, spec in app-mobile/DESIGN.md (violet accent, soft neutral canvas, pill everything, floating tab bar).",
    "Aug 11 \u2014 Process: this board is the source of truth for who's doing what. Not on the board = not claimed.",
    "Aug 12 \u2014 Design: Home = media FYP (Twitter/Insta/Snap mix \u2014 anything postable), themed to SCHOOL COLORS with user-controlled accent/background (DESIGN.md \u00a77 + \u00a78.5). Two dribbble refs codified.",
    "Aug 12 \u2014 Crypto: libsignal requires PQXDH (post-quantum Kyber prekeys) \u2014 key directory being extended (kyber_prekeys, migration 0002). 1:1 wire-format rule documented in SPEC \u00a76.",
    "Aug 12 \u2014 E2EE spike verdict: @signalapp/libsignal-client works on macOS x64 Node; RN path recommendation in spikes/libsignal-node/FINDINGS.md; physical-device test still owed.",
    "Aug 12 \u2014 Product: org posts are PRIVATE to the org (never on the FYP). Orgs tab = Feed / Events / Tools segments in org colors; Events = Partiful-style planning (DESIGN \u00a78.7). App rebranded to UNC Greensboro; every frat/sorority wears its own colors (\u00a78.6).",
    "Aug 13 \u2014 Process: work split BY FEATURE VERTICAL. Vertical A (Auth & Orgs) = Jose; Vertical B (Social & Messaging) = Q. First milestone = GO-LIVE INTEGRATION. Sprint 0 (shared): one reachable backend + Firebase project before either vertical starts. Shared files (api/client, theme, components, mocks): touch sparingly, ping each other.",
    "Aug 13 \u2014 Process: feature work happens on per-dev branches (jose/auth-orgs, q/social-msg) merged to main via PR \u2014 no more direct-to-main feature commits, avoids merge collisions. EXCEPTION: board.html updates commit straight to main so both devs always see the live board.",
    "Aug 13 \u2014 Infra: shared backend = GCP project chirps-prod (us-central1), billing linked, account chirp.shared@gmail.com. Order: Cloud SQL + secrets + migrations first; Cloud Run public deploy only after Firebase exists (ENV guard requires AUTH_MODE=firebase + real CORS).",
    "Aug 13 \u2014 Payments: Stripe Connect EXPRESS accounts + DIRECT charges. The chapter is merchant of record, funds land in the chapter's balance, the chapter carries chargeback liability \u2014 Chirp never takes custody of the money. Platform fee 1% card / 2% ACH as application_fee_amount (ACH still lands cheaper for the chapter all-in, ~2.8% vs ~3.9%). The member picks the rail BEFORE the intent is created, because application_fee_amount is immutable once a PaymentIntent exists and PaymentSheet would otherwise pick the rail afterwards. Saved cards use a Stripe Customer per (member, chapter): under direct charges the Customer lives on the connected account, so a users.stripe_customer_id column works for the first chapter and silently breaks the second.",
    "Aug 13 \u2014 Payments: dropped the ephemeral-key approach in HANDOFF for CustomerSession \u2014 Stripe's current mobile docs use it, the installed RN SDK 0.50.3 accepts either, and CustomerSession needs no pinned API version (one less thing to re-check on every SDK upgrade).",
    "Aug 13 \u2014 Process: migration numbers are a SHARED resource. Claim the next number on this board BEFORE writing the file. Taken so far: 0006 events (J, on prod), 0007 is_platform_admin (J, in flight), 0008 Stripe dues (Q, pending renumber from 0006 \u2014 see c41).",
    "Aug 13 \u2014 Process: Q's vertical branch is q/social-msg, cut from the family-tree tip. family-tree retires once PR #2 merges; PR #3 stacks on PR #2.",
    "Aug 13 \u2014 Process: NO branch protection on main for now (Jose's call) \u2014 CI runs on every push/PR but is advisory, merges stay unblocked. Revisit before TestFlight. Apple Developer enrollment also parked until launch prep.",
    "Aug 14 \u2014 Backend: roster display names are MemberOut, NOT a field on MembershipOut. PR #6 (Jose) and the dashboards work (Q) solved the same problem in parallel \u2014 no GET /users/{id} exists, so a roster is bare UUIDs \u2014 and PR #6's shape won: real INNER JOIN, non-null display_name, plus avatar_url. GET /chapters/{id}/members returns MemberOut; GET /me/memberships returns the plain MembershipOut. Re-adding a nullable display_name to MembershipOut is the regression to watch for. Worth knowing HOW this was nearly missed: git did NOT flag most of the overlap as a text conflict, so two branches solving the same problem can auto-merge into two competing mechanisms with a green build. When both verticals touch the same domain, diff it by hand.",
    "Aug 14 \u2014 Process: migration-number rule earned its keep. As 0006 the Stripe migration would have been silently skipped on a prod already stamped past it \u2014 Alembic marks it applied and moves on, so processed_stripe_events and the unique index on ledger_entries.stripe_payment_intent_id would simply not exist, with nothing erroring and the webhook-replay guard absent on the money path. Renumbered to 0008, chain verified linear/single-head on main. Next free number: 0009 \u2014 claim it here first.",
    "Aug 14 \u2014 Process: PR #2 merged before PR #3 deliberately. The branches had diverged and q/social-msg's content was a superset of family-tree's, so merging #3 first would have made #2 read as a Stripe revert. family-tree and q/social-msg are both retired; new work cuts from main.",
    "Aug 14 \u2014 Backend: added GET /campuses/{campus_id} (Jose, c46). Trivial route, but it closes a real gap \u2014 users.campus_id existed with no way to resolve it to a name, which is WHY Profile and the Yak header hardcoded a mock campus. Any registered caller may read one; campus name/slug are public-facing labels, not org-scoped data. 3 tests. No migration.",
    "Aug 14 \u2014 Process: near-miss avoided. Jose's de-mock sweep and Q's c34 both wanted app/(tabs)/feed/index.tsx within the same hour; Q had claimed it on the board first (branch q/feed, migration 0009), so Jose dropped his changes to that ONE file and kept the rest. This is the roster-names collision from earlier today NOT happening, because the claim was on the board. Both devs independently reached the same root cause, which is also a good sign the finding is real.",
    "Aug 14 \u2014 Audit finding (13-agent sweep, every claim adversarially verified): the gap between 'backend is live' and 'the app shows real data' is BIGGER than the board implied, and it is not the USE_MOCKS flag. USE_MOCKS is false in every build (no .env or eas.json ever sets it), so those api-layer branches are dead code \u2014 the real problem is screens importing MOCK_* constants directly and using them as the signed-in identity. Home feed, Profile, Family Tree, Event detail, org Feed segment and the DM thread are all affected; filed as c34 (sharpened), c46 (Jose) and c47 (Q). Rule going forward: a screen must source identity from useSession()/useOwnChapter(), never from @/mocks/data \u2014 cosmetic-only mock imports (theme colors, campus label) are the sole allowed exception and should carry a comment saying so.",
    "Aug 14 \u2014 Process: the audit also closed two stale cards (c20 Firebase project, c26 events backend) that had been sitting in Next/backlog while the work was already Done and on prod, and found three more that overstate what is left (c5, c35, c36). Lesson: cards get moved when work lands, not when someone happens to notice; a stale board costs more than no board because it is trusted.",
    "Aug 14 \u2014 Infra: prod is CURRENT with main for the first time since sprint 0 \u2014 migration 0008 applied by Jose, then rev chirp-api-00007-kff shipped PRs #2, #3 and #7 in ONE redeploy. Ordering rule confirmed and now in INFRA-PRIVATE.html: MIGRATE FIRST, THEN DEPLOY. The Cloud Run deploy does not run migrations, and the post-#3 code selects ledger_entries.stripe_payment_intent_id, which does not exist until 0008 runs \u2014 deploying first would have 500'd the treasurer ledger. Also learned: cloud-sql-proxy is NOT bundled with the gcloud SDK and was missing entirely on Jose's Mac; the install command is now a documented prerequisite in the migration runbook.",
    "Aug 14 \u2014 Process: c43 SPLIT along the consumer line \u2014 whoever consumes an endpoint designs it. Q builds posts-with-counts inside c34 (he is wiring the feed that calls it); Jose builds events-with-rsvp-counts with c44 (events backend is his). This is the lesson from the roster-names overlap applied in advance: one owner per shape, no parallel competing mechanisms.",
    "Aug 14 \u2014 Process: 'merged' is not 'working', and the board should say which. Stripe dues is on main with CI green and has never contacted real Stripe, so c11 stays in In Progress until a test-mode payment clears on BOTH card and ACH. Yak, the dashboards and CSV export are likewise only proven against mocks and the test suite \u2014 never driven on a device.",
    "Aug 14 \u2014 Product: a post's audience is chosen by the author at compose time. posts.audience is 'org' (private to the chapter, per the Aug 12 rule) or 'campus' (visible to everyone at that campus). 'For You' is a RANKING over campus posts, not a stored third value \u2014 so the two Home pills read the same campus feed and differ only in ordering. v1 ships both as reverse-chron; ranking is a later card, and until it exists the two pills will look identical. Audience defaults to 'org' server-side when the client omits it: the safe default is private, never accidental campus-wide broadcast.",
    "Aug 14 \u2014 Process: migration 0009 CLAIMED by Q for c34 (posts.audience, post_type, duration_sec). Next free number is 0010. Claimed here before the file was written, per the rule c41 taught us.",
    "Aug 14 \u2014 Scoping: c34 was carded as 'replace mock calls with live fetch' and was actually a backend gap. The client layer (src/api/feed) was already correct; what was missing was any way for the server to express a campus-visible post. Worth remembering when a card looks like a one-line swap: check that the API can express what the screen renders before estimating it.",
    "Aug 14 \u2014 Engineering: with-counts routes use correlated scalar subqueries, never join+COUNT(DISTINCT). Joining posts to both post_likes and post_comments multiplies rows before counting (3 x 4 = 12) and COUNT(DISTINCT) hides it while making the query slower. Pattern: routers/feed.py _post_counts_select.",
    "Aug 15 \u2014 Money: dues payment intents are now PERSISTED and RESERVED before Stripe is called (migration 0010, dues_payment_intents + a partial unique index on (dues_cycle_id, user_id) WHERE status IN ('open','succeeded')). The old design only recorded a payment AFTER its webhook settled, so during ACH's multi-day 'processing' window nothing in the DB knew a payment was in flight: the cycle still read as unpaid, and because the Stripe idempotency key was scoped per-rail (dues:{cycle}:{user}:{rail}) a retry on the other rail created a GENUINELY different PaymentIntent. Both would succeed and both would append to an append-only ledger. Reserve-then-call is the fix; the ledger partial unique index is the backstop, and payment_failed/canceled webhooks now RELEASE the reservation so a genuinely failed payment can still be retried.",
    "Aug 15 \u2014 Process: agent sessions must not share one working tree. A background agent fixing three review findings had the repo switched under it mid-edit (a concurrent branch checkout for the q/feed merge). It behaved correctly \u2014 detected the foreign MERGE_HEAD, reverted its own two edits by hand, made ZERO net changes and reported rather than forcing a checkout that would have yanked the branch out from under an unresolved merge. No damage, but the lesson stands: concurrent work on this repo runs in a git worktree, or strictly sequentially. Cheap rule, and it just cost a round trip to learn.",
    "Aug 15 \u2014 Money: reserve-before-charging is now the rule for anything that moves money. A guard that only reads settled state (the ledger) cannot see an in-flight payment, and Stripe idempotency keys only dedup identical parameters \u2014 so any key scoped to a user-changeable field (here, the rail) is not a double-charge guard at all. Write the reservation to OUR database before calling the processor, and let a partial unique index arbitrate. Corollary learned from a failing test: the guard must not block same-parameter retries, or ordinary client retries break.",
    "Aug 15 \u2014 Product/infra: Chirp gets a PUBLIC WEBSITE and it lives in THIS repo under web/, deployed to Firebase Hosting on chirps-prod. Rationale: it is not a marketing nice-to-have, it is load-bearing \u2014 Stripe Connect cannot onboard without an https return URL (the endpoint 503s), the App Store will not accept a submission without a public privacy-policy URL, invite deep links need an https bounce page to survive being tapped in a text message, and the sign-in screen already promises Terms + Privacy documents that do not exist. Same repo so the privacy policy stays honest about what the app actually collects; static HTML, never the Expo bundle, so it loads fast and works with no auth.",
    "Aug 15 \u2014 Process: the #9 -> #11 -> #10 merge queue EXECUTED CORRECTLY and is closed (6334957, 9673ff6, 1aa19ba; CI green on all three). Q ran it, including the conflict Jose's PR #11 hit once #9's newer tip landed. The resolution is worth recording because it is the one that usually goes wrong: both sides were KEPT rather than one side taken. feed/index.tsx has Q's getCampus() eyebrow with the hardcoded mascot deleted; chapter/index.tsx has Jose's listMembers()/findMember() roster resolution with mockUserById gone. Taking either side wholesale would have silently reintroduced a bug the other side had just fixed, with a green build. Same trap as the roster-names overlap, avoided this time.",
    "Aug 15 \u2014 Infra: the public website ships on the FREE Firebase Hosting domain, https://chirps-prod.web.app, and that is what APP_PUBLIC_BASE_URL will be set to. Stripe accepts it, it costs nothing, and it unblocks Connect onboarding the day the site deploys \u2014 waiting on a domain purchase would have blocked the entire dues chain behind a shopping decision. A custom domain is deferred to its own card and only becomes load-bearing when iOS universal links do; app-mobile/app.json's applinks:chirp.example.com is a placeholder and is wrong under either choice.",
    "Aug 15 \u2014 Correction: the de-mock sweep was reported COMPLETE and was not, and c55 specifically claimed 'the last mockUserById call site in the app is gone' when it was gone from one file only. Three screens still render fake identity against live data (filed as c59). Q caught the alumni one while merging. The failure mode is worth naming: a claim about the WHOLE repo was made from the scope of a single PR's diff. When closing a card that asserts something repo-wide, re-grep the repo, not the branch.",
    "Aug 15 \u2014 Testing: a green test you have not tried to break proves nothing. c21's happy-path fan-out test was falsified first (published to a deliberately wrong channel, confirmed it failed) before the PASS was believed. Worth repeating for any test asserting that something ARRIVES \u2014 those pass vacuously when the transport is silently broken.",
    "Aug 15 \u2014 Infra: Redis/Memorystore was never provisioned in chirps-prod, confirmed three ways with gcloud (API never enabled, no VPC connector, no REDIS_URL on the running revision). Recorded because of HOW it stayed hidden: the backend test suite is fully green on the websocket path and runs against a real local Redis, so the suite actively asserts that fan-out works while production has no Redis to fan out through. A green suite proves the code, never the environment \u2014 infra existence needs its own check, and 'DEPLOY.md says this can come second' is not evidence that it was ever done. c30's inventory of live infra was accurate and complete; nobody re-read it when the WS work landed.",
    "Aug 15 \u2014 Web: the public site is a Vite + React + TypeScript SPA, reversing the same-day 'plain static HTML, no build step' decision. Jose's call. What it buys: the header/nav/footer exist once in components/Layout.tsx instead of being hand-copied into nine files that drift apart, and per-route titles come from usePageMeta() rather than nine hand-maintained <title> tags. What it costs, recorded so nobody rediscovers it: pages now need JS to render (fine for a browser and an App Store reviewer, thin for a non-executing crawler), and the bundle is ~218 KB / 66 KB gzipped against effectively zero before \u2014 a real first-paint regression on the three bounce pages, which are exactly the ones a user hits mid-flow on a phone. The deployed artifact is still static, so Firebase Hosting is unchanged; server rendering would mean leaving it, since Hosting only serves static files. The two Stripe callback routes still answer a single 200 with no redirect hop, which is the one thing that could not be allowed to regress.",
    "Aug 15 \u2014 Infra: prod migrated 0008 -> 0010 and redeployed as chirp-api-00009-pqf, so prod is current with main again. Two things worth keeping from how it was done. First, the pre-flight mattered in principle even though it came back clean: 0010 builds a UNIQUE index on the already-populated ledger_entries, so a single duplicate dues_payment row would have aborted the migration mid-flight, and that is a query you run BEFORE not after. Second, the verification was a route probe, not the deploy log \u2014 GET /campuses/{id}/feed going 404 -> 401 is the only check that actually distinguishes 'new code is live' from 'the deploy reported success'. The double-charge guard was then demonstrated against the real prod schema inside a rolled-back transaction, which is how you prove a constraint exists in production without writing to production.",
    "Aug 15 \u2014 Process: I reviewed my own PR #13 at high effort and it returned 15 findings, two of which were real bugs inside the c62 gateway fix I had shipped hours earlier and called done \u2014 teardown placed on the wrong side of a re-raise, and nothing observing the forwarder task dying. Both were invisible to the three tests written alongside that fix, because those tests only exercised failure at connect time, which is the case the author was already thinking about. The lesson is not 'review more', it is that tests written by whoever wrote the fix encode the same blind spot as the fix. Also caught before shipping: three contact addresses and one legal sentence rendered glued to the preceding word on the live site, because JSX drops a trailing space when a text run ends a line before an inline element \u2014 a class of bug no typecheck or unit test catches, only building the bundle and reading the rendered output.",
    "Aug 15 \u2014 Legal: Chirp ships its own privacy policy and terms, written in-house and scoped to North Carolina and UNCG only, rather than waiting on a lawyer. Jose's call, and the right one for a single-campus launch \u2014 but the reasoning is worth recording. The policy is written against the actual schema, so every claim is checkable against a model file, which makes it MORE accurate than a template would have been. Three statements are deliberately unflattering and stay that way: anonymous board posts are anonymous to other students but not to us, reporting a DM forwards that message's text to us, and deleted content is currently hidden rather than erased because no purge job exists (filed as c69). On terms: NO arbitration clause and NO class-action waiver, deliberately \u2014 those are the clauses that most need real drafting, are most often struck when drafted badly, and buy a single-campus app nothing. Liability is capped at fees actually paid to Chirp, which for nearly every user is zero. Governing law is NC, venue Guilford County, matching the only campus we have. No legal entity is named because Chirp is not incorporated. Revisit all of it before the first campus outside NC, which is the point where fifty-state hedging starts to matter.",
    "Aug 15 \u2014 Product: the marketing and legal site moves off the apex domain to a subdomain (about.<domain>), with the apex reserved for sign-in / the app, following Instagram's shape. Jose's call. Recorded now even though it is blocked on buying a domain, because it invalidates an assumption three places already encode: APP_PUBLIC_BASE_URL on Cloud Run, WEB_BASE_URL in the mobile invite helper, and app.json's universal-link config. The c40 lesson applies again \u2014 whichever host serves /stripe/connect/return and /stripe/connect/refresh IS what APP_PUBLIC_BASE_URL must equal, because payments.py builds those URLs by string concatenation.",
    "Aug 15 \u2014 Process: CARD IDS ARE A SHARED RESOURCE, exactly like migration numbers (c41). Jose and Q both minted c70 and c71 within minutes of each other for completely different work \u2014 Q for the media pipeline and the campus-only-user posting gap, Jose for mobile responsiveness and the subdomain move. Caught only because git rejected the push as non-fast-forward; had both been committed from the same base, the board would have silently ended up with two different c70s, which is precisely the duplicate-c50 mess already cleaned up once. Jose renumbered to c72/c73. Same rule as migrations: take the next id from the board's CURRENT state on origin, not from the copy you started editing ten minutes ago.",
    "Aug 15 \u2014 Product/scope (c49): the compose flow ships TEXT ONLY, and Photo/Video ship as visibly disabled 'Soon' rows. Worth recording because the tempting move was to add expo-image-picker and call it done. Two reasons not to. First, a picker produces a local file URI, and there is nothing in this repo that can turn that into a URL: no storage bucket wired, no presign, no upload endpoint. Every media_urls value in the app today is a picsum placeholder, which is precisely why the media path looked finished. Second, expo-image-picker is a native module, so it owes an EAS dev build of its own on top of the one c39 already owes \u2014 media would have been untestable on arrival. Disabled rows that say so beat a picker that silently drops the photo. Pipeline is c70. Related and more important: the only create-post route requires an active chapter membership, so a student in no org cannot post at all, which directly contradicts the Aug 11 'Chirp is for ALL students' premise. c49 hides the FAB for those users rather than opening a composer that dead-ends, but that is containment; the product decision is c71 and it needs both devs before TestFlight.",
    "Aug 15 \u2014 Process: the migration-number rule caught a REAL collision in real time, not in hindsight. Q read the board, saw 0010 as head, and started writing 0011 for c71; Jose pushed claims for 0011 (c76) and 0012 (c69) about a minute earlier, and the only reason the two did not both ship an 0011 is that git rejected the non-fast-forward push and the rebase forced a re-read of the board. Q moved to 0013. Note what did NOT save us: reading the board at the start of the task. The board was accurate when read and stale by the time the file was written, which is the same shape as the c41 failure. The rule that actually works is re-checking the CURRENT state on origin immediately before writing the file, and treating a rejected push as a signal to re-read rather than an obstacle to retry past.",
    "Aug 15 \u2014 Product (c71): a student who belongs to no chapter CAN post, to their campus. The user's call, and it resolves a contradiction that had been sitting in the schema since the start: the Aug 11 premise is that Chirp is for all students with orgs as an optional thing you join, while posts.chapter_id was NOT NULL and the only create route sat behind a membership check. Shape: posts.campus_id NOT NULL and backfilled, chapter_id relaxed to nullable, and CHECK (audience = 'campus' OR chapter_id IS NOT NULL) so an org post with no org is impossible in the database rather than merely discouraged. Campus was NOT derived from the author on purpose - a transferring student would drag their old posts onto their new campus feed; the post belongs where it was made. The new route hard-codes audience and its request schema has no audience field, so 'org without a membership' is unreachable by construction instead of by validation. Two pre-existing bugs surfaced on the way and had to be fixed to ship coherently: likes and comments were authorized through the post's chapter, which 403'd every cross-chapter campus post the feed was already showing people, and moderation resolved a report's campus by hopping post -> chapter, which would have filed chapter-less reports on the reporter's campus queue. Both were invisible while every post had a chapter.",
    "Aug 16 \u2014 Moderation: block must actually hide content or the button is theater. Adding a Block control to a surface whose feed query does not filter blocked authors ships an App Store 1.2 checkbox that does nothing. Check the read path filters before adding the write control; yaks.py's anti-join is the pattern.",
    "Aug 22 - Process: c124 and c125 were REAL cards, correctly written in 1407947 and corrected in 7009041, and then silently LOST when 513d134 (c122/c123) was written from a copy of the board that pre-dated both - branched from adf0f33, an ancestor of neither. 125 cards became 123 with no conflict, no error, and no one noticing until board-check's git-id-scan flagged c124/c125 as used in git history with no matching card. This is the SAME failure class as the seven orphaned cards and james's chapter/index.tsx incident earlier this week - a session working from a copy of board.html it fetched before someone else's push landed - and it is exactly what 'pull immediately before editing, push within the minute' exists to prevent. Reconstructed both cards verbatim from 7009041 (the last commit where they were confirmed correct) rather than rewritten from memory, since the original text already carries its own verification history (the updateChapter correction, the sabotage test). c124 (live attendance bug) and c125 (dead listChapters) are both still real and both still unowned.",
    "Aug 22 - Product/Security ruling, effective now, Jose can veto: GET /auth/me stays reachable for suspended users, AS A DELIBERATE DECISION rather than the unnoticed c76 gap it was found as (c126). Reasoning: every other authenticated route 403s a suspended caller via get_current_user; /auth/me is the ONE route that does not, and that is exactly what lets a suspended user's client learn 'you are suspended, since when' instead of hitting a wall of unexplained 403s everywhere. The gap becomes the mechanism, on the record, now that c126 gave it something to actually report (MeOut.suspended_at). Client-side work to actually USE this is c129.",
    "Aug 22 - c70 media: bucket is public-read with keyless signed PUT uploads; the designed 24h lifecycle rule was scrapped before applying (age is not reference-ness - it would eat real photos); orphan cleanup deferred to c132. Photo posts require a caption for now - relaxing that is an open product question, not decided silently.",
    "Aug 22 - Security (mid-pass flag): chirps-prod-media was anonymously ENUMERABLE (objectViewer includes list) - manager's over-grant, corrected same hour while the bucket held only test pixels: allUsers swapped to legacyObjectReader (GET-only), verified LIST 401 / GET 200. OPEN FOR TRIAGE with security's batch report: are photo URLs public-forever (current design) or signed-GET (privacy-tighter, needs client+backend rework)? Jose decides.",
    "Aug 22 - Triage (manager, from security's batch): item 7 (WS token off query string) PULLED FORWARD ahead of c63's realtime wiring - security proved zero WS usage ever, so the coordination stop protects nothing today and the cost inverts the moment c63 lands; braul builds it as PR 0 from security's written plan. media_urls validator assigned (james) before media sees real use. Photo-URL public-vs-signed fork, purge job scheduling, and .edu attempt-cap fix: queued for Jose.",
    "Aug 22 - Jose's triage: (1) photo privacy = option (a), public-read stays for alpha, mandatory revisit carded before broad use; (2) purge job APPROVED and now LIVE (daily 09:00 UTC, proven on prod); (3) .edu attempt-cap race fix APPROVED, sally building with a real OS-thread concurrency proof, merging BEFORE c73's domain lands because the race goes live the hour delivery works.",
    "Aug 22 - INCIDENT + fix: item 7 (WS ?token= in logs) went dormant->LIVE when c63's wiring opened the first real prod sockets against the still-unmerged old path. 15 entries carry a real Firebase token for calpules1@icloud.com; braul's own drives were unauthenticated (bare URL) so the real credential is NOT his - source is an open question for Jose. #63 merged urgently on security's sign-off (subprotocol auth, headers unlogged) to stop recurrence. Log purge + account identity to Jose (c145). Credential-scrubbing tripwire carded (c146), explicitly NOT for security to author since they approved #63.",
    "Aug 22 - c142 merged on security's sign-off: ALL 8 security-pass findings now closed. Incident c145 downgraded: token-bearing requests were all HeadlessChrome (our own QA automation), not a wild client. delete_post audience-vs-chapter-authority tension carded as policy for Jose (c148), remove_content default-agreement hardening carded (c147).",
    "Aug 23 - c63 gate deliberately NOT flipped despite the client shipping: prod has no Redis (c61, deferred), so live delivery is unprovable there - the gate sentence stays honest. Auth half of the drive proved c143 live (1863 log entries, zero credentials). Redis provisioning (~$35/mo Memorystore + VPC connector) is now the gate's only blocker - Jose's spend call.",
    "Aug 23 - c132 media pipeline closed after a 3-round real-bucket E2E, each round finding a bug no fake could see (signed header, conditional-copy IAM, preserve_acl inversion). Standing lesson recorded: GCS client kwargs get verified against the IMPLEMENTATION BODY, not docstrings - two of the three rounds were docstring-vs-reality gaps.",
    "Aug 23 - Jose ruled c148: chapter authority does NOT end at campus-audience content. delete_post stays as-is; c108's docstring reading wins over extending c142's tier-follows-audience principle to the owning chapter's own president.",
    "Aug 23 - Redis provisioning DEFERRED by Jose ('skip redis for now'); c63 messaging gate stays honestly held. Revisit on his word.",
    "Aug 23 - c145 resolved by Jose: calpules1@icloud.com is his own login; disposition = purge the 15 token-bearing log entries. Manager executes after a blast-radius confirm (Cloud Logging deletes are whole-log granularity).",
    "Aug 23 - c153 delete-scope re-decided (manager, Jose approved the credential part): reconciliation job (option b) under a SEPARATELY-scoped identity whose delete grant is IAM-conditioned to posts/ only. The runtime SA's tmp/-only delete grant stays untouched - c132's published-photo immutability guarantee survives.",
    "Aug 23 - c140 ruled by manager on sally2.0's design doc (claims spot-verified against code and the installed GCS library): BUILD option (b) now - capability URLs with quantized expiry, 302 to memoized signed GCS URL, posts.media_urls format untouched; skip (c), it remediates nothing already posted. The public-access flip (PAP=enforced + allUsers removal) is separately gated on a device-verified capability-route render AND Jose's explicit go. Bare-object-name column migration deferred until after c153 lands. The 4.1 legacy-row SELECT goes in the deploy runbook for Jose.",
    "Aug 23 - tsc-placeholder trap corrected before permanent ink: the npx placeholder EXITS 1 (loud red), not 0 - braul 2.0 measured three ways, manager reproduced independently. The real trap is a human misreading the red as an environment hiccup plus a worktree with no node_modules never type-checking at all. Symlink node_modules first; any tsc evidence must cite the compiler version. CLAUDE.md edit queued for Jose's approve (instruction-layer changes are not peer-authorizable - braul's refusal was correct process).",
    "Aug 23 - exit-code house rule sharpened by security 2.0's own post-mortem of the tsc mismeasure: a pipeline reports its LAST stage's status, so `cmd | head` reading as exit 0 proves nothing about cmd. NEVER read an exit code through a pipe - capture it unpiped or via PIPESTATUS. Goes into the queued CLAUDE.md edit alongside braul's correction when Jose approves.",
    "Aug 23 - pool rule adopted from braul 2.0's c78 stop (second stale-premise card in a day): before building from any card older than a couple of days, grep for the thing the card says does not exist and git-log the files it names - a card's factual claims are dated the day they were written. c78 would have shipped a duplicate screen without this. Goes into the queued CLAUDE.md edit alongside the typecheck and pipe-exit-code lessons when Jose approves.",
    "Aug 23 - suite-contention protocol (manager, after load hit 152 on the 8-core box with five concurrent full suites and a clean suite ran past a 10-min tool timeout on contention alone; raised by jon 2.0): full backend-suite runs are SERIALIZED via scripts/with-suite-lock; targeted test files stay unlocked during development; the full suite runs only pre-PR under the lock; a suite that timed out under load is rerun under the lock, not reported as a hang."
  ]
}
</script>
<script>
(function () {
  var DATA = document.getElementById('board-data');
  var LS_KEY = 'chirp-board-draft';
  var committed = JSON.parse(DATA.textContent);
  var state = committed;
  try {
    var draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (draft && draft.updated > committed.updated) { state = draft; setStatus('local draft — export & commit to share', true); }
  } catch (e) {}

  var boardEl = document.getElementById('board');
  var areasEl = document.getElementById('areas');
  var view = 'status';

  function setStatus(text, dirty) {
    var s = document.getElementById('status');
    s.textContent = text; s.className = dirty ? 'dirty' : '';
  }
  function persist() {
    state.updated = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    setStatus('unsaved changes — export & commit to share', true);
    render();
    if (view === 'area') renderAreas();
  }
  function cardById(id) { return state.cards.filter(function (c) { return c.id === id; })[0]; }

  /**
   * Copy `text`, then flash the result on the button itself.
   * navigator.clipboard needs a secure context and this board is normally opened
   * straight off disk (file://), where it's commonly unavailable or rejects — so
   * fall back to a throwaway textarea + execCommand rather than silently no-op.
   */
  function copyText(text, btn) {
    var label = btn.dataset.label;
    function flash(ok) {
      btn.textContent = ok ? 'copied' : 'copy failed';
      btn.className = 'copy ' + (ok ? 'ok' : 'fail');
      setTimeout(function () { btn.textContent = label; btn.className = 'copy'; }, 1200);
    }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      flash(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, legacy);
    } else {
      legacy();
    }
  }

  /* Cards whose `col` matches no column id render NOWHERE, and until this existed
   * they did it silently — the file parsed, the card was in the data, and the board
   * looked complete. It happened three times in one day: seven cards at once
   * (c39, c73, c86, c88, c101, c102, c104), then c108, then c110. Two of those were
   * DO-NOT-DEPLOY warnings, and the session that wrote one of them told three other
   * sessions and Jose it was carded while it was invisible.
   *
   * The cause is that the columns have two names each — an id ("backlog") and a
   * human title ("Next") — and writing the title where the id belongs is silent.
   * It spread by imitation, since every card copied from a bad card was bad too.
   *
   * So: say so on screen, not just in the console. Jose reads this board in a
   * browser tab and would never see a console.warn. A card that cannot be drawn is
   * listed by id in a banner instead, which is the one place it cannot be missed. */
  function renderIntegrity() {
    var colIds = state.columns.map(function (col) { return col.id; });
    var orphans = state.cards.filter(function (c) { return colIds.indexOf(c.col) === -1; });
    var el = document.getElementById('integrity');
    if (!orphans.length) { el.hidden = true; el.textContent = ''; return; }
    var ids = orphans.map(function (c) { return c.id + ' (col "' + c.col + '")'; });
    el.hidden = false;
    el.textContent =
      orphans.length + (orphans.length === 1 ? ' CARD IS' : ' CARDS ARE') +
      ' NOT ON THIS BOARD — its `col` matches no column. Valid values are ' +
      colIds.join(' / ') + '. Invisible: ' + ids.join(', ');
    console.warn('[board] cards rendering nowhere:', orphans.map(function (c) {
      return { id: c.id, col: c.col, title: c.title };
    }));
  }

  function render() {
    // The alpha bar reads the same cards the columns do, so it repaints with
    // them rather than on its own schedule — otherwise dragging a gate card
    // leaves a stale percentage sitting above the board that looks authoritative.
    renderAlpha();
    renderIntegrity();
    boardEl.innerHTML = '';
    var drawn = 0;
    state.columns.forEach(function (col) {
      var colEl = document.createElement('div');
      colEl.className = 'col'; colEl.dataset.col = col.id;
      var cards = state.cards.filter(function (c) { return c.col === col.id; });
      drawn += cards.length;
      var h = document.createElement('h2');
      h.innerHTML = col.title + ' <span class="count">' + cards.length + '</span>';
      colEl.appendChild(h);
      var stack = document.createElement('div');
      stack.className = 'stack';
      colEl.appendChild(stack);
      cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'card'; el.draggable = true; el.dataset.id = c.id;
        // Card id, rendered as its own line above the title. It exists in the data
        // and is how everyone refers to cards in commits, PRs and conversation
        // ("c36", "c61") — but it was never on screen, so a card's name was
        // unreadable from the board itself.
        var idLine = document.createElement('div');
        idLine.className = 'card-id';
        idLine.textContent = c.id;
        var t = document.createElement('div'); t.className = 'title'; t.textContent = c.title;
        // The card shows a headline; everything else lives in the drawer. Card text
        // grew long enough that four columns of it was unreadable — and a board you
        // do not read is the same as no board.
        if (c.detail) { el.classList.add('has-detail'); }
        el.addEventListener('click', function (ev) {
          // Ignore clicks on the meta-row controls, which have their own jobs.
          if (ev.target.closest('.meta')) return;
          openDrawer(c.id);
        });
        var meta = document.createElement('div'); meta.className = 'meta';
        var owner = document.createElement('button');
        owner.className = 'chip owner-' + (c.owner || 'none');
        owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
        owner.onclick = function () { c.owner = c.owner === '' ? 'J' : c.owner === 'J' ? 'Q' : ''; persist(); };
        meta.appendChild(owner);
        if (c.tag) { var tag = document.createElement('span'); tag.className = 'chip tag'; tag.textContent = c.tag; meta.appendChild(tag); }
        var copy = document.createElement('button');
        copy.className = 'copy'; copy.textContent = 'copy'; copy.dataset.label = 'copy';
        copy.title = 'Copy this card’s text';
        copy.onclick = function (ev) { ev.stopPropagation(); copyText(c.title + (c.detail ? '\n\n' + c.detail : ''), copy); };
        meta.appendChild(copy);
        var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
        del.onclick = function () { if (confirm('Delete card?')) { state.cards = state.cards.filter(function (x) { return x.id !== c.id; }); persist(); } };
        meta.appendChild(del);
        t.ondblclick = function () { var v = prompt('Edit card', c.title); if (v) { c.title = v; persist(); } };
        meta.insertBefore(idLine, meta.firstChild); el.appendChild(meta); el.appendChild(t);
        el.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
        el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
        stack.appendChild(el);
      });
      var adder = document.createElement('input');
      adder.className = 'adder'; adder.placeholder = '+ add card';
      adder.onkeydown = function (ev) {
        if (ev.key === 'Enter' && adder.value.trim()) {
          state.cards.push({ id: 'c' + Date.now(), col: col.id, title: adder.value.trim(), owner: '', tag: '' });
          persist();
        }
      };
      colEl.appendChild(adder);
      colEl.addEventListener('dragover', function (ev) { ev.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', function () { colEl.classList.remove('drag-over'); });
      colEl.addEventListener('drop', function (ev) {
        ev.preventDefault(); colEl.classList.remove('drag-over');
        var id = ev.dataTransfer.getData('text/plain');
        var c = cardById(id); if (c && c.col !== col.id) { c.col = col.id; persist(); }
      });
      boardEl.appendChild(colEl);
    });
    // Every card is drawn exactly once or it is not drawn at all. The banner above
    // names the ones that vanished; this is the arithmetic that proves none did.
    if (drawn !== state.cards.length) {
      console.warn('[board] ' + state.cards.length + ' cards in the data, ' + drawn +
        ' drawn — ' + (state.cards.length - drawn) + ' missing.');
    }
    var dl = document.getElementById('decision-list');
    dl.innerHTML = '';
    // Newest first: this is a log you check, not a story you re-read. Display
    // order only — the data keeps its chronological order for diffs and export.
    state.decisions.slice().reverse().forEach(function (d) { var li = document.createElement('li'); li.textContent = d; dl.appendChild(li); });
    var dc = document.getElementById('decision-count');
    if (dc) dc.textContent = state.decisions.length;
  }

  document.getElementById('decision-add').onkeydown = function (ev) {
    var inp = ev.target;
    if (ev.key === 'Enter' && inp.value.trim()) { state.decisions.push(inp.value.trim()); inp.value = ''; persist(); }
  };
  document.getElementById('reset').onclick = function () {
    if (confirm('Discard local draft and reload the committed board?')) {
      localStorage.removeItem(LS_KEY); state = committed; setStatus('committed state', false); render();
    }
  };
  document.getElementById('export').onclick = function () {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#board').innerHTML = '';
    clone.querySelector('#areas').innerHTML = '';
    clone.querySelector('#alpha').textContent = '';
    clone.querySelector('#decision-list').innerHTML = '';
    // Export always ships the default view — otherwise whatever panel was open
    // at export time gets baked into the committed file as its start state.
    clone.querySelector('#board').hidden = false;
    clone.querySelector('#areas').hidden = true;
    clone.querySelector('#decisions').hidden = true;
    Array.prototype.forEach.call(clone.querySelectorAll('#view-toggle button'), function (b) {
      b.className = b.dataset.view === 'status' ? 'on' : '';
    });
    clone.querySelector('#status').textContent = 'committed state';
    clone.querySelector('#status').className = '';
    // The banner is derived state, recomputed on load. Exporting it would bake a
    // stale warning into the file, which is its own way of lying about the board.
    clone.querySelector('#integrity').textContent = '';
    clone.querySelector('#integrity').hidden = true;
    clone.querySelector('#board-data').textContent = '\n' + JSON.stringify(state, null, 2) + '\n';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'board.html'; a.click();
    URL.revokeObjectURL(a.href);
    setStatus('exported — replace board.html in the repo and commit', false);
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  };


  /* ---------------------------------------------------------------
     Feature-area view.

     Same cards, grouped by which part of the app they build rather than
     by status, so you can see a surface's progress instead of a column's
     depth. The bar is stacked done / in-progress / next because "8 of 11
     done" hides whether the rest is moving or untouched.
     --------------------------------------------------------------- */
  /**
   * Alpha readiness.
   *
   * The denominator is a NAMED LIST, not a card count: "% of the board done" is
   * a meaningless number because the board carries plenty of work alpha does not
   * need, and is missing plenty of foundation work that was never carded. So the
   * gates are declared in state.alpha and every card-backed one reads its status
   * from the card itself — move a card, the bar moves. Nothing here is typed in.
   *
   * A gate whose card id no longer exists renders as unknown rather than being
   * silently dropped, because a vanished gate should be loud.
   */

  /**
   * Card detail drawer.
   *
   * Cards carry a short `title` and a long `detail`; only the title is on the board.
   * Card text had grown to a few thousand characters each, and four columns of that
   * is a wall nobody reads — a board you do not read is the same as no board.
   *
   * Both fields are editable here rather than through prompt(), because prompt()
   * cannot show you 3000 characters while you edit them.
   */
  function openDrawer(id) {
    var c = cardById(id);
    if (!c) return;
    var d = document.getElementById('drawer');
    var scrim = document.getElementById('drawer-scrim');
    d.textContent = '';

    var head = document.createElement('div');
    head.className = 'drawer__head';
    var idEl = document.createElement('span');
    idEl.className = 'drawer__id';
    idEl.textContent = c.id;
    var status = document.createElement('span');
    status.className = 'st st-' + c.col;
    status.textContent = c.col;
    var owner = document.createElement('span');
    owner.className = 'chip owner-' + (c.owner || 'none');
    owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
    head.appendChild(idEl); head.appendChild(status); head.appendChild(owner);
    if (c.tag) { var tg = document.createElement('span'); tg.className = 'chip tag'; tg.textContent = c.tag; head.appendChild(tg); }
    if (c.area) { var ar = document.createElement('span'); ar.className = 'chip tag'; ar.textContent = c.area; head.appendChild(ar); }

    var close = document.createElement('button');
    close.className = 'drawer__close'; close.textContent = 'Close';
    close.onclick = closeDrawer;
    head.appendChild(close);
    d.appendChild(head);

    var ti = document.createElement('textarea');
    ti.className = 'drawer__title'; ti.value = c.title; ti.rows = 2;
    ti.oninput = function () { c.title = ti.value; };
    ti.onchange = persist;
    d.appendChild(ti);

    var de = document.createElement('textarea');
    de.className = 'drawer__detail';
    de.value = c.detail || '';
    de.placeholder = 'Everything the headline does not say: what is true right now, what is left, and what will bite.';
    de.oninput = function () { c.detail = de.value; };
    de.onchange = persist;
    d.appendChild(de);

    var foot = document.createElement('div');
    foot.className = 'drawer__foot';
    var cp = document.createElement('button');
    cp.className = 'copy'; cp.textContent = 'copy card'; cp.dataset.label = 'copy card';
    cp.onclick = function () { copyText(c.title + (c.detail ? '\n\n' + c.detail : ''), cp); };
    foot.appendChild(cp);
    var hint = document.createElement('span');
    hint.className = 'drawer__hint';
    hint.textContent = 'Edits autosave locally — Export board.html and commit to share.';
    foot.appendChild(hint);
    d.appendChild(foot);

    d.hidden = false; scrim.hidden = false;
    requestAnimationFrame(function () { d.classList.add('open'); });
    scrim.onclick = closeDrawer;
    document.addEventListener('keydown', escClose);
  }

  function escClose(ev) { if (ev.key === 'Escape') closeDrawer(); }

  function closeDrawer() {
    var d = document.getElementById('drawer');
    var scrim = document.getElementById('drawer-scrim');
    d.classList.remove('open');
    document.removeEventListener('keydown', escClose);
    // Wait out the transition so the panel slides away instead of vanishing.
    setTimeout(function () { d.hidden = true; scrim.hidden = true; }, 180);
    render();
    if (view === 'area') renderAreas();
  }

  var alphaOpen = false;
  function renderAlpha() {
    var host = document.getElementById('alpha');
    var a = state.alpha;
    if (!host || !a) { if (host) host.hidden = true; return; }
    host.hidden = false;
    host.textContent = '';

    var shipped = (a.shipped || []).length;
    var gates = (a.gates || []).map(function (g) {
      var card = cardById(g.id);
      return { id: g.id, label: g.label, col: card ? card.col : 'unknown' };
    });
    var n = { done: shipped, progress: 0, open: 0 };
    gates.forEach(function (g) {
      if (g.col === 'done') n.done += 1;
      else if (g.col === 'progress') n.progress += 1;
      else n.open += 1;
    });
    var total = shipped + gates.length;
    var pct = total ? Math.round((100 * n.done) / total) : 0;

    var row = document.createElement('div');
    row.className = 'alpha__row';
    var h2 = document.createElement('h2');
    h2.textContent = 'Alpha readiness';
    h2.title = a.goal;
    var pctEl = document.createElement('span');
    pctEl.className = 'alpha__pct';
    pctEl.textContent = pct + '%';
    row.appendChild(h2); row.appendChild(pctEl);

    var bar = document.createElement('div');
    bar.className = 'bar';
    [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.open]].forEach(function (pair) {
      if (!pair[1]) return;
      var i = document.createElement('i');
      i.className = pair[0];
      i.style.width = (100 * pair[1]) / total + '%';
      bar.appendChild(i);
    });
    row.appendChild(bar);

    var key = document.createElement('div');
    key.className = 'alpha__key';
    [['var(--success)', n.done + ' done'],
     ['var(--accent)', n.progress + ' in flight'],
     ['var(--warn)', n.open + ' open']].forEach(function (pair) {
      var span = document.createElement('span');
      var sw = document.createElement('i');
      sw.style.background = pair[0];
      span.appendChild(sw);
      span.appendChild(document.createTextNode(pair[1]));
      key.appendChild(span);
    });
    row.appendChild(key);

    var toggle = document.createElement('button');
    toggle.className = 'alpha__toggle';
    toggle.textContent = (alphaOpen ? 'hide' : 'show') + ' ' + total + ' gates';
    toggle.onclick = function () { alphaOpen = !alphaOpen; renderAlpha(); };
    row.appendChild(toggle);
    host.appendChild(row);

    if (!alphaOpen) return;

    var sub = document.createElement('p');
    sub.className = 'alpha__sub';
    sub.textContent = a.goal + ' — ' + shipped + ' shipped foundations counted, ' + gates.length + ' gates remaining to check.';
    host.appendChild(sub);

    var grid = document.createElement('div');
    grid.className = 'alpha__gates';
    (a.shipped || []).forEach(function (label) {
      var g0 = document.createElement('div');
      g0.className = 'alpha__gate is-shipped';
      var st = document.createElement('span');
      st.className = 'st st-done';
      st.textContent = 'shipped';
      var t = document.createElement('span');
      t.textContent = label;
      g0.appendChild(st); g0.appendChild(t);
      grid.appendChild(g0);
    });
    gates.forEach(function (g) {
      var g1 = document.createElement('div');
      g1.className = 'alpha__gate';
      var st = document.createElement('span');
      st.className = 'st st-' + (g.col === 'unknown' ? 'backlog' : g.col);
      st.textContent = g.col === 'unknown' ? g.id + '?' : g.id;
      var t = document.createElement('span');
      t.textContent = g.label;
      g1.appendChild(st); g1.appendChild(t);
      grid.appendChild(g1);
    });
    host.appendChild(grid);
  }

  var COL_ORDER = { done: 0, progress: 1, next: 2, backlog: 3 };

  function colTitle(id) {
    var c = state.columns.filter(function (x) { return x.id === id; })[0];
    return c ? c.title : id;
  }

  function firstSentence(title) {
    // Card titles carry their whole history; the area view wants the claim,
    // not the changelog. Cut at the first sentence break that is not an
    // abbreviation-sized fragment.
    var t = title.replace(/\s+/g, ' ').trim();
    var cut = t.search(/[.:—]\s/);
    if (cut > 24) t = t.slice(0, cut);
    return t.length > 96 ? t.slice(0, 95).replace(/\s+\S*$/, '') + '…' : t;
  }

  function renderAreas() {
    areasEl.innerHTML = '';
    var groups = [];
    (state.areas || []).forEach(function (a) {
      if (!groups.some(function (g) { return g.name === a.group; })) groups.push({ name: a.group, areas: [] });
      groups.filter(function (g) { return g.name === a.group; })[0].areas.push(a);
    });

    groups.forEach(function (g) {
      var gEl = document.createElement('section');
      gEl.className = 'area-group';
      var gh = document.createElement('h2');
      gh.textContent = g.name;
      gEl.appendChild(gh);

      var grid = document.createElement('div');
      grid.className = 'area-grid';

      g.areas.forEach(function (a) {
        var cards = state.cards.filter(function (c) { return c.area === a.id; });
        cards.sort(function (x, y) {
          var d = (COL_ORDER[x.col] || 9) - (COL_ORDER[y.col] || 9);
          return d !== 0 ? d : parseInt(x.id.slice(1), 10) - parseInt(y.id.slice(1), 10);
        });

        var n = { done: 0, progress: 0, next: 0, backlog: 0 };
        cards.forEach(function (c) { n[c.col] = (n[c.col] || 0) + 1; });
        var total = cards.length || 1;

        var el = document.createElement('div');
        el.className = 'area' + (cards.length ? '' : ' is-empty');

        var head = document.createElement('div');
        head.className = 'area__h';
        var h3 = document.createElement('h3');
        h3.textContent = a.label;
        var count = document.createElement('span');
        count.className = 'area__n';
        count.textContent = n.done + '/' + cards.length + ' done';
        head.appendChild(h3); head.appendChild(count);
        el.appendChild(head);

        var bar = document.createElement('div');
        bar.className = 'bar';
        [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.next]].forEach(function (pair) {
          if (!pair[1]) return;
          var i = document.createElement('i');
          i.className = pair[0];
          i.style.width = (pair[1] / total * 100) + '%';
          bar.appendChild(i);
        });
        el.appendChild(bar);

        var ul = document.createElement('ul');
        cards.forEach(function (c) {
          var li = document.createElement('li');
          var st = document.createElement('span');
          st.className = 'st st-' + c.col;
          st.textContent = colTitle(c.col);
          var body = document.createElement('span');
          body.className = 't';
          var cid = document.createElement('b');
          cid.className = 'cid';
          cid.textContent = c.id + ' ';
          body.appendChild(cid);
          body.appendChild(document.createTextNode(firstSentence(c.title)));
          body.title = c.title;
          li.appendChild(st); li.appendChild(body);
          ul.appendChild(li);
        });
        el.appendChild(ul);
        grid.appendChild(el);
      });

      gEl.appendChild(grid);
      areasEl.appendChild(gEl);
    });
  }

  function setView(next) {
    view = next;
    boardEl.hidden = next !== 'status';
    areasEl.hidden = next !== 'area';
    document.getElementById('decisions').hidden = next !== 'log';
    Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
      b.className = b.dataset.view === next ? 'on' : '';
    });
    if (next === 'area') renderAreas();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
    b.onclick = function () { setView(b.dataset.view); };
  });

  render();
})();
</script>
</body>
</html>
