<script>
(function () {
  var DATA = document.getElementById('board-data');
  var LS_KEY = 'chirp-board-draft';
  var committed = JSON.parse(DATA.textContent);
  var state = committed;
  try {
    var draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (draft && draft.updated > committed.updated) { state = draft; setStatus('local draft — export & commit to share', true); }
  } catch (e) {}

  var boardEl = document.getElementById('board');
  var areasEl = document.getElementById('areas');
  var view = 'status';

  function setStatus(text, dirty) {
    var s = document.getElementById('status');
    s.textContent = text; s.className = dirty ? 'dirty' : '';
  }
  function persist() {
    state.updated = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    setStatus('unsaved changes — export & commit to share', true);
    render();
    if (view === 'area') renderAreas();
  }
  function cardById(id) { return state.cards.filter(function (c) { return c.id === id; })[0]; }

  /**
   * Copy `text`, then flash the result on the button itself.
   * navigator.clipboard needs a secure context and this board is normally opened
   * straight off disk (file://), where it's commonly unavailable or rejects — so
   * fall back to a throwaway textarea + execCommand rather than silently no-op.
   */
  function copyText(text, btn) {
    var label = btn.dataset.label;
    function flash(ok) {
      btn.textContent = ok ? 'copied' : 'copy failed';
      btn.className = 'copy ' + (ok ? 'ok' : 'fail');
      setTimeout(function () { btn.textContent = label; btn.className = 'copy'; }, 1200);
    }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      flash(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, legacy);
    } else {
      legacy();
    }
  }

  /* Cards whose `col` matches no column id render NOWHERE, and until this existed
   * they did it silently — the file parsed, the card was in the data, and the board
   * looked complete. It happened three times in one day: seven cards at once
   * (c39, c73, c86, c88, c101, c102, c104), then c108, then c110. Two of those were
   * DO-NOT-DEPLOY warnings, and the session that wrote one of them told three other
   * sessions and Jose it was carded while it was invisible.
   *
   * The cause is that the columns have two names each — an id ("backlog") and a
   * human title ("Next") — and writing the title where the id belongs is silent.
   * It spread by imitation, since every card copied from a bad card was bad too.
   *
   * So: say so on screen, not just in the console. Jose reads this board in a
   * browser tab and would never see a console.warn. A card that cannot be drawn is
   * listed by id in a banner instead, which is the one place it cannot be missed. */
  function renderIntegrity() {
    var colIds = state.columns.map(function (col) { return col.id; });
    var orphans = state.cards.filter(function (c) { return colIds.indexOf(c.col) === -1; });
    var el = document.getElementById('integrity');
    if (!orphans.length) { el.hidden = true; el.textContent = ''; return; }
    var ids = orphans.map(function (c) { return c.id + ' (col "' + c.col + '")'; });
    el.hidden = false;
    el.textContent =
      orphans.length + (orphans.length === 1 ? ' CARD IS' : ' CARDS ARE') +
      ' NOT ON THIS BOARD — its `col` matches no column. Valid values are ' +
      colIds.join(' / ') + '. Invisible: ' + ids.join(', ');
    console.warn('[board] cards rendering nowhere:', orphans.map(function (c) {
      return { id: c.id, col: c.col, title: c.title };
    }));
  }

  function render() {
    // The alpha bar reads the same cards the columns do, so it repaints with
    // them rather than on its own schedule — otherwise dragging a gate card
    // leaves a stale percentage sitting above the board that looks authoritative.
    renderAlpha();
    renderIntegrity();
    boardEl.innerHTML = '';
    var drawn = 0;
    state.columns.forEach(function (col) {
      var colEl = document.createElement('div');
      colEl.className = 'col'; colEl.dataset.col = col.id;
      var cards = state.cards.filter(function (c) { return c.col === col.id; });
      drawn += cards.length;
      var h = document.createElement('h2');
      h.innerHTML = col.title + ' <span class="count">' + cards.length + '</span>';
      colEl.appendChild(h);
      var stack = document.createElement('div');
      stack.className = 'stack';
      colEl.appendChild(stack);
      cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'card'; el.draggable = true; el.dataset.id = c.id;
        // Card id, rendered as its own line above the title. It exists in the data
        // and is how everyone refers to cards in commits, PRs and conversation
        // ("c36", "c61") — but it was never on screen, so a card's name was
        // unreadable from the board itself.
        var idLine = document.createElement('div');
        idLine.className = 'card-id';
        idLine.textContent = c.id;
        var t = document.createElement('div'); t.className = 'title'; t.textContent = c.title;
        // The card shows a headline; everything else lives in the drawer. Card text
        // grew long enough that four columns of it was unreadable — and a board you
        // do not read is the same as no board.
        if (c.detail) { el.classList.add('has-detail'); }
        el.addEventListener('click', function (ev) {
          // Ignore clicks on the meta-row controls, which have their own jobs.
          if (ev.target.closest('.meta')) return;
          openDrawer(c.id);
        });
        var meta = document.createElement('div'); meta.className = 'meta';
        var owner = document.createElement('button');
        owner.className = 'chip owner-' + (c.owner || 'none');
        owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
        owner.onclick = function () { c.owner = c.owner === '' ? 'J' : c.owner === 'J' ? 'Q' : ''; persist(); };
        meta.appendChild(owner);
        if (c.tag) { var tag = document.createElement('span'); tag.className = 'chip tag'; tag.textContent = c.tag; meta.appendChild(tag); }
        var copy = document.createElement('button');
        copy.className = 'copy'; copy.textContent = 'copy'; copy.dataset.label = 'copy';
        copy.title = 'Copy this card’s text';
        copy.onclick = function (ev) { ev.stopPropagation(); copyText(c.title + (c.detail ? '\n\n' + c.detail : ''), copy); };
        meta.appendChild(copy);
        var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
        del.onclick = function () { if (confirm('Delete card?')) { state.cards = state.cards.filter(function (x) { return x.id !== c.id; }); persist(); } };
        meta.appendChild(del);
        t.ondblclick = function () { var v = prompt('Edit card', c.title); if (v) { c.title = v; persist(); } };
        meta.insertBefore(idLine, meta.firstChild); el.appendChild(meta); el.appendChild(t);
        el.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
        el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
        stack.appendChild(el);
      });
      var adder = document.createElement('input');
      adder.className = 'adder'; adder.placeholder = '+ add card';
      adder.onkeydown = function (ev) {
        if (ev.key === 'Enter' && adder.value.trim()) {
          state.cards.push({ id: 'c' + Date.now(), col: col.id, title: adder.value.trim(), owner: '', tag: '' });
          persist();
        }
      };
      colEl.appendChild(adder);
      colEl.addEventListener('dragover', function (ev) { ev.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', function () { colEl.classList.remove('drag-over'); });
      colEl.addEventListener('drop', function (ev) {
        ev.preventDefault(); colEl.classList.remove('drag-over');
        var id = ev.dataTransfer.getData('text/plain');
        var c = cardById(id); if (c && c.col !== col.id) { c.col = col.id; persist(); }
      });
      boardEl.appendChild(colEl);
    });
    // Every card is drawn exactly once or it is not drawn at all. The banner above
    // names the ones that vanished; this is the arithmetic that proves none did.
    if (drawn !== state.cards.length) {
      console.warn('[board] ' + state.cards.length + ' cards in the data, ' + drawn +
        ' drawn — ' + (state.cards.length - drawn) + ' missing.');
    }
    var dl = document.getElementById('decision-list');
    dl.innerHTML = '';
    // Newest first: this is a log you check, not a story you re-read. Display
    // order only — the data keeps its chronological order for diffs and export.
    state.decisions.slice().reverse().forEach(function (d) { var li = document.createElement('li'); li.textContent = d; dl.appendChild(li); });
    var dc = document.getElementById('decision-count');
    if (dc) dc.textContent = state.decisions.length;
  }

  document.getElementById('decision-add').onkeydown = function (ev) {
    var inp = ev.target;
    if (ev.key === 'Enter' && inp.value.trim()) { state.decisions.push(inp.value.trim()); inp.value = ''; persist(); }
  };
  document.getElementById('reset').onclick = function () {
    if (confirm('Discard local draft and reload the committed board?')) {
      localStorage.removeItem(LS_KEY); state = committed; setStatus('committed state', false); render();
    }
  };
  document.getElementById('export').onclick = function () {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#board').innerHTML = '';
    clone.querySelector('#areas').innerHTML = '';
    clone.querySelector('#alpha').textContent = '';
    clone.querySelector('#decision-list').innerHTML = '';
    // Export always ships the default view — otherwise whatever panel was open
    // at export time gets baked into the committed file as its start state.
    clone.querySelector('#board').hidden = false;
    clone.querySelector('#areas').hidden = true;
    clone.querySelector('#decisions').hidden = true;
    Array.prototype.forEach.call(clone.querySelectorAll('#view-toggle button'), function (b) {
      b.className = b.dataset.view === 'status' ? 'on' : '';
    });
    clone.querySelector('#status').textContent = 'committed state';
    clone.querySelector('#status').className = '';
    // The banner is derived state, recomputed on load. Exporting it would bake a
    // stale warning into the file, which is its own way of lying about the board.
    clone.querySelector('#integrity').textContent = '';
    clone.querySelector('#integrity').hidden = true;
    clone.querySelector('#board-data').textContent = '\n' + JSON.stringify(state, null, 2) + '\n';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'board.html'; a.click();
    URL.revokeObjectURL(a.href);
    setStatus('exported — replace board.html in the repo and commit', false);
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  };


  /* ---------------------------------------------------------------
     Feature-area view.

     Same cards, grouped by which part of the app they build rather than
     by status, so you can see a surface's progress instead of a column's
     depth. The bar is stacked done / in-progress / next because "8 of 11
     done" hides whether the rest is moving or untouched.
     --------------------------------------------------------------- */
  /**
   * Alpha readiness.
   *
   * The denominator is a NAMED LIST, not a card count: "% of the board done" is
   * a meaningless number because the board carries plenty of work alpha does not
   * need, and is missing plenty of foundation work that was never carded. So the
   * gates are declared in state.alpha and every card-backed one reads its status
   * from the card itself — move a card, the bar moves. Nothing here is typed in.
   *
   * A gate whose card id no longer exists renders as unknown rather than being
   * silently dropped, because a vanished gate should be loud.
   */

  /**
   * Card detail drawer.
   *
   * Cards carry a short `title` and a long `detail`; only the title is on the board.
   * Card text had grown to a few thousand characters each, and four columns of that
   * is a wall nobody reads — a board you do not read is the same as no board.
   *
   * Both fields are editable here rather than through prompt(), because prompt()
   * cannot show you 3000 characters while you edit them.
   */
  function openDrawer(id) {
    var c = cardById(id);
    if (!c) return;
    var d = document.getElementById('drawer');
    var scrim = document.getElementById('drawer-scrim');
    d.textContent = '';

    var head = document.createElement('div');
    head.className = 'drawer__head';
    var idEl = document.createElement('span');
    idEl.className = 'drawer__id';
    idEl.textContent = c.id;
    var status = document.createElement('span');
    status.className = 'st st-' + c.col;
    status.textContent = c.col;
    var owner = document.createElement('span');
    owner.className = 'chip owner-' + (c.owner || 'none');
    owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
    head.appendChild(idEl); head.appendChild(status); head.appendChild(owner);
    if (c.tag) { var tg = document.createElement('span'); tg.className = 'chip tag'; tg.textContent = c.tag; head.appendChild(tg); }
    if (c.area) { var ar = document.createElement('span'); ar.className = 'chip tag'; ar.textContent = c.area; head.appendChild(ar); }

    var close = document.createElement('button');
    close.className = 'drawer__close'; close.textContent = 'Close';
    close.onclick = closeDrawer;
    head.appendChild(close);
    d.appendChild(head);

    var ti = document.createElement('textarea');
    ti.className = 'drawer__title'; ti.value = c.title; ti.rows = 2;
    ti.oninput = function () { c.title = ti.value; };
    ti.onchange = persist;
    d.appendChild(ti);

    var de = document.createElement('textarea');
    de.className = 'drawer__detail';
    de.value = c.detail || '';
    de.placeholder = 'Everything the headline does not say: what is true right now, what is left, and what will bite.';
    de.oninput = function () { c.detail = de.value; };
    de.onchange = persist;
    d.appendChild(de);

    var foot = document.createElement('div');
    foot.className = 'drawer__foot';
    var cp = document.createElement('button');
    cp.className = 'copy'; cp.textContent = 'copy card'; cp.dataset.label = 'copy card';
    cp.onclick = function () { copyText(c.title + (c.detail ? '\n\n' + c.detail : ''), cp); };
    foot.appendChild(cp);
    var hint = document.createElement('span');
    hint.className = 'drawer__hint';
    hint.textContent = 'Edits autosave locally — Export board.html and commit to share.';
    foot.appendChild(hint);
    d.appendChild(foot);

    d.hidden = false; scrim.hidden = false;
    requestAnimationFrame(function () { d.classList.add('open'); });
    scrim.onclick = closeDrawer;
    document.addEventListener('keydown', escClose);
  }

  function escClose(ev) { if (ev.key === 'Escape') closeDrawer(); }

  function closeDrawer() {
    var d = document.getElementById('drawer');
    var scrim = document.getElementById('drawer-scrim');
    d.classList.remove('open');
    document.removeEventListener('keydown', escClose);
    // Wait out the transition so the panel slides away instead of vanishing.
    setTimeout(function () { d.hidden = true; scrim.hidden = true; }, 180);
    render();
    if (view === 'area') renderAreas();
  }

  var alphaOpen = false;
  function renderAlpha() {
    var host = document.getElementById('alpha');
    var a = state.alpha;
    if (!host || !a) { if (host) host.hidden = true; return; }
    host.hidden = false;
    host.textContent = '';

    var shipped = (a.shipped || []).length;
    var gates = (a.gates || []).map(function (g) {
      var card = cardById(g.id);
      return { id: g.id, label: g.label, col: card ? card.col : 'unknown' };
    });
    var n = { done: shipped, progress: 0, open: 0 };
    gates.forEach(function (g) {
      if (g.col === 'done') n.done += 1;
      else if (g.col === 'progress') n.progress += 1;
      else n.open += 1;
    });
    var total = shipped + gates.length;
    var pct = total ? Math.round((100 * n.done) / total) : 0;

    var row = document.createElement('div');
    row.className = 'alpha__row';
    var h2 = document.createElement('h2');
    h2.textContent = 'Alpha readiness';
    h2.title = a.goal;
    var pctEl = document.createElement('span');
    pctEl.className = 'alpha__pct';
    pctEl.textContent = pct + '%';
    row.appendChild(h2); row.appendChild(pctEl);

    var bar = document.createElement('div');
    bar.className = 'bar';
    [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.open]].forEach(function (pair) {
      if (!pair[1]) return;
      var i = document.createElement('i');
      i.className = pair[0];
      i.style.width = (100 * pair[1]) / total + '%';
      bar.appendChild(i);
    });
    row.appendChild(bar);

    var key = document.createElement('div');
    key.className = 'alpha__key';
    [['var(--success)', n.done + ' done'],
     ['var(--accent)', n.progress + ' in flight'],
     ['var(--warn)', n.open + ' open']].forEach(function (pair) {
      var span = document.createElement('span');
      var sw = document.createElement('i');
      sw.style.background = pair[0];
      span.appendChild(sw);
      span.appendChild(document.createTextNode(pair[1]));
      key.appendChild(span);
    });
    row.appendChild(key);

    var toggle = document.createElement('button');
    toggle.className = 'alpha__toggle';
    toggle.textContent = (alphaOpen ? 'hide' : 'show') + ' ' + total + ' gates';
    toggle.onclick = function () { alphaOpen = !alphaOpen; renderAlpha(); };
    row.appendChild(toggle);
    host.appendChild(row);

    if (!alphaOpen) return;

    var sub = document.createElement('p');
    sub.className = 'alpha__sub';
    sub.textContent = a.goal + ' — ' + shipped + ' shipped foundations counted, ' + gates.length + ' gates remaining to check.';
    host.appendChild(sub);

    var grid = document.createElement('div');
    grid.className = 'alpha__gates';
    (a.shipped || []).forEach(function (label) {
      var g0 = document.createElement('div');
      g0.className = 'alpha__gate is-shipped';
      var st = document.createElement('span');
      st.className = 'st st-done';
      st.textContent = 'shipped';
      var t = document.createElement('span');
      t.textContent = label;
      g0.appendChild(st); g0.appendChild(t);
      grid.appendChild(g0);
    });
    gates.forEach(function (g) {
      var g1 = document.createElement('div');
      g1.className = 'alpha__gate';
      var st = document.createElement('span');
      st.className = 'st st-' + (g.col === 'unknown' ? 'backlog' : g.col);
      st.textContent = g.col === 'unknown' ? g.id + '?' : g.id;
      var t = document.createElement('span');
      t.textContent = g.label;
      g1.appendChild(st); g1.appendChild(t);
      grid.appendChild(g1);
    });
    host.appendChild(grid);
  }

  var COL_ORDER = { done: 0, progress: 1, next: 2, backlog: 3 };

  function colTitle(id) {
    var c = state.columns.filter(function (x) { return x.id === id; })[0];
    return c ? c.title : id;
  }

  function firstSentence(title) {
    // Card titles carry their whole history; the area view wants the claim,
    // not the changelog. Cut at the first sentence break that is not an
    // abbreviation-sized fragment.
    var t = title.replace(/\s+/g, ' ').trim();
    var cut = t.search(/[.:—]\s/);
    if (cut > 24) t = t.slice(0, cut);
    return t.length > 96 ? t.slice(0, 95).replace(/\s+\S*$/, '') + '…' : t;
  }

  function renderAreas() {
    areasEl.innerHTML = '';
    var groups = [];
    (state.areas || []).forEach(function (a) {
      if (!groups.some(function (g) { return g.name === a.group; })) groups.push({ name: a.group, areas: [] });
      groups.filter(function (g) { return g.name === a.group; })[0].areas.push(a);
    });

    groups.forEach(function (g) {
      var gEl = document.createElement('section');
      gEl.className = 'area-group';
      var gh = document.createElement('h2');
      gh.textContent = g.name;
      gEl.appendChild(gh);

      var grid = document.createElement('div');
      grid.className = 'area-grid';

      g.areas.forEach(function (a) {
        var cards = state.cards.filter(function (c) { return c.area === a.id; });
        cards.sort(function (x, y) {
          var d = (COL_ORDER[x.col] || 9) - (COL_ORDER[y.col] || 9);
          return d !== 0 ? d : parseInt(x.id.slice(1), 10) - parseInt(y.id.slice(1), 10);
        });

        var n = { done: 0, progress: 0, next: 0, backlog: 0 };
        cards.forEach(function (c) { n[c.col] = (n[c.col] || 0) + 1; });
        var total = cards.length || 1;

        var el = document.createElement('div');
        el.className = 'area' + (cards.length ? '' : ' is-empty');

        var head = document.createElement('div');
        head.className = 'area__h';
        var h3 = document.createElement('h3');
        h3.textContent = a.label;
        var count = document.createElement('span');
        count.className = 'area__n';
        count.textContent = n.done + '/' + cards.length + ' done';
        head.appendChild(h3); head.appendChild(count);
        el.appendChild(head);

        var bar = document.createElement('div');
        bar.className = 'bar';
        [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.next]].forEach(function (pair) {
          if (!pair[1]) return;
          var i = document.createElement('i');
          i.className = pair[0];
          i.style.width = (pair[1] / total * 100) + '%';
          bar.appendChild(i);
        });
        el.appendChild(bar);

        var ul = document.createElement('ul');
        cards.forEach(function (c) {
          var li = document.createElement('li');
          var st = document.createElement('span');
          st.className = 'st st-' + c.col;
          st.textContent = colTitle(c.col);
          var body = document.createElement('span');
          body.className = 't';
          var cid = document.createElement('b');
          cid.className = 'cid';
          cid.textContent = c.id + ' ';
          body.appendChild(cid);
          body.appendChild(document.createTextNode(firstSentence(c.title)));
          body.title = c.title;
          li.appendChild(st); li.appendChild(body);
          ul.appendChild(li);
        });
        el.appendChild(ul);
        grid.appendChild(el);
      });

      gEl.appendChild(grid);
      areasEl.appendChild(gEl);
    });
  }

  function setView(next) {
    view = next;
    boardEl.hidden = next !== 'status';
    areasEl.hidden = next !== 'area';
    document.getElementById('decisions').hidden = next !== 'log';
    Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
      b.className = b.dataset.view === next ? 'on' : '';
    });
    if (next === 'area') renderAreas();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
    b.onclick = function () { setView(b.dataset.view); };
  });

  render();
})();
</script>
</body>
</html>
