<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp Board</title>
<style>
  :root {
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-alt:#EFF1F7; --ink:#101223;
    --ink-2:#575B75; --ink-3:#9BA0B8; --border:rgba(16,18,35,.08);
    --accent:#5B5BF6; --accent-soft:#ECECFE; --success:#17A673; --success-soft:#E3F6EE;
    --danger:#E5484D; --danger-soft:#FDECEC; --warn:#F5A623;
    --shadow:0 2px 16px rgba(16,18,35,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C0D14; --surface:#15161F; --surface-alt:#1D1E2A; --ink:#F2F3FA;
      --ink-2:#A6AAC4; --ink-3:#666B85; --border:rgba(242,243,250,.09);
      --accent:#7C7CFF; --accent-soft:rgba(124,124,255,.16); --success:#2BD597;
      --success-soft:rgba(43,213,151,.16); --danger:#FF6369; --danger-soft:rgba(255,99,105,.16);
      --shadow:none;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  h1 span { color:var(--accent); }
  #status { font-size:12.5px; font-weight:500; color:var(--ink-3); flex:1; }
  #status.dirty { color:var(--warn); }
  button { font:inherit; border:0; cursor:pointer; border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface-alt); color:var(--ink-2); }
  #board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:start; }
  @media (max-width:900px){ #board { grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ #board { grid-template-columns:1fr;} }
  .col { background:var(--surface-alt); border-radius:20px; padding:12px; min-height:120px; }
  .col.drag-over { outline:2px dashed var(--accent); outline-offset:-4px; }
  .col h2 { font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-2); padding:4px 8px 10px; display:flex; justify-content:space-between; }
  .col h2 .count { color:var(--ink-3); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:10px 12px; margin-bottom:8px; cursor:grab; }
  .card.dragging { opacity:.4; }
  /* Card id line — monospace and muted so it reads as a label, not a heading.
     Selectable so an id can be copied straight out of the board. */
  .card .card-id { font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.6px;
    text-transform:uppercase; color:var(--accent); margin-bottom:4px; user-select:text; }
  .card .title { font-weight:600; font-size:14px; }
  .card .meta { display:flex; gap:6px; margin-top:8px; align-items:center; }
  .chip { font-size:11px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:3px 10px; background:var(--surface-alt); color:var(--ink-2); border:0; cursor:pointer; }
  .chip.owner-J { background:var(--accent-soft); color:var(--accent); }
  .chip.owner-Q { background:var(--success-soft); color:var(--success); }
  .chip.tag { cursor:default; }
  .card .copy { margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:11px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:3px 9px; cursor:pointer; }
  .card .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .card .copy.ok { color:var(--success); background:var(--success-soft); }
  .card .copy.fail { color:var(--danger); background:var(--danger-soft); }
  .card .del { background:none; border:0; color:var(--ink-3); font-size:14px; padding:2px 6px; cursor:pointer; }
  .card .del:hover { color:var(--danger); }
  .adder { width:100%; background:transparent; border:1px dashed var(--border); border-radius:12px; padding:9px 12px; font:inherit; font-size:13px; color:var(--ink); outline:none; }
  .adder::placeholder { color:var(--ink-3); }
  .adder:focus { border-color:var(--accent); background:var(--surface); }
  #decisions { margin-top:28px; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:16px 20px; }
  #decisions h2 { font-size:16px; font-weight:700; margin-bottom:10px; }
  #decisions li { margin:6px 0 6px 18px; color:var(--ink-2); font-size:13.5px; }
  #decisions li b { color:var(--ink); }
  #decisions input { width:100%; margin-top:10px; }
  footer { margin-top:16px; font-size:12px; color:var(--ink-3); }
  /* Feature-area view: the same cards grouped by what part of the app they
     build, so progress reads per surface instead of per status column. */
  /* #board sets display:grid and #areas display:flex, both of which outrank the
     UA stylesheet's [hidden]{display:none} — so toggling the attribute alone
     leaves both views stacked on screen. */
  [hidden] { display:none !important; }
  .view-toggle { display:inline-flex; background:var(--surface-alt); border-radius:999px; padding:3px; gap:2px; }
  .view-toggle button { background:none; color:var(--ink-2); padding:6px 14px; }
  .view-toggle button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  #areas { display:flex; flex-direction:column; gap:26px; }
  .area-group > h2 { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-3); margin-bottom:10px; }
  .area-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-items:start; }
  .area { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:14px 15px; }
  .area.is-empty { opacity:.55; }
  .area__h { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .area__h h3 { font-size:15px; font-weight:700; }
  .area__n { margin-left:auto; font-size:12px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  /* Alpha readiness. Recomputed from the cards on every render, never typed in
     by hand — a hardcoded percentage is a number that starts lying the moment
     someone moves a card. */
  #alpha { border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:12px; }
  .alpha__h { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .alpha__h h2 { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  .alpha__pct { margin-left:auto; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
  .alpha__sub { font-size:12.5px; color:var(--ink-3); margin-top:2px; }
  .alpha__key { display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); margin-top:2px; }
  .alpha__key i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .alpha__gates { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 14px; margin-top:10px; }
  .alpha__gate { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:12.5px; padding:3px 0; }
  .alpha__gate .st { font-size:9.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; border-radius:999px; padding:2px 7px; white-space:nowrap; }
  .alpha__gate.is-shipped { color:var(--ink-3); }

  .bar { height:5px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:8px 0 12px; display:flex; }
  .bar i { display:block; height:100%; }
  .bar .b-done { background:var(--success); }
  .bar .b-prog { background:var(--accent); }
  .bar .b-next { background:var(--warn); }
  .area ul { list-style:none; display:flex; flex-direction:column; gap:7px; }
  .area li { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:13px; }
  .area li .st { font-size:9.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; border-radius:999px; padding:2px 7px; white-space:nowrap; }
  .st-done { background:var(--success-soft); color:var(--success); }
  .st-progress { background:var(--accent-soft); color:var(--accent); }
  .st-next { background:#FDF3E1; color:#B87503; }
  .st-backlog { background:var(--surface-alt); color:var(--ink-3); }
  @media (prefers-color-scheme: dark) { .st-next { background:rgba(255,184,77,.16); color:#FFB84D; } }
  .area li b { font-weight:600; color:var(--ink); }
  .area li span.t { color:var(--ink-2); }
  .area li .cid { font-size:11px; color:var(--ink-3); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Chirp <span>Board</span></h1>
  <div class="view-toggle" id="view-toggle">
    <button data-view="status" class="on">Status</button>
    <button data-view="area">Feature area</button>
  </div>
  <div id="status">committed state</div>
  <button class="btn-ghost" id="reset">Reset to committed</button>
  <button class="btn-primary" id="export">Export board.html</button>
</header>
<section id="alpha"></section>
<main id="board"></main>
<main id="areas" hidden></main>
<section id="decisions">
  <h2>Decisions log</h2>
  <ul id="decision-list"></ul>
  <input class="adder" id="decision-add" placeholder="+ record a decision (date — what we decided)">
</section>
<footer>
  How it works: drag cards between columns · click the owner chip to cycle – / J / Q · double-click a title to edit ·
  changes autosave locally, then <b>Export board.html</b> and commit the downloaded file over this one so the other dev gets it.
</footer>

      "col": "done",
      "owner": "J",
      "tag": "backend",
      "title": "[shared] gateway.py did NOT degrade when Redis was down — FIXED in PR #13. pubsub.subscribe() ran AFTER websocket.accept() with no try/except, so an unreachable Redis raised mid-handler and the client saw a socket that opened and instantly died: shaped exactly like a flaky network, with nothing server-side saying the cause was missing infrastructure. Since c61 proved Redis was never provisioned in prod, that was EVERY connection, not an edge case. Now closes with 4503 (mirrors HTTP 503) and logs at error level. The split from 4401 is the entire point: 4401 means the session is bad and the user should be sent to sign-in, 4503 means the session is fine and the client should back off — one generic code would let a Redis outage silently sign every user out. Teardown is suppressed too, so a Redis death mid-connection cannot raise in the finally block and mask whatever actually ended the connection. 3 tests in backend/tests/test_ws_redis_down.py, deliberately a separate file from Q's test_ws_fanout.py so PR #12 and PR #13 do not collide. Proven load-bearing by restoring the unguarded subscribe and watching the two behavioural tests fail, while the third (auth resolves BEFORE anything touches Redis) correctly kept passing since that ordering was never broken. 145 backend tests green. REVIEW FOLLOW-UP Aug 15: reviewing my own PR found TWO more bugs in this very fix. (1) The teardown sat on the wrong side of a re-raise — awaiting the forward task re-raises whatever it stored, and suppress(CancelledError) does not catch a ConnectionError, so a Redis that died after subscribe skipped the pubsub cleanup entirely and the exception escaped the finally block. CancelledError is a BaseException; suppressing one of the two lets the other through. (2) Nothing observed the forwarder dying at all: the handler only awaited the client drain, so a Redis dropping AFTER connect left the socket open delivering zero events with no log and no close frame — the exact c62 symptom, moved from connect time to steady state. Both tasks now race on FIRST_COMPLETED. Lesson: a fix is not verified by the tests written alongside it.",

  "decisions": [
    "Aug 16 - Security process: A VULNERABILITY CAN BE LOAD-BEARING, AND THAT IS WHY REVIEWS MISS IT. Removing client-supplied campus_id from POST /auth/bootstrap (c85) broke 23 tests, because claiming a campus at bootstrap was the ONLY way anything in the suite assigned one. The Aug 15 five-lens review's authorization pass found nothing here and was not wrong: it checked that campus and org scoping were applied CONSISTENTLY at every call site, and they are. It never asked whether the value being compared was trustworthy. The lesson to carry into c86 and c88: for any field that gates access, ask WHO WRITES IT before checking who reads it, and treat 'the tests need this to work' as evidence the mechanism is load-bearing rather than as a reason to keep it.",
    "Aug 16 - Process: A CLAIMED MIGRATION NUMBER THAT TURNS OUT UNNEEDED GETS RELEASED OUT LOUD. 0012 was claimed for c69 before the work started, per the claim-before-you-write rule, and the purge job needed no schema change. Rather than quietly keeping it or quietly reusing it, the card says RELEASED and names the next free number. A silently-held number is the same failure as a silently-duplicated one: the next person reads the board, sees 0012 taken, skips to 0014, and there is now a permanent hole nobody can explain. Claiming is cheap, so releasing has to be equally cheap or people stop claiming.",
    "Aug 16 - Product: THE .EDU RULE IS TWO TIERS, NOT ONE GATE. Jose's calls, made Aug 16 against three options each. (1) Joining a chapter by invite code grants ORG content - the chapter's private feed, events, roster and dues - because an officer letting you in is itself a vouch. The CAMPUS-WIDE feed and Yak stay behind .edu verification, because that is the surface where a stranger reading your school's posts actually costs something. (2) Verification is RE-CHECKED YEARLY: store verified_at and require a fresh code annually, so the verified population stays close to actually-enrolled rather than drifting into a 2035 account reading a 2026 campus. (3) An unverified user gets a REAL VERIFY SCREEN, not an empty feed and not a bare error - the form is on the screen that refused them. THE CONSEQUENCE THAT MATTERS FOR ALPHA: the chapter experience needs NO email infrastructure, so c87 and c86 do not block Q's old chapter using org tools and paying dues. They block Yak and the campus feed only. That is worth knowing before anyone treats transactional email as an alpha blocker.",
    "Aug 16 - Product + Security: CAMPUS ACCESS REQUIRES PROVING YOU GO THERE. Anyone may sign up with a personal email; seeing a campus feed or Yak requires verifying an .edu address on that campus's domain allowlist. This is Jose's call and it is the right one, but the framing changed once we read the code: campus_id is client-supplied at bootstrap and unvalidated, so this is not a new restriction on an existing boundary, it IS the boundary (c85). Three consequences worth writing down. First, campus_id becomes server-owned and the verification redemption is its only writer - a user who has proven nothing has no campus, which is the correct state rather than an edge case. Second, the sign-in email can NEVER be the proof: Apple's Hide My Email returns a private-relay address and Google returns gmail.com, so authentication (who you are) and verification (where you study) are permanently two different questions with two different addresses. Third, this is blocked on something we do not have at all - there is no transactional email anywhere in the repo (c87), and university mail servers filter gmail senders, so it is coupled to owning a domain.",
    "Aug 16 — Process: STALE BRANCHES ARE TAGGED, NOT JUST DELETED. Cleaned origin down to main + the two branches with open PRs. jose/auth-orgs was fully merged and just went. q/website (a complete second marketing site Q built in parallel, never deployed, superseded by the React one already live) and q/mock-identity-fixes (21 behind, and main already carries a better version of its alumni fix — inner join with the reason written down, plus a 114-line test against that branch's 59) both carried unmerged commits, so each got an archive/<branch> tag pushed to origin BEFORE the branch was deleted. Deleting another dev's unmerged work from shared origin is destructive even when the work is dead; a tag costs nothing and makes it recoverable by anyone, not just whoever still has the local copy. Harvested before deleting, too: q/website's commit message caught a claim our LIVE terms also makes, which is now c76.",
    "Aug 16 — Design: the site's phone header carries a REAL MENU rather than hiding links. The previous approach dropped the two longest nav items at phone width and relied on the footer, which meant two of four pages were only reachable by scrolling to the bottom of a different page. Rule this sets: responsive design removes CHROME, never DESTINATIONS. If something does not fit, it moves behind a control that says what it is — not out of the document. (c72)",
    "Aug 15 — Design: the site's vertical rhythm is now a NAMED LAYER (--rhythm-section / -tight / -hero / -head) sitting between the pages and the --space-* scale, and it is the only thing besides running-text size that a phone changes. The rule this encodes: a token named for its value must keep that value everywhere, so responsive steps get semantic tokens of their own rather than a media query that quietly redefines --space-96 to 56px. Second half of the same decision: --body stays 15px and keeps mirroring app-mobile/src/theme, because the site's buttons and nav ARE the app's chrome, while prose moved to a new --reading step (16px, 17px on a phone). The site and the app are allowed to diverge on reading distance and on nothing else. (c72)",
    "Aug 15 — Design: responsive breakpoints on the site key on HEIGHT as well as width where the rule is about vertical room. A phone in landscape is 844x390 — it passes every width test and then spends half the screen on hero padding, which is the same bug the phone card was filed for. Width-only breakpoints are correct for 'how much room across' (mockup size, tap targets, column counts) and wrong for 'how much room down'. (c72)",
    "Aug 11 — Product: Chirp is for ALL students; greek chapters are orgs you join under the Orgs tab. Same auth for everyone.",
    "Aug 11 — Design: default scaffold theme rejected. Dribbble-modern direction is binding, spec in app-mobile/DESIGN.md (violet accent, soft neutral canvas, pill everything, floating tab bar).",
    "Aug 11 — Process: this board is the source of truth for who's doing what. Not on the board = not claimed.",
    "Aug 12 — Design: Home = media FYP (Twitter/Insta/Snap mix — anything postable), themed to SCHOOL COLORS with user-controlled accent/background (DESIGN.md §7 + §8.5). Two dribbble refs codified.",
    "Aug 12 — Crypto: libsignal requires PQXDH (post-quantum Kyber prekeys) — key directory being extended (kyber_prekeys, migration 0002). 1:1 wire-format rule documented in SPEC §6.",
    "Aug 12 — E2EE spike verdict: @signalapp/libsignal-client works on macOS x64 Node; RN path recommendation in spikes/libsignal-node/FINDINGS.md; physical-device test still owed.",
    "Aug 12 — Product: org posts are PRIVATE to the org (never on the FYP). Orgs tab = Feed / Events / Tools segments in org colors; Events = Partiful-style planning (DESIGN §8.7). App rebranded to UNC Greensboro; every frat/sorority wears its own colors (§8.6).",
    "Aug 13 — Process: work split BY FEATURE VERTICAL. Vertical A (Auth & Orgs) = Jose; Vertical B (Social & Messaging) = Q. First milestone = GO-LIVE INTEGRATION. Sprint 0 (shared): one reachable backend + Firebase project before either vertical starts. Shared files (api/client, theme, components, mocks): touch sparingly, ping each other.",
    "Aug 13 — Process: feature work happens on per-dev branches (jose/auth-orgs, q/social-msg) merged to main via PR — no more direct-to-main feature commits, avoids merge collisions. EXCEPTION: board.html updates commit straight to main so both devs always see the live board.",
    "Aug 13 — Infra: shared backend = GCP project chirps-prod (us-central1), billing linked, account chirp.shared@gmail.com. Order: Cloud SQL + secrets + migrations first; Cloud Run public deploy only after Firebase exists (ENV guard requires AUTH_MODE=firebase + real CORS).",
    "Aug 13 — Payments: Stripe Connect EXPRESS accounts + DIRECT charges. The chapter is merchant of record, funds land in the chapter's balance, the chapter carries chargeback liability — Chirp never takes custody of the money. Platform fee 1% card / 2% ACH as application_fee_amount (ACH still lands cheaper for the chapter all-in, ~2.8% vs ~3.9%). The member picks the rail BEFORE the intent is created, because application_fee_amount is immutable once a PaymentIntent exists and PaymentSheet would otherwise pick the rail afterwards. Saved cards use a Stripe Customer per (member, chapter): under direct charges the Customer lives on the connected account, so a users.stripe_customer_id column works for the first chapter and silently breaks the second.",
    "Aug 13 — Payments: dropped the ephemeral-key approach in HANDOFF for CustomerSession — Stripe's current mobile docs use it, the installed RN SDK 0.50.3 accepts either, and CustomerSession needs no pinned API version (one less thing to re-check on every SDK upgrade).",
    "Aug 13 — Process: migration numbers are a SHARED resource. Claim the next number on this board BEFORE writing the file. Taken so far: 0006 events (J, on prod), 0007 is_platform_admin (J, in flight), 0008 Stripe dues (Q, pending renumber from 0006 — see c41).",
    "Aug 13 — Process: Q's vertical branch is q/social-msg, cut from the family-tree tip. family-tree retires once PR #2 merges; PR #3 stacks on PR #2.",
    "Aug 13 — Process: NO branch protection on main for now (Jose's call) — CI runs on every push/PR but is advisory, merges stay unblocked. Revisit before TestFlight. Apple Developer enrollment also parked until launch prep.",
    "Aug 14 — Backend: roster display names are MemberOut, NOT a field on MembershipOut. PR #6 (Jose) and the dashboards work (Q) solved the same problem in parallel — no GET /users/{id} exists, so a roster is bare UUIDs — and PR #6's shape won: real INNER JOIN, non-null display_name, plus avatar_url. GET /chapters/{id}/members returns MemberOut; GET /me/memberships returns the plain MembershipOut. Re-adding a nullable display_name to MembershipOut is the regression to watch for. Worth knowing HOW this was nearly missed: git did NOT flag most of the overlap as a text conflict, so two branches solving the same problem can auto-merge into two competing mechanisms with a green build. When both verticals touch the same domain, diff it by hand.",
    "Aug 14 — Process: migration-number rule earned its keep. As 0006 the Stripe migration would have been silently skipped on a prod already stamped past it — Alembic marks it applied and moves on, so processed_stripe_events and the unique index on ledger_entries.stripe_payment_intent_id would simply not exist, with nothing erroring and the webhook-replay guard absent on the money path. Renumbered to 0008, chain verified linear/single-head on main. Next free number: 0009 — claim it here first.",
    "Aug 14 — Process: PR #2 merged before PR #3 deliberately. The branches had diverged and q/social-msg's content was a superset of family-tree's, so merging #3 first would have made #2 read as a Stripe revert. family-tree and q/social-msg are both retired; new work cuts from main.",
    "Aug 14 — Backend: added GET /campuses/{campus_id} (Jose, c46). Trivial route, but it closes a real gap — users.campus_id existed with no way to resolve it to a name, which is WHY Profile and the Yak header hardcoded a mock campus. Any registered caller may read one; campus name/slug are public-facing labels, not org-scoped data. 3 tests. No migration.",
    "Aug 14 — Process: near-miss avoided. Jose's de-mock sweep and Q's c34 both wanted app/(tabs)/feed/index.tsx within the same hour; Q had claimed it on the board first (branch q/feed, migration 0009), so Jose dropped his changes to that ONE file and kept the rest. This is the roster-names collision from earlier today NOT happening, because the claim was on the board. Both devs independently reached the same root cause, which is also a good sign the finding is real.",
    "Aug 14 — Audit finding (13-agent sweep, every claim adversarially verified): the gap between 'backend is live' and 'the app shows real data' is BIGGER than the board implied, and it is not the USE_MOCKS flag. USE_MOCKS is false in every build (no .env or eas.json ever sets it), so those api-layer branches are dead code — the real problem is screens importing MOCK_* constants directly and using them as the signed-in identity. Home feed, Profile, Family Tree, Event detail, org Feed segment and the DM thread are all affected; filed as c34 (sharpened), c46 (Jose) and c47 (Q). Rule going forward: a screen must source identity from useSession()/useOwnChapter(), never from @/mocks/data — cosmetic-only mock imports (theme colors, campus label) are the sole allowed exception and should carry a comment saying so.",
    "Aug 14 — Process: the audit also closed two stale cards (c20 Firebase project, c26 events backend) that had been sitting in Next/backlog while the work was already Done and on prod, and found three more that overstate what is left (c5, c35, c36). Lesson: cards get moved when work lands, not when someone happens to notice; a stale board costs more than no board because it is trusted.",
    "Aug 14 — Infra: prod is CURRENT with main for the first time since sprint 0 — migration 0008 applied by Jose, then rev chirp-api-00007-kff shipped PRs #2, #3 and #7 in ONE redeploy. Ordering rule confirmed and now in INFRA-PRIVATE.html: MIGRATE FIRST, THEN DEPLOY. The Cloud Run deploy does not run migrations, and the post-#3 code selects ledger_entries.stripe_payment_intent_id, which does not exist until 0008 runs — deploying first would have 500'd the treasurer ledger. Also learned: cloud-sql-proxy is NOT bundled with the gcloud SDK and was missing entirely on Jose's Mac; the install command is now a documented prerequisite in the migration runbook.",
    "Aug 14 — Process: c43 SPLIT along the consumer line — whoever consumes an endpoint designs it. Q builds posts-with-counts inside c34 (he is wiring the feed that calls it); Jose builds events-with-rsvp-counts with c44 (events backend is his). This is the lesson from the roster-names overlap applied in advance: one owner per shape, no parallel competing mechanisms.",
    "Aug 14 — Process: 'merged' is not 'working', and the board should say which. Stripe dues is on main with CI green and has never contacted real Stripe, so c11 stays in In Progress until a test-mode payment clears on BOTH card and ACH. Yak, the dashboards and CSV export are likewise only proven against mocks and the test suite — never driven on a device.",
    "Aug 14 — Product: a post's audience is chosen by the author at compose time. posts.audience is 'org' (private to the chapter, per the Aug 12 rule) or 'campus' (visible to everyone at that campus). 'For You' is a RANKING over campus posts, not a stored third value — so the two Home pills read the same campus feed and differ only in ordering. v1 ships both as reverse-chron; ranking is a later card, and until it exists the two pills will look identical. Audience defaults to 'org' server-side when the client omits it: the safe default is private, never accidental campus-wide broadcast.",
    "Aug 14 — Process: migration 0009 CLAIMED by Q for c34 (posts.audience, post_type, duration_sec). Next free number is 0010. Claimed here before the file was written, per the rule c41 taught us.",
    "Aug 14 — Scoping: c34 was carded as 'replace mock calls with live fetch' and was actually a backend gap. The client layer (src/api/feed) was already correct; what was missing was any way for the server to express a campus-visible post. Worth remembering when a card looks like a one-line swap: check that the API can express what the screen renders before estimating it.",
    "Aug 14 — Engineering: with-counts routes use correlated scalar subqueries, never join+COUNT(DISTINCT). Joining posts to both post_likes and post_comments multiplies rows before counting (3 x 4 = 12) and COUNT(DISTINCT) hides it while making the query slower. Pattern: routers/feed.py _post_counts_select.",
    "Aug 15 — Money: dues payment intents are now PERSISTED and RESERVED before Stripe is called (migration 0010, dues_payment_intents + a partial unique index on (dues_cycle_id, user_id) WHERE status IN ('open','succeeded')). The old design only recorded a payment AFTER its webhook settled, so during ACH's multi-day 'processing' window nothing in the DB knew a payment was in flight: the cycle still read as unpaid, and because the Stripe idempotency key was scoped per-rail (dues:{cycle}:{user}:{rail}) a retry on the other rail created a GENUINELY different PaymentIntent. Both would succeed and both would append to an append-only ledger. Reserve-then-call is the fix; the ledger partial unique index is the backstop, and payment_failed/canceled webhooks now RELEASE the reservation so a genuinely failed payment can still be retried.",
    "Aug 15 — Process: agent sessions must not share one working tree. A background agent fixing three review findings had the repo switched under it mid-edit (a concurrent branch checkout for the q/feed merge). It behaved correctly — detected the foreign MERGE_HEAD, reverted its own two edits by hand, made ZERO net changes and reported rather than forcing a checkout that would have yanked the branch out from under an unresolved merge. No damage, but the lesson stands: concurrent work on this repo runs in a git worktree, or strictly sequentially. Cheap rule, and it just cost a round trip to learn.",
    "Aug 15 — Money: reserve-before-charging is now the rule for anything that moves money. A guard that only reads settled state (the ledger) cannot see an in-flight payment, and Stripe idempotency keys only dedup identical parameters — so any key scoped to a user-changeable field (here, the rail) is not a double-charge guard at all. Write the reservation to OUR database before calling the processor, and let a partial unique index arbitrate. Corollary learned from a failing test: the guard must not block same-parameter retries, or ordinary client retries break.",
    "Aug 15 — Product/infra: Chirp gets a PUBLIC WEBSITE and it lives in THIS repo under web/, deployed to Firebase Hosting on chirps-prod. Rationale: it is not a marketing nice-to-have, it is load-bearing — Stripe Connect cannot onboard without an https return URL (the endpoint 503s), the App Store will not accept a submission without a public privacy-policy URL, invite deep links need an https bounce page to survive being tapped in a text message, and the sign-in screen already promises Terms + Privacy documents that do not exist. Same repo so the privacy policy stays honest about what the app actually collects; static HTML, never the Expo bundle, so it loads fast and works with no auth.",
    "Aug 15 — Process: the #9 -> #11 -> #10 merge queue EXECUTED CORRECTLY and is closed (6334957, 9673ff6, 1aa19ba; CI green on all three). Q ran it, including the conflict Jose's PR #11 hit once #9's newer tip landed. The resolution is worth recording because it is the one that usually goes wrong: both sides were KEPT rather than one side taken. feed/index.tsx has Q's getCampus() eyebrow with the hardcoded mascot deleted; chapter/index.tsx has Jose's listMembers()/findMember() roster resolution with mockUserById gone. Taking either side wholesale would have silently reintroduced a bug the other side had just fixed, with a green build. Same trap as the roster-names overlap, avoided this time.",
    "Aug 15 — Infra: the public website ships on the FREE Firebase Hosting domain, https://chirps-prod.web.app, and that is what APP_PUBLIC_BASE_URL will be set to. Stripe accepts it, it costs nothing, and it unblocks Connect onboarding the day the site deploys — waiting on a domain purchase would have blocked the entire dues chain behind a shopping decision. A custom domain is deferred to its own card and only becomes load-bearing when iOS universal links do; app-mobile/app.json's applinks:chirp.example.com is a placeholder and is wrong under either choice.",
    "Aug 15 — Correction: the de-mock sweep was reported COMPLETE and was not, and c55 specifically claimed 'the last mockUserById call site in the app is gone' when it was gone from one file only. Three screens still render fake identity against live data (filed as c59). Q caught the alumni one while merging. The failure mode is worth naming: a claim about the WHOLE repo was made from the scope of a single PR's diff. When closing a card that asserts something repo-wide, re-grep the repo, not the branch.",
    "Aug 15 — Testing: a green test you have not tried to break proves nothing. c21's happy-path fan-out test was falsified first (published to a deliberately wrong channel, confirmed it failed) before the PASS was believed. Worth repeating for any test asserting that something ARRIVES — those pass vacuously when the transport is silently broken.",
    "Aug 15 — Infra: Redis/Memorystore was never provisioned in chirps-prod, confirmed three ways with gcloud (API never enabled, no VPC connector, no REDIS_URL on the running revision). Recorded because of HOW it stayed hidden: the backend test suite is fully green on the websocket path and runs against a real local Redis, so the suite actively asserts that fan-out works while production has no Redis to fan out through. A green suite proves the code, never the environment — infra existence needs its own check, and 'DEPLOY.md says this can come second' is not evidence that it was ever done. c30's inventory of live infra was accurate and complete; nobody re-read it when the WS work landed.",
    "Aug 15 — Web: the public site is a Vite + React + TypeScript SPA, reversing the same-day 'plain static HTML, no build step' decision. Jose's call. What it buys: the header/nav/footer exist once in components/Layout.tsx instead of being hand-copied into nine files that drift apart, and per-route titles come from usePageMeta() rather than nine hand-maintained <title> tags. What it costs, recorded so nobody rediscovers it: pages now need JS to render (fine for a browser and an App Store reviewer, thin for a non-executing crawler), and the bundle is ~218 KB / 66 KB gzipped against effectively zero before — a real first-paint regression on the three bounce pages, which are exactly the ones a user hits mid-flow on a phone. The deployed artifact is still static, so Firebase Hosting is unchanged; server rendering would mean leaving it, since Hosting only serves static files. The two Stripe callback routes still answer a single 200 with no redirect hop, which is the one thing that could not be allowed to regress.",
    "Aug 15 — Infra: prod migrated 0008 -> 0010 and redeployed as chirp-api-00009-pqf, so prod is current with main again. Two things worth keeping from how it was done. First, the pre-flight mattered in principle even though it came back clean: 0010 builds a UNIQUE index on the already-populated ledger_entries, so a single duplicate dues_payment row would have aborted the migration mid-flight, and that is a query you run BEFORE not after. Second, the verification was a route probe, not the deploy log — GET /campuses/{id}/feed going 404 -> 401 is the only check that actually distinguishes 'new code is live' from 'the deploy reported success'. The double-charge guard was then demonstrated against the real prod schema inside a rolled-back transaction, which is how you prove a constraint exists in production without writing to production.",
    "Aug 15 — Process: I reviewed my own PR #13 at high effort and it returned 15 findings, two of which were real bugs inside the c62 gateway fix I had shipped hours earlier and called done — teardown placed on the wrong side of a re-raise, and nothing observing the forwarder task dying. Both were invisible to the three tests written alongside that fix, because those tests only exercised failure at connect time, which is the case the author was already thinking about. The lesson is not 'review more', it is that tests written by whoever wrote the fix encode the same blind spot as the fix. Also caught before shipping: three contact addresses and one legal sentence rendered glued to the preceding word on the live site, because JSX drops a trailing space when a text run ends a line before an inline element — a class of bug no typecheck or unit test catches, only building the bundle and reading the rendered output.",
    "Aug 15 — Legal: Chirp ships its own privacy policy and terms, written in-house and scoped to North Carolina and UNCG only, rather than waiting on a lawyer. Jose's call, and the right one for a single-campus launch — but the reasoning is worth recording. The policy is written against the actual schema, so every claim is checkable against a model file, which makes it MORE accurate than a template would have been. Three statements are deliberately unflattering and stay that way: anonymous board posts are anonymous to other students but not to us, reporting a DM forwards that message's text to us, and deleted content is currently hidden rather than erased because no purge job exists (filed as c69). On terms: NO arbitration clause and NO class-action waiver, deliberately — those are the clauses that most need real drafting, are most often struck when drafted badly, and buy a single-campus app nothing. Liability is capped at fees actually paid to Chirp, which for nearly every user is zero. Governing law is NC, venue Guilford County, matching the only campus we have. No legal entity is named because Chirp is not incorporated. Revisit all of it before the first campus outside NC, which is the point where fifty-state hedging starts to matter.",
    "Aug 15 — Product: the marketing and legal site moves off the apex domain to a subdomain (about.<domain>), with the apex reserved for sign-in / the app, following Instagram's shape. Jose's call. Recorded now even though it is blocked on buying a domain, because it invalidates an assumption three places already encode: APP_PUBLIC_BASE_URL on Cloud Run, WEB_BASE_URL in the mobile invite helper, and app.json's universal-link config. The c40 lesson applies again — whichever host serves /stripe/connect/return and /stripe/connect/refresh IS what APP_PUBLIC_BASE_URL must equal, because payments.py builds those URLs by string concatenation.",
    "Aug 15 — Process: CARD IDS ARE A SHARED RESOURCE, exactly like migration numbers (c41). Jose and Q both minted c70 and c71 within minutes of each other for completely different work — Q for the media pipeline and the campus-only-user posting gap, Jose for mobile responsiveness and the subdomain move. Caught only because git rejected the push as non-fast-forward; had both been committed from the same base, the board would have silently ended up with two different c70s, which is precisely the duplicate-c50 mess already cleaned up once. Jose renumbered to c72/c73. Same rule as migrations: take the next id from the board's CURRENT state on origin, not from the copy you started editing ten minutes ago.",
    "Aug 15 — Product/scope (c49): the compose flow ships TEXT ONLY, and Photo/Video ship as visibly disabled 'Soon' rows. Worth recording because the tempting move was to add expo-image-picker and call it done. Two reasons not to. First, a picker produces a local file URI, and there is nothing in this repo that can turn that into a URL: no storage bucket wired, no presign, no upload endpoint. Every media_urls value in the app today is a picsum placeholder, which is precisely why the media path looked finished. Second, expo-image-picker is a native module, so it owes an EAS dev build of its own on top of the one c39 already owes — media would have been untestable on arrival. Disabled rows that say so beat a picker that silently drops the photo. Pipeline is c70. Related and more important: the only create-post route requires an active chapter membership, so a student in no org cannot post at all, which directly contradicts the Aug 11 'Chirp is for ALL students' premise. c49 hides the FAB for those users rather than opening a composer that dead-ends, but that is containment; the product decision is c71 and it needs both devs before TestFlight.",
    "Aug 15 — Process: the migration-number rule caught a REAL collision in real time, not in hindsight. Q read the board, saw 0010 as head, and started writing 0011 for c71; Jose pushed claims for 0011 (c76) and 0012 (c69) about a minute earlier, and the only reason the two did not both ship an 0011 is that git rejected the non-fast-forward push and the rebase forced a re-read of the board. Q moved to 0013. Note what did NOT save us: reading the board at the start of the task. The board was accurate when read and stale by the time the file was written, which is the same shape as the c41 failure. The rule that actually works is re-checking the CURRENT state on origin immediately before writing the file, and treating a rejected push as a signal to re-read rather than an obstacle to retry past.",
    "Aug 15 — Product (c71): a student who belongs to no chapter CAN post, to their campus. The user's call, and it resolves a contradiction that had been sitting in the schema since the start: the Aug 11 premise is that Chirp is for all students with orgs as an optional thing you join, while posts.chapter_id was NOT NULL and the only create route sat behind a membership check. Shape: posts.campus_id NOT NULL and backfilled, chapter_id relaxed to nullable, and CHECK (audience = 'campus' OR chapter_id IS NOT NULL) so an org post with no org is impossible in the database rather than merely discouraged. Campus was NOT derived from the author on purpose - a transferring student would drag their old posts onto their new campus feed; the post belongs where it was made. The new route hard-codes audience and its request schema has no audience field, so 'org without a membership' is unreachable by construction instead of by validation. Two pre-existing bugs surfaced on the way and had to be fixed to ship coherently: likes and comments were authorized through the post's chapter, which 403'd every cross-chapter campus post the feed was already showing people, and moderation resolved a report's campus by hopping post -> chapter, which would have filed chapter-less reports on the reporter's campus queue. Both were invisible while every post had a chapter.",
    "Aug 16 — Moderation: block must actually hide content or the button is theater. Adding a Block control to a surface whose feed query does not filter blocked authors ships an App Store 1.2 checkbox that does nothing. Check the read path filters before adding the write control; yaks.py's anti-join is the pattern."
  ]
}

<script>
(function () {
  var DATA = document.getElementById('board-data');
  var LS_KEY = 'chirp-board-draft';
  var committed = JSON.parse(DATA.textContent);
  var state = committed;
  try {
    var draft = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (draft && draft.updated > committed.updated) { state = draft; setStatus('local draft — export & commit to share', true); }
  } catch (e) {}

  var boardEl = document.getElementById('board');
  var areasEl = document.getElementById('areas');
  var view = 'status';

  function setStatus(text, dirty) {
    var s = document.getElementById('status');
    s.textContent = text; s.className = dirty ? 'dirty' : '';
  }
  function persist() {
    state.updated = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    setStatus('unsaved changes — export & commit to share', true);
    render();
    if (view === 'area') renderAreas();
  }
  function cardById(id) { return state.cards.filter(function (c) { return c.id === id; })[0]; }

  /**
   * Copy `text`, then flash the result on the button itself.
   * navigator.clipboard needs a secure context and this board is normally opened
   * straight off disk (file://), where it's commonly unavailable or rejects — so
   * fall back to a throwaway textarea + execCommand rather than silently no-op.
   */
  function copyText(text, btn) {
    var label = btn.dataset.label;
    function flash(ok) {
      btn.textContent = ok ? 'copied' : 'copy failed';
      btn.className = 'copy ' + (ok ? 'ok' : 'fail');
      setTimeout(function () { btn.textContent = label; btn.className = 'copy'; }, 1200);
    }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      flash(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, legacy);
    } else {
      legacy();
    }
  }

  function render() {
    // The alpha bar reads the same cards the columns do, so it repaints with
    // them rather than on its own schedule — otherwise dragging a gate card
    // leaves a stale percentage sitting above the board that looks authoritative.
    renderAlpha();
    boardEl.innerHTML = '';
    state.columns.forEach(function (col) {
      var colEl = document.createElement('div');
      colEl.className = 'col'; colEl.dataset.col = col.id;
      var cards = state.cards.filter(function (c) { return c.col === col.id; });
      var h = document.createElement('h2');
      h.innerHTML = col.title + ' <span class="count">' + cards.length + '</span>';
      colEl.appendChild(h);
      cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'card'; el.draggable = true; el.dataset.id = c.id;
        // Card id, rendered as its own line above the title. It exists in the data
        // and is how everyone refers to cards in commits, PRs and conversation
        // ("c36", "c61") — but it was never on screen, so a card's name was
        // unreadable from the board itself.
        var idLine = document.createElement('div');
        idLine.className = 'card-id';
        idLine.textContent = c.id;
        var t = document.createElement('div'); t.className = 'title'; t.textContent = c.title;
        var meta = document.createElement('div'); meta.className = 'meta';
        var owner = document.createElement('button');
        owner.className = 'chip owner-' + (c.owner || 'none');
        owner.textContent = c.owner ? '@' + c.owner : 'unclaimed';
        owner.onclick = function () { c.owner = c.owner === '' ? 'J' : c.owner === 'J' ? 'Q' : ''; persist(); };
        meta.appendChild(owner);
        if (c.tag) { var tag = document.createElement('span'); tag.className = 'chip tag'; tag.textContent = c.tag; meta.appendChild(tag); }
        var copy = document.createElement('button');
        copy.className = 'copy'; copy.textContent = 'copy'; copy.dataset.label = 'copy';
        copy.title = 'Copy this card’s text';
        copy.onclick = function (ev) { ev.stopPropagation(); copyText(c.title, copy); };
        meta.appendChild(copy);
        var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
        del.onclick = function () { if (confirm('Delete card?')) { state.cards = state.cards.filter(function (x) { return x.id !== c.id; }); persist(); } };
        meta.appendChild(del);
        t.ondblclick = function () { var v = prompt('Edit card', c.title); if (v) { c.title = v; persist(); } };
        el.appendChild(idLine); el.appendChild(t); el.appendChild(meta);
        el.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
        el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
        colEl.appendChild(el);
      });
      var adder = document.createElement('input');
      adder.className = 'adder'; adder.placeholder = '+ add card';
      adder.onkeydown = function (ev) {
        if (ev.key === 'Enter' && adder.value.trim()) {
          state.cards.push({ id: 'c' + Date.now(), col: col.id, title: adder.value.trim(), owner: '', tag: '' });
          persist();
        }
      };
      colEl.appendChild(adder);
      colEl.addEventListener('dragover', function (ev) { ev.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', function () { colEl.classList.remove('drag-over'); });
      colEl.addEventListener('drop', function (ev) {
        ev.preventDefault(); colEl.classList.remove('drag-over');
        var id = ev.dataTransfer.getData('text/plain');
        var c = cardById(id); if (c && c.col !== col.id) { c.col = col.id; persist(); }
      });
      boardEl.appendChild(colEl);
    });
    var dl = document.getElementById('decision-list');
    dl.innerHTML = '';
    state.decisions.forEach(function (d) { var li = document.createElement('li'); li.textContent = d; dl.appendChild(li); });
  }

  document.getElementById('decision-add').onkeydown = function (ev) {
    var inp = ev.target;
    if (ev.key === 'Enter' && inp.value.trim()) { state.decisions.push(inp.value.trim()); inp.value = ''; persist(); }
  };
  document.getElementById('reset').onclick = function () {
    if (confirm('Discard local draft and reload the committed board?')) {
      localStorage.removeItem(LS_KEY); state = committed; setStatus('committed state', false); render();
    }
  };
  document.getElementById('export').onclick = function () {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#board').innerHTML = '';
    clone.querySelector('#decision-list').innerHTML = '';
    clone.querySelector('#status').textContent = 'committed state';
    clone.querySelector('#status').className = '';
    clone.querySelector('#board-data').textContent = '\n' + JSON.stringify(state, null, 2) + '\n';
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'board.html'; a.click();
    URL.revokeObjectURL(a.href);
    setStatus('exported — replace board.html in the repo and commit', false);
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  };


  /* ---------------------------------------------------------------
     Feature-area view.

     Same cards, grouped by which part of the app they build rather than
     by status, so you can see a surface's progress instead of a column's
     depth. The bar is stacked done / in-progress / next because "8 of 11
     done" hides whether the rest is moving or untouched.
     --------------------------------------------------------------- */
  /**
   * Alpha readiness.
   *
   * The denominator is a NAMED LIST, not a card count: "% of the board done" is
   * a meaningless number because the board carries plenty of work alpha does not
   * need, and is missing plenty of foundation work that was never carded. So the
   * gates are declared in state.alpha and every card-backed one reads its status
   * from the card itself — move a card, the bar moves. Nothing here is typed in.
   *
   * A gate whose card id no longer exists renders as unknown rather than being
   * silently dropped, because a vanished gate should be loud.
   */
  function renderAlpha() {
    var host = document.getElementById('alpha');
    var a = state.alpha;
    if (!host || !a) { if (host) host.hidden = true; return; }
    host.hidden = false;
    host.textContent = '';

    var shipped = (a.shipped || []).length;
    var gates = (a.gates || []).map(function (g) {
      var card = cardById(g.id);
      return { id: g.id, label: g.label, col: card ? card.col : 'unknown' };
    });
    var n = { done: shipped, progress: 0, open: 0 };
    gates.forEach(function (g) {
      if (g.col === 'done') n.done += 1;
      else if (g.col === 'progress') n.progress += 1;
      else n.open += 1;
    });
    var total = shipped + gates.length;
    var pct = total ? Math.round((100 * n.done) / total) : 0;

    var head = document.createElement('div');
    head.className = 'alpha__h';
    var h2 = document.createElement('h2');
    h2.textContent = 'Alpha readiness';
    var pctEl = document.createElement('span');
    pctEl.className = 'alpha__pct';
    pctEl.textContent = pct + '%';
    head.appendChild(h2); head.appendChild(pctEl);
    host.appendChild(head);

    var sub = document.createElement('p');
    sub.className = 'alpha__sub';
    sub.textContent = a.goal;
    host.appendChild(sub);

    var bar = document.createElement('div');
    bar.className = 'bar';
    [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.open]].forEach(function (pair) {
      if (!pair[1]) return;
      var i = document.createElement('i');
      i.className = pair[0];
      i.style.width = (100 * pair[1]) / total + '%';
      bar.appendChild(i);
    });
    host.appendChild(bar);

    var key = document.createElement('div');
    key.className = 'alpha__key';
    [['var(--success)', n.done + ' done'],
     ['var(--accent)', n.progress + ' in flight'],
     ['var(--warn)', n.open + ' not started']].forEach(function (pair) {
      var span = document.createElement('span');
      var sw = document.createElement('i');
      sw.style.background = pair[0];
      span.appendChild(sw);
      span.appendChild(document.createTextNode(pair[1]));
      key.appendChild(span);
    });
    var foot = document.createElement('span');
    foot.textContent = shipped + ' shipped foundations counted, ' + gates.length + ' gates remaining to check';
    key.appendChild(foot);
    host.appendChild(key);

    var grid = document.createElement('div');
    grid.className = 'alpha__gates';
    (a.shipped || []).forEach(function (label) {
      var row = document.createElement('div');
      row.className = 'alpha__gate is-shipped';
      var st = document.createElement('span');
      st.className = 'st st-done';
      st.textContent = 'shipped';
      var t = document.createElement('span');
      t.textContent = label;
      row.appendChild(st); row.appendChild(t);
      grid.appendChild(row);
    });
    gates.forEach(function (g) {
      var row = document.createElement('div');
      row.className = 'alpha__gate';
      var st = document.createElement('span');
      st.className = 'st st-' + (g.col === 'unknown' ? 'backlog' : g.col);
      st.textContent = g.col === 'unknown' ? g.id + '?' : g.id;
      var t = document.createElement('span');
      t.textContent = g.label;
      row.appendChild(st); row.appendChild(t);
      grid.appendChild(row);
    });
    host.appendChild(grid);
  }

  var COL_ORDER = { done: 0, progress: 1, next: 2, backlog: 3 };

  function colTitle(id) {
    var c = state.columns.filter(function (x) { return x.id === id; })[0];
    return c ? c.title : id;
  }

  function firstSentence(title) {
    // Card titles carry their whole history; the area view wants the claim,
    // not the changelog. Cut at the first sentence break that is not an
    // abbreviation-sized fragment.
    var t = title.replace(/\s+/g, ' ').trim();
    var cut = t.search(/[.:—]\s/);
    if (cut > 24) t = t.slice(0, cut);
    return t.length > 96 ? t.slice(0, 95).replace(/\s+\S*$/, '') + '…' : t;
  }

  function renderAreas() {
    areasEl.innerHTML = '';
    var groups = [];
    (state.areas || []).forEach(function (a) {
      if (!groups.some(function (g) { return g.name === a.group; })) groups.push({ name: a.group, areas: [] });
      groups.filter(function (g) { return g.name === a.group; })[0].areas.push(a);
    });

    groups.forEach(function (g) {
      var gEl = document.createElement('section');
      gEl.className = 'area-group';
      var gh = document.createElement('h2');
      gh.textContent = g.name;
      gEl.appendChild(gh);

      var grid = document.createElement('div');
      grid.className = 'area-grid';

      g.areas.forEach(function (a) {
        var cards = state.cards.filter(function (c) { return c.area === a.id; });
        cards.sort(function (x, y) {
          var d = (COL_ORDER[x.col] || 9) - (COL_ORDER[y.col] || 9);
          return d !== 0 ? d : parseInt(x.id.slice(1), 10) - parseInt(y.id.slice(1), 10);
        });

        var n = { done: 0, progress: 0, next: 0, backlog: 0 };
        cards.forEach(function (c) { n[c.col] = (n[c.col] || 0) + 1; });
        var total = cards.length || 1;

        var el = document.createElement('div');
        el.className = 'area' + (cards.length ? '' : ' is-empty');

        var head = document.createElement('div');
        head.className = 'area__h';
        var h3 = document.createElement('h3');
        h3.textContent = a.label;
        var count = document.createElement('span');
        count.className = 'area__n';
        count.textContent = n.done + '/' + cards.length + ' done';
        head.appendChild(h3); head.appendChild(count);
        el.appendChild(head);

        var bar = document.createElement('div');
        bar.className = 'bar';
        [['b-done', n.done], ['b-prog', n.progress], ['b-next', n.next]].forEach(function (pair) {
          if (!pair[1]) return;
          var i = document.createElement('i');
          i.className = pair[0];
          i.style.width = (pair[1] / total * 100) + '%';
          bar.appendChild(i);
        });
        el.appendChild(bar);

        var ul = document.createElement('ul');
        cards.forEach(function (c) {
          var li = document.createElement('li');
          var st = document.createElement('span');
          st.className = 'st st-' + c.col;
          st.textContent = colTitle(c.col);
          var body = document.createElement('span');
          body.className = 't';
          var cid = document.createElement('b');
          cid.className = 'cid';
          cid.textContent = c.id + ' ';
          body.appendChild(cid);
          body.appendChild(document.createTextNode(firstSentence(c.title)));
          body.title = c.title;
          li.appendChild(st); li.appendChild(body);
          ul.appendChild(li);
        });
        el.appendChild(ul);
        grid.appendChild(el);
      });

      gEl.appendChild(grid);
      areasEl.appendChild(gEl);
    });
  }

  function setView(next) {
    view = next;
    boardEl.hidden = next !== 'status';
    areasEl.hidden = next !== 'area';
    Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
      b.className = b.dataset.view === next ? 'on' : '';
    });
    if (next === 'area') renderAreas();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#view-toggle button'), function (b) {
    b.onclick = function () { setView(b.dataset.view); };
  });

  render();
})();
</script>
</body>
</html>
