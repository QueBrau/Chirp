<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chirp Board</title>
<style>
  :root {
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-alt:#EFF1F7; --ground:#F6F7FB;
    --ink:#101223; --ink-2:#575B75; --ink-3:#9BA0B8;
    --line:rgba(16,18,35,.08); --border:rgba(16,18,35,.08);
    --accent:#5B5BF6; --accent-soft:#ECECFE; --success:#17A673; --success-soft:#E3F6EE;
    --danger:#E5484D; --danger-soft:#FDECEC; --warn:#F5A623; --warn-soft:#FDF3E1; --warn-ink:#B87503;
    --grad:linear-gradient(135deg,#6366F1,#8B5CF6);
    --shadow:0 1px 3px rgba(16,18,35,.05);
    --shadow-lift:0 6px 18px rgba(16,18,35,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C0D14; --surface:#15161F; --surface-alt:#1D1E2A; --ground:#0C0D14;
      --ink:#F2F3FA; --ink-2:#A6AAC4; --ink-3:#666B85;
      --line:rgba(242,243,250,.09); --border:rgba(242,243,250,.09);
      --accent:#7C7CFF; --accent-soft:rgba(124,124,255,.16); --success:#2BD597;
      --success-soft:rgba(43,213,151,.16); --danger:#FF6369; --danger-soft:rgba(255,99,105,.16);
      --warn:#FFB84D; --warn-soft:rgba(255,184,77,.16); --warn-ink:#FFB84D;
      --shadow:none; --shadow-lift:0 6px 18px rgba(0,0,0,.5);
    }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  /* App shell: the page never scrolls. Whatever view is active fills the leftover
     height and scrolls INSIDE itself — that is the whole fix for the wall of
     scroll this board used to be. */
  body { display:flex; flex-direction:column; gap:10px; overflow:hidden;
    background:var(--bg); color:var(--ink); padding:14px 16px 10px;
    font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:17px; font-weight:800; letter-spacing:-.3px; white-space:nowrap; }
  h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #status { font-size:12px; font-weight:500; color:var(--ink-3); flex:1; min-width:150px; text-align:right; }
  #status.dirty { color:var(--warn); }
  /* Only ever visible when a card cannot be drawn — see renderIntegrity(). Loud on
     purpose: the failure it reports is a card that looks filed and is not there. */
  #integrity { background:var(--danger-soft); color:var(--danger); border-radius:12px;
    padding:12px 16px; font-size:13px; font-weight:600; line-height:1.5; }
  button { font:inherit; border:0; cursor:pointer; border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface-alt); color:var(--ink-2); }
  [hidden] { display:none !important; }
  .view-toggle { display:inline-flex; background:var(--surface-alt); border-radius:999px; padding:3px; gap:2px; }
  .view-toggle button { background:none; color:var(--ink-2); padding:5px 12px; }
  .view-toggle button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  /* Status pills, shared by the drawer, area view and alpha gates. */
  .st { font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    border-radius:999px; padding:2px 7px; white-space:nowrap; }
  .st-done { background:var(--success-soft); color:var(--success); }
  .st-progress { background:var(--accent-soft); color:var(--accent); }
  .st-next { background:var(--warn-soft); color:var(--warn-ink); }
  .st-backlog { background:var(--surface-alt); color:var(--ink-3); }

  /* Alpha readiness — a strip, not a billboard. Recomputed from the cards on
     every render, never typed in by hand; the gate list expands on demand. */
  #alpha { border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:8px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); }
  .alpha__row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .alpha__row h2 { font-size:12px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
  .alpha__pct { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
  .alpha__row .bar { flex:1; min-width:120px; margin:0; height:6px; }
  .alpha__key { display:flex; gap:12px; font-size:11px; color:var(--ink-3); white-space:nowrap; }
  .alpha__key i { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .alpha__toggle { background:var(--surface-alt); color:var(--ink-2); padding:4px 11px; font-size:11px; }
  .alpha__toggle:hover { color:var(--accent); background:var(--accent-soft); }
  .alpha__sub { font-size:12px; color:var(--ink-3); }
  .alpha__gates { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:2px 14px; max-height:38vh; overflow-y:auto; }
  .alpha__gate { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:12px; padding:2px 0; }
  .alpha__gate.is-shipped { color:var(--ink-3); }

  /* Columns: each one owns its scroll. */
  #board { flex:1; min-height:0; display:flex; gap:10px; }
  #board .col { flex:1 1 0; min-width:0; }
  .col { display:flex; flex-direction:column; min-height:0; background:var(--surface-alt); border-radius:14px; padding:8px 8px 10px; }
  .col.drag-over { outline:2px dashed var(--accent); outline-offset:-3px; }
  .col h2 { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-2); padding:2px 6px 8px; display:flex; justify-content:space-between; }
  .col h2 .count { color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .stack { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:1px 2px 1px 1px; }
  .stack::-webkit-scrollbar { width:8px; }
  .stack::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
    padding:7px 9px 8px; cursor:pointer; flex:none;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lift); border-color:rgba(91,91,246,.35); }
  .card:active { transform:none; }
  .card.dragging { opacity:.4; }
  .card .meta { display:flex; gap:6px; align-items:center; min-height:18px; }
  /* Card id — monospace and muted so it reads as a label, not a heading.
     Selectable so an id can be copied straight out of the board. */
  .card .card-id { font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.5px;
    text-transform:uppercase; color:var(--accent); user-select:text; }
  /* The card is a headline; the full title and notes live in the drawer. Two
     clamped lines keeps ninety-odd cards readable as a wall of headlines. */
  .card .title { margin-top:3px; font-weight:600; font-size:12.5px; line-height:1.4; letter-spacing:-.005em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chip { font-size:10px; font-weight:600; letter-spacing:.3px; border-radius:999px; padding:2px 8px;
    background:var(--surface-alt); color:var(--ink-2); border:0; cursor:pointer; }
  .chip.owner-J { background:var(--accent-soft); color:var(--accent); }
  .chip.owner-Q { background:var(--success-soft); color:var(--success); }
  .chip.tag { cursor:default; }
  /* Row controls earn their pixels only when the pointer is on the card. */
  .card .copy, .card .del { opacity:0; transition:opacity .1s ease; }
  .card:hover .copy, .card:hover .del,
  .card .copy:focus-visible, .card .del:focus-visible { opacity:1; }
  .card .copy { margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:10px; font-weight:600;
    letter-spacing:.3px; border-radius:999px; padding:2px 7px; cursor:pointer; }
  .card .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .card .copy.ok { color:var(--success); background:var(--success-soft); opacity:1; }
  .card .copy.fail { color:var(--danger); background:var(--danger-soft); opacity:1; }
  .card .del { background:none; border:0; color:var(--ink-3); font-size:12px; padding:1px 5px; cursor:pointer; }
  .card .del:hover { color:var(--danger); }
  /* A left rail keyed to the column, so a card's status survives being read out
     of context — in the area view especially, where columns do not exist. */
  .col[data-col="done"] .card { border-left:3px solid var(--success); padding:5px 8px 6px; }
  .col[data-col="done"] .card .title { -webkit-line-clamp:1; }
  .col[data-col="progress"] .card { border-left:3px solid var(--accent); }
  .col[data-col="next"] .card { border-left:3px solid var(--warn); }
  .col[data-col="backlog"] .card { border-left:3px solid var(--warn); }
  .adder { margin-top:8px; flex:none; width:100%; background:transparent; border:1px dashed var(--line);
    border-radius:9px; padding:6px 10px; font:inherit; font-size:12px; color:var(--ink); outline:none; }
  .adder::placeholder { color:var(--ink-3); }
  .adder:focus { border-color:var(--accent); background:var(--surface); }
  @media (max-width:900px) {
    #board { overflow-x:auto; scroll-snap-type:x mandatory; }
    #board .col { flex:0 0 min(82vw,340px); scroll-snap-align:start; }
  }

  /* Feature-area view: the same cards grouped by what part of the app they
     build, so progress reads per surface instead of per status column. */
  #areas { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:22px; padding-bottom:6px; }
  .area-group > h2 { font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:8px; }
  .area-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; align-items:start; }
  .area { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:12px 13px; }
  .area.is-empty { opacity:.55; }
  .area__h { display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .area__h h3 { font-size:13.5px; font-weight:700; }
  .area__n { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:7px 0 10px; display:flex; }
  .bar i { display:block; height:100%; }
  .bar .b-done { background:var(--success); }
  .bar .b-prog { background:var(--accent); }
  .bar .b-next { background:var(--warn); }
  .area ul { list-style:none; display:flex; flex-direction:column; gap:5px; padding:0; }
  .area li { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline; font-size:12px; }
  .area li b { font-weight:600; color:var(--ink); }
  .area li span.t { color:var(--ink-2); }
  .area li .cid { font-size:10.5px; color:var(--ink-3); font-weight:600; }

  /* Decisions log — its own tab, newest first, scrolls inside the shell. */
  #decisions { flex:1; min-height:0; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); padding:14px 18px; }
  #decisions h2 { font-size:14px; font-weight:800; margin-bottom:8px; display:flex; gap:8px; align-items:baseline; }
  #decisions h2 .count { font-size:11.5px; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums; }
  #decisions input.adder { margin:0 0 10px; }
  #decisions ul { list-style:none; padding:0; }
  #decisions li { margin:0; padding:7px 2px; border-top:1px solid var(--line); color:var(--ink-2);
    font-size:12.5px; line-height:1.5; }
  #decisions li:first-child { border-top:0; }
  footer { flex:none; font-size:11px; color:var(--ink-3); }

  /* Card detail drawer — the card is a headline; everything else lives here. */
  #drawer-scrim { position:fixed; inset:0; z-index:90; background:rgba(16,18,35,.38); backdrop-filter:blur(2px); }
  #drawer { position:fixed; top:0; right:0; bottom:0; z-index:91; width:min(660px,94vw);
    background:var(--surface); border-left:1px solid var(--line); box-shadow:-18px 0 50px rgba(16,18,35,.18);
    display:flex; flex-direction:column; gap:12px; padding:20px 22px 18px;
    transform:translateX(12px); opacity:0; transition:transform .18s ease, opacity .18s ease; }
  #drawer.open { transform:translateX(0); opacity:1; }
  .drawer__head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .drawer__id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:800; color:var(--accent); }
  .drawer__close { margin-left:auto; border:1px solid var(--line); background:var(--surface-alt);
    color:var(--ink-2); border-radius:999px; padding:6px 14px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
  .drawer__close:hover { color:var(--ink); }
  .drawer__title, .drawer__detail { width:100%; box-sizing:border-box; border:1px solid var(--line);
    border-radius:12px; background:var(--ground); color:var(--ink); font:inherit; padding:12px 14px; resize:vertical; }
  .drawer__title { font-size:16px; font-weight:700; line-height:1.35; }
  .drawer__detail { flex:1; min-height:220px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
  .drawer__title:focus, .drawer__detail:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .drawer__foot { display:flex; align-items:center; gap:12px; }
  .drawer__foot .copy { background:var(--surface-alt); border:0; color:var(--ink-2); font-size:12px;
    font-weight:600; border-radius:999px; padding:6px 13px; cursor:pointer; }
  .drawer__foot .copy:hover { color:var(--accent); background:var(--accent-soft); }
  .drawer__foot .copy.ok { color:var(--success); background:var(--success-soft); }
  .drawer__hint { font-size:12px; color:var(--ink-3); }
  @media (max-width:560px) { #drawer { width:100vw; padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>Chirp <span>Board</span></h1>
  <div class="view-toggle" id="view-toggle">
    <button data-view="status" class="on">Status</button>
    <button data-view="area">Feature area</button>
    <button data-view="log">Decisions</button>
  </div>
  <div id="status">committed state</div>
  <button class="btn-ghost" id="reset">Reset to committed</button>
  <button class="btn-primary" id="export">Export board.html</button>
</header>
<div id="integrity" role="alert" hidden></div>
<section id="alpha"></section>
<div id="drawer-scrim" hidden></div>
<aside id="drawer" hidden aria-label="Card details"></aside>
<main id="board"></main>
<main id="areas" hidden></main>
<section id="decisions" hidden>
  <h2>Decisions log <span class="count" id="decision-count"></span></h2>
  <input class="adder" id="decision-add" placeholder="+ record a decision (date — what we decided)">
  <ul id="decision-list"></ul>
</section>
<footer>
  Drag cards between columns · click a card for its full title and notes · click the owner chip to cycle – / J / Q ·
  changes autosave locally, then <b>Export board.html</b> and commit the downloaded file over this one so the other dev gets it.
</footer>

      "detail": "SCOPE CHOSEN BY BRAUL after the four levels and their risks were put to him explicitly: copy only / +client code / +routes / +DB. He took the deepest one.\n\nAMBIGUITY FLAGGED AND ACCEPTED: the app itself is called Chirp and already has a `posts` concept, so 'a chirp' can now mean either the anonymous board item or any post. It lands hardest in moderation, where target_type becomes 'chirp' sitting beside 'post' and 'comment'. Recorded so nobody re-opens it as a discovery.\n\nWHAT MOVES:\n  - TABLES: yaks -> chirps, yak_votes -> chirp_votes (migration 0022, reversible).\n  - DATA: content_reports.target_type value 'yak' -> 'chirp', with the CHECK constraint dropped and recreated around it. EXISTING PROD ROWS need the backfill, so this is a data migration and not only a rename.\n  - THE CONSTRAINT NAME IS NOT WHAT THE MODEL SAYS. Verified against a live catalog, not assumed: the real name is `content_reports_target_type_check` (Postgres's auto-generated name for an unnamed inline column CHECK), while models/yak.py declares `ck_content_reports_target_type`. That ORM-side name was never realized in any database. 0019 hit exactly this on posts.audience and wrote it down; this migration drops by the REAL name and recreates under the declared one, closing the drift.\n  - ROUTES: /campuses/{id}/yaks -> /chirps, /yaks/{id}/vote -> /chirps/{id}/vote, /moderation/yaks/{id}/remove -> /moderation/chirps/{id}/remove, /moderation/blocks/by-yak/{id} -> by-chirp.\n  - CODE: models Yak/YakVote -> Chirp/ChirpVote, schemas/yak.py -> chirp.py, routers/yaks.py -> chirps.py, purge job, client src/api/yaks.ts -> chirps.ts, the app/(tabs)/yak/ route folder -> chirps/ (which also moves c175's Touse screen), tab label.\n  - DOCS: SPEC.md, DESIGN.md, SECURITY-REVIEW.md, web marketing site.\n\nDEPLOY SEQUENCE, and it is NOT the usual one. The routes and the tables move together, so prod must be migrated AND redeployed in the same window: migrate first (the new code cannot read `yaks`), then redeploy immediately. Between those two steps the live backend is serving old code against renamed tables and WILL error - that gap is unavoidable with a table rename and should be taken at a quiet hour. The web client also 404s on the old route paths until it is rebuilt.\n\n=== BUILT Aug 25, PR #103 (446f5e1) ===\n\nNAME SETTLED: the FEATURE is 'Chirps' (plural) - braul corrected an initial pass that had made the display name singular 'Chirp', which also collided with the app's own name. A single item is 'a chirp', which is what the singular model class and the moderation target label mean. App name 'Chirp' is untouched everywhere it was always the product (wordmark, share copy, Stripe merchantDisplayName).\n\nTHREE MISTAKES MADE AND CAUGHT BY RUNNING IT, recorded because each is a trap for the next bulk rename:\n  1. The project-wide replace swept THE MIGRATION FILE, producing rename_table('chirps','chirps'), which failed instantly against a real database. A migration is the one place both names must coexist. It is now excluded and says so at the top; 0001 is excluded for the same reason - it records what actually ran, and any database below 0022 still has a table called yaks.\n  2. It also rewrote TWO FILES INSIDE backend/.venv - vendored third-party code (pygments, stripe). Reverted and confirmed importable. \\.venv is gitignored so nothing reached the index, but the skip list was wrong and would have hit anyone reusing that script.\n  3. moderation_actions has its OWN target_type CHECK holding 'yak' and was missed - content_reports was found by reading a model and this one was not. Three tests caught it. The tables are now enumerated from a pg_constraint query over definitions mentioning the old value, not from whichever models someone happened to open.\n\nALSO NOT OBVIOUS: a table rename touches NEITHER its columns NOR its indexes and constraints. yak_votes.yak_id had to be renamed explicitly (the ORM reads chirp_id and the suite fails without it), and yaks_pkey / idx_yaks_campus_time / the four fkeys were renamed so no Yak residue survives in the catalog.\n\nAND: the expo-router route manifest cached the old `yak` tab and rendered a SIXTH, empty tab after the directory move. Fixed by clearing .expo and rebundling - the CLAUDE.md '--clear after a file move' rule applies to route directories, not just edited source.\n\nEVIDENCE: 533 backend tests, single head 0022, migration up/down/up against a database holding a real 'yak' report row (downgrade restores yak_id and all four 'yak' constraints), zero Yak-named objects after upgrade, all four client gates exit 0, old route 404 / new route 200 / post 201, and on device the tab reads CHIRPS with a chirp posted through the renamed route rendering on the board.\n\nMERGED as 8f9af1c. Zero `yak` references survive outside alembic history, which is deliberate: 0001 still creates a table called yaks because that is what it did, and 0022 is the hinge.\n\nTHE MERGE ITSELF WAS THE LAST TRAP. c178 landed on main after this branch was cut and touched the same header, so main carried the NEW leading accent bar still labelled Yak while this branch carried the Chirps naming with the OLD bar - neither side correct alone. Git detected the yak/index.tsx -> chirps/index.tsx rename, so the conflict marker carried BOTH paths and a naive 'keep ours' would have silently reverted the accent bar on that one screen. Resolved by taking main's substance in every hunk and re-applying the rename on top; verified afterwards that alignSelf is present in both headers and that accentBarHeight stays deleted.\n\nSTILL REQUIRED, and it is the only thing between this and students seeing it: migrate prod AND redeploy in ONE window. New code cannot read `yaks`, old code cannot read `chirps`, and the live backend errors between the two steps. Quiet hour."

      "detail": "PROCESS NOTE FIRST, because it is the more useful half: I cut q/c177-seed-dues-attribution BEFORE writing this card, which is exactly backwards from the CLAUDE.md rule. `scripts/board-check` refused to report a next free id and named the branch - the tripwire works in practice and not just in principle.\n\nTHE BUG: every dues_payment row in scripts/seed_dev_accounts.py named its payer in the DESCRIPTION ('Dues - Marcus Webb') and left related_user_id NULL. The money existed and belonged to nobody, so anything answering 'who has paid' by grouping on that column read zero. Concretely: the c171 President overview rendered '$2,250 collected / 0 of 8 paid' on a freshly seeded stack - which reads as a broken feature rather than as missing fixture data - and payments.py's double-charge guard keys on the same column, so every seeded member could have paid again.\n\nPRODUCTION WAS NEVER AFFECTED - payments.py:316 sets related_user_id from the Stripe webhook. This was purely a fixture lying to whoever opened the app next, which is its own kind of expensive: it sends the reader hunting for a bug in working code.\n\nFIX: the payer uid is a real field on each LEDGER row instead of prose inside the description. Deliberately leaves THREE of the eight actives unpaid - a roster where everyone has paid cannot show the outstanding state the dues screens exist to surface.\n\nVERIFIED on a fresh migrate + seed against real PG16, by querying the COLUMN rather than the screen: 5 of 5 dues rows attributed, roster resolves to 5 paid / 3 outstanding.\n\nFound while building c175 and noted there at the time rather than fixed inline, since it is fixture data rather than feature code and did not belong in that PR."

      "tag": "vert:social-msg",
      "area": "yak",
      "title": "c175 DONE Aug 24 - MERGED via PR #99, squashed to main as f34c6bd, branch deleted. All 4 CI checks green (backend pytest PG16 3m23s). Touse/Bouse weekly leaderboard, backend + screen, device-verified on EAS build 75e1a26f. Migration 0020 live on the chain.",
      "detail": "WHAT IT IS (braul product call Aug 24): every verified student at a campus casts ONE ballot per week naming a top house (Touse) and optionally a bottom house (Bouse). Weekly leaderboard, plus a semester title - 'Touse of Fall 26'.\n\nTHREE PRODUCT DECISIONS TAKEN, each of which was a different schema:\n  1. BALLOT SHAPE: one ballot per student per week naming one Touse and optionally one Bouse. NOT per-house up/down voting - that lets a single voter downvote every rival at once, which makes brigading cheap and the weekly reset meaningless. One row per (campus, week, voter) makes 'one vote per week' a PRIMARY KEY rather than application logic, the same structural trick yak_votes uses for one-vote-per-yak.\n  2. ELECTORATE: any campus-verified .edu student, Greek or not, through the existing is_campus_verified gate (c86/c88, TTL included). That gate is the only thing between this and off-campus brigading, so it is load-bearing, not decoration.\n  3. BOUSE IS FULLY PUBLIC, top-to-bottom, DECIDED BY BRAUL after the risk was put to him explicitly. Recorded here so the call is attributable and nobody re-litigates it in review: a public bottom ranking names a real organisation with identifiable members as the worst on campus, it is the most brigadeable surface in the app, and it is the likeliest App Store Guideline 1.2 flag - the same gate the public-site card already tracks. Alternatives offered and declined: Bouse visible only to that chapter's own e-board, or naming only the top half. If review pushes back, both are retreat positions that need only a serializer change, NOT a migration - which is part of why the schema stores raw ballots rather than precomputed public standings.\n\nMITIGATIONS BUILT IN REGARDLESS, because they are simply what a brigadeable public ranking needs and none of them change the product: a minimum-ballot threshold before a house is ranked at all (crowning a Bouse off three votes is noise, not a result); the week is computed SERVER-side and never accepted from the client, or a client stuffs past weeks; a ballot is replaceable within its own week but never retroactively; voter identity is stored for abuse investigation and NEVER serialized.\n\nTOUSE CANNOT ALSO BE BOUSE on one ballot (CHECK). A ballot cannot point at a chapter from another campus - enforced by a COMPOSITE FOREIGN KEY on (chapter_id, campus_id), not a validation, because this repo has already shipped two cross-campus leaks (c82's dual-chapter attendance join, SECURITY-REVIEW finding 1 on moderation) and BOTH passed every single-campus test.\n\nSEMESTER TITLE = MOST WEEKLY WINS, tiebroken on cumulative net - a season champion rather than a points total, so one huge week does not buy the semester. Flagged as MY call and not a stated requirement; trivial to flip to cumulative points if Jose prefers.\n\nSCOPE THIS SESSION: migration 0020, models, schemas, endpoints, tests. Mobile screen is the follow-up.\n\n=== BACKEND BUILT Aug 24 (Q), branch q/c175-touse-bouse, commit b9cc19e ===\n\nSHIPPED: migration 0020 (house_ballots + uq_chapters_id_campus), models.HouseBallot, app/schemas/house.py, app/routers/house.py with three routes - PUT /campuses/{id}/house-ballot, GET /campuses/{id}/house-leaderboard, GET /campuses/{id}/house-title-race - plus current_week_start() and current_term() in app/core/windows.py. Every route gated on require_campus_member, reads included.\n\nTHE SABOTAGE PASS EARNED ITS KEEP IN AN UNUSUAL WAY - two of three runs found faults in the TESTS AND DOCS rather than confirming the implementation, which is worth recording because a green suite would have hidden both:\n  1. Dropping MIN_VOTES_TO_RANK failed 2 tests. Working as intended.\n  2. Reordering the term title by cumulative points PASSED. The test had tied the two houses on weekly wins, so cumulative net was the tiebreak under BOTH rules and the test never pinned the rule its own name claimed. Rewritten so the two rules give OPPOSITE answers (spiky: 1 win, net 40; steady: 2 wins, net 19) and it now fails under the sabotage. Rewriting it also surfaced a second bug in the test helper: aging only the CURRENT week collapses two cast blocks into one week, silently, with plausible-looking totals.\n  3. Dropping the ballot-side campus filter PASSED. The composite FK makes a chapter belong to exactly one campus and the board is spined on that campus's chapters, so a foreign ballot's chapters never join - the filter is defence in depth and row-count reduction, NOT the guarantee. The docstring claimed it was 'not redundant'; that claim was false as written and has been corrected to say what is actually true and which test really covers the scoping.\n\nDECISIONS A REVIEWER SHOULD NOT SILENTLY UNDO: the threshold is a safety property, not a perf knob (a public Bouse drawn from three ballots names a real org the worst on campus off noise); the week is server-computed and deliberately not addressable; voter_id is stored and serialized by nothing, not even back to its own author; ballots are stored raw so the public-Bouse decision stays reversible without a migration.\n\nONE BEHAVIOUR CHANGED WHILE BUILDING: a cross-campus or duplicate-house ballot hit the constraints correctly but escaped as an unhandled IntegrityError, i.e. a 500. Now translated to 422 unknown_house_for_this_campus. Found because the test asserted only 'status >= 400' - a weak assertion that was itself tightened to pin the real status and detail.\n\nMIN_VOTES_TO_RANK = 5 is a starting value for a small campus, NOT tuned. First number to revisit once real turnout exists.\n\n=== SCREEN BUILT AND DEVICE-VERIFIED Aug 24, PR #99 ===\n\napp/(tabs)/yak/houses.tsx plus src/api/house.ts, reached from a deliberately quiet row on the Yak tab - the leaderboard shares Yak's electorate (verified .edu) so it hangs off that tab rather than earning a sixth, and Yak is the PLACE that screen is (DESIGN.md rule 5) so a second loud card there would fight it.\n\nTWO THINGS THE SCREEN MUST KEEP DOING, both downstream of the Bouse being public: unranked houses render in their OWN section with their vote count and are never sorted to the tail of the ranking; and the denominator ('39 ballots cast') is always on screen, so a ranking cannot be read as a verdict without its sample size. Anyone 'tidying' either of those is removing a safety property, not chrome.\n\nThe Bouse picker greys out whatever is already named Touse - the server rejects naming one house twice, so offering it would be a button whose only outcome is an error.\n\nDEVICE VERIFICATION IS REAL THIS TIME, on EAS build 75e1a26f (see c166 - the previous build red-screened at launch and blocked every device check in the repo).\n\n=== MERGED Aug 24 ===\nPR #99 squashed to main as f34c6bd. CI: alembic single head 12s, web build 19s, mobile tsc 35s, backend pytest (PG16) 3m23s - all pass.\n\nNOT DEPLOYED. Migration 0020 is on the chain but has NOT been applied to prod, and the routes are not live until a Cloud Run redeploy. Sequence for whoever does it: alembic upgrade head against prod FIRST, then redeploy - the routes 500 against a database without house_ballots. Nothing about this feature is reachable by a student until both happen.\n\nSTILL OPEN AND DELIBERATE: MIN_VOTES_TO_RANK = 5 is an untuned starting value, and the term title is decided on weekly wins rather than cumulative points (my call, flagged, one ORDER BY to flip)."

      "title": "DONE Aug 24 - merged (#97, second revision after the first was rejected for a money hole). President overview nets corrections (true standing); the pay path stays existence-blocked but tells the truth: already_paid vs refunded_contact_treasurer. Self-serve re-payment after refund stays closed on purpose (unrepresentable in the append-only ledger) - c83-shaped future work, documented at both sites and pinned by tests. Full CI green. Rides the next deploy",
      "detail": "Found while building c171, and deliberately NOT resolved there because making the two agree means deciding which one is wrong.\n\nTHE TWO DEFINITIONS. payments.py:178 (the double-charge guard) treats the mere EXISTENCE of a dues_payment row for the cycle as already_paid and does not look at corrections. c171's overview NETS corrections per member, so a member refunded in full has a net of zero and comes back as outstanding.\n\nWHAT A CHAPTER ACTUALLY HITS: a treasurer refunds someone - correctly, as a new append-only correction entry (SPEC 8.2) - and from that moment the president's dashboard lists that member as still owing, while the member opening the app to pay gets a 409 already_paid and cannot. Neither screen is lying; they are answering different questions with the same word.\n\nBOTH DEFENCES ARE REAL, which is why this is a ruling and not a bug fix. The guard erring toward 'paid' is the SAFE direction for a guard whose job is to stop a card being charged twice - a false 'unpaid' there means double-charging a student. The dashboard erring toward 'owes' is the honest answer to 'who do I chase', and a refunded member genuinely does owe again.\n\nOPTIONS, roughly in increasing order of work: (1) leave both and document the seam where a treasurer will see it, accepting that refunds need a manual nudge; (2) teach the guard to net corrections too, so a fully-refunded member can pay again - the smallest change that makes the two agree, and it moves the risk onto the refund being correct; (3) model dues status explicitly rather than deriving it from ledger rows twice, which is the real fix and is c83-shaped work.\n\nNOT URGENT TODAY: it needs a refund to have happened, and no chapter has processed one yet. It will not stay that way once real dues run. The seam is already written down in chapters.py's chapter_overview docstring so the next person to touch either side finds it."

      "title": "c171 DONE Aug 24 - MERGED via PR #95, squashed to main as 6daca3e. All 4 CI checks green (backend pytest PG16 2m26s, mobile tsc, alembic single head, web build); full suite re-run on merged main: 492 passed. 20 new tests, 3 of them proven to FAIL against the naive implementations first. Rendered in both themes with live data AND the empty-chapter state. NOT YET SEEN ON DEVICE - blocked by c166's stale EAS build, not by anything here.",
      "detail": "WHY THIS IS A REAL GAP AND NOT A NICE-TO-HAVE. The president is the ONLY role holding every capability - core/permissions.py maps them to dues_admin, minutes_admin, members_admin, moderation AND lineage_admin - and yet theirs is the one e-board screen that surfaces no state at all. treasurer.tsx (883 lines) shows the ledger and dues cycles, secretary.tsx (782) shows meetings and attendance, historian.tsx shows families. president.tsx (451) shows two text inputs for org/chapter name and a tappable roster. A president who wants to know whether dues are collected or whether anyone is failing attendance has to walk into other officers' screens one at a time.\n\nSCOPE - five chapter-scoped panels, one request:\n  1. ROSTER: active count, breakdown by role, pledges, inactive.\n  2. DUES: the current cycle (name, amount, due date), how many active members have paid vs outstanding, cents collected.\n  3. ATTENDANCE: meetings in the window and how many active members have missed at least one, reusing c82's window helper.\n  4. LINEAGE: big/little edges still unconfirmed by the little.\n  5. INVITES: codes still live - not revoked, not expired, uses < max_uses.\n\nMODERATION IS DELIBERATELY EXCLUDED, and this is the one design call worth arguing on the board rather than burying in a docstring. content_reports carries campus_id, NOT chapter_id, and moderation.py:list_reports scopes to 'campuses where the caller is active e-board' (SECURITY-REVIEW finding 1). An 'open reports' number inside a response shaped /chapters/{id}/overview would be campus data wearing a chapter label - the exact category error this repo's docstrings keep catching. The Moderation tile already exists in the Tools grid and is honestly campus-scoped there. If a president ever wants that count on this screen it needs its own clearly campus-labelled call, not a field in this one.\n\nGATE: MEMBERS_ADMIN (president-only). Not a new capability - the payload spans dues, attendance and lineage, and a treasurer must not read attendance while a secretary must not read dues, so the tightest honest gate is the role that already holds all of them. Nothing here is gated more loosely than the screen it feeds.\n\nPERFORMANCE DISCIPLINE, since this is the exact shape that produced c82 and c156: a FIXED number of statements, none of them per-member. c82's own docstring records why it is two statements rather than one - a roster-spined query returns no rows for an empty roster, so a denominator folded in as a subquery would vanish with it. Same trap applies to every count here; an empty chapter must still render zeroes, not an empty screen.\n\nDEPENDENCY ON c83, acknowledged and NOT resolved here: role has no term, no history and no audit, so this overview can only ever describe the chapter as it is RIGHT NOW. That is the honest scope of a dashboard and does not need c83 to land first, but nothing here should imply history it cannot have.\n\nVIEWABLE at EXPO_PUBLIC_DEV_UID=dev-president (Marcus Webb, Sigma Chi) from c159's seeded set.\n\n=== BUILT Aug 24 (Q), branch q/c171-president-overview, commit 9a59601 ===\n\nSHIPPED: GET /chapters/{chapter_id}/overview gated MEMBERS_ADMIN, returning roster / dues / attendance / lineage / invites in one response; ChapterOverview + five sub-schemas; getChapterOverview() in src/api/chapters.ts; an OverviewPanel above the existing admin controls in president.tsx. NO MIGRATION - every number is a read over tables that already exist.\n\nSEVEN STATEMENTS, FIXED, none per-member. Roster size changes the numbers and never the query count.\n\nTHREE SABOTAGE RUNS, because a test that has never failed proves nothing (c82's rule, applied):\n  1. Swapped the attendance join for the natural 'join out to meetings afterwards' version -> test_a_dual_chapter_members_absence_elsewhere_is_not_counted_here FAILED (1 != 0), and test_the_window_excludes_meetings_outside_it failed too, so that one rewrite leaks BOTH another chapter's absences and the window.\n  2. Swapped paid_members for COUNT(DISTINCT payer) minus roster -> three tests FAILED, including outstanding going negative for a member who paid and then went inactive.\n  3. Dropped correction handling and read dues_payment rows only -> both correction tests FAILED.\n\nTWO THINGS FOUND WHILE BUILDING, neither of them this card's bug:\n  (a) c172 - the double-charge guard and this dashboard disagree after a refund. Filed separately; it needs a product decision, not a quiet alignment.\n  (b) THE SEEDED DEV DATA writes dues_payment rows with related_user_id NULL, so the local stack showed '$2,250 collected / 0 of 8 paid' until real attributed payments were added by hand. Production is fine - payments.py:316 sets related_user_id from the Stripe webhook - but scripts/seed_dev_accounts.py should attribute its payments or every dues-related screen looks broken to whoever opens it next. Worth a small fix on the seed, not carded separately.\n\nSHARED FILES TOUCHED, declared per CLAUDE.md: secretary.tsx (its private currentSemesterWindow moved out to src/org/semester.ts and is now imported), meetings.py (its private _meeting_window moved out to app/core/windows.py and is now imported), src/api/chapters.ts, app/schemas/identity.py and app/schemas/__init__.py. The two window helpers moved because a THIRD caller is exactly when a helper whose whole purpose is 'these must not drift' should stop living inside one screen.\n\nDESIGN PASS: one prominent money card, a two-up compact row, then an attention list that renders ONLY rows needing action - DESIGN.md rule 1 (zones, not card soup) rather than an even stack of identical cards. The collected figure is the screen's one gold moment (rule 4, 'never zero gold either'), in campusColors.secondary and NOT palette.warning, since warning is the pending-state orange. An earlier pass had amber 'Open' badges on the attention rows; they were removed for competing with that gold moment while restating what the row label already said. due_date renders through the T00:00:00-with-no-Z pattern, so it does not carry the c165 day-shift.\n\nEVIDENCE: Sigma Chi with live data - '$4,500 / 5 of 8 paid / due September 14', roster 8, 3 meetings this semester, 4 missed a meeting, 1 unconfirmed pair, 2 live codes. Alpha Delta Pi as the empty case - 'No dues cycle has been opened yet', roster 1, 0 meetings, 'Nothing needs your attention right now.' Both light and dark.\n\nVERIFIED ON WEB, NOT ON DEVICE, and the reason matters: the iPhone 15 Pro sim now red-screens at launch with '[@RNC/AsyncStorage] NativeModule: AsyncStorage is null' - c166's native module against sim build a2cea56d. Nothing in this card can be device-checked until that build is recut, which is the c39/c166 dependency and not a defect here.\n\n=== MERGED Aug 24 ===\nPR #95 squashed to main as 6daca3e, branch deleted. CI: alembic single head 8s, web build 17s, mobile tsc 28s, backend pytest (PG16) 2m26s - all pass. Full suite re-run locally against merged main: 492 passed, 0 failed.\n\nWHAT A REVIEWER SHOULD KNOW IF THEY TOUCH THIS NEXT:\n  - The gate is MEMBERS_ADMIN and must stay there. Widening it to DUES_ADMIN to let a treasurer see the money half would hand them attendance in the same response; there are tests for the treasurer and secretary 403s specifically.\n  - paid_members/outstanding_members are spined on the ACTIVE roster and collected_cents deliberately is not. They look inconsistent and are answering different questions; test_collected_cents_keeps_money_from_a_member_who_left holds that line.\n  - The attendance join must stay joined against pre-filtered meeting ids. Rewriting it the natural way leaks another chapter's absences AND drops the window, and both failures were demonstrated, not assumed.\n  - The two window helpers (app/core/windows.py, src/org/semester.ts) exist so the Secretary and President meeting counts cannot disagree. Do not inline them back into a screen.\n\nFOLLOW-UPS LEFT OPEN, on purpose: c172 (refund vs already_paid seam - product ruling), and the seed-data gap where scripts/seed_dev_accounts.py writes dues_payment rows with related_user_id NULL, which makes every dues surface look broken on a fresh local stack while production is fine.\n\nDEVICE VERIFICATION IS THE ONE THING NOT DONE, and it is not blocked on this code: sim build a2cea56d red-screens at launch on c166's native module. The moment a new EAS build exists, this screen is viewable at EXPO_PUBLIC_DEV_UID=dev-president with nothing further to build."

      "detail": "EVIDENCE, not inference. A meeting created through the app with meeting_date 2026-08-24 is stored by the server as 2026-08-24T00:00:00Z (verified via GET /chapters/{id}/meetings) and rendered by the Secretary dashboard as \"Sun, Aug 23\". Same shift on both seeded meetings: 2026-08-17 renders \"Sun, Aug 16\", 2026-08-10 renders \"Sun, Aug 9\". The 2026-08-17 card is self-contradicting on screen - its own title reads \"Chapter Meeting 2026-08-17\" and the line directly under it reads \"Sun, Aug 16\".\n\nCAUSE: app-mobile/app/(tabs)/chapter/secretary.tsx:62. meetingDate() does new Date(iso).toLocaleDateString(...), which parses a UTC INSTANT and then formats it in the device's LOCAL zone. Midnight UTC is the previous evening anywhere west of Greenwich, so the calendar day moves back one. The test machine is America/New_York (UTC-4); every US user sees this, and it gets worse further west.\n\nWHY IT MATTERS beyond cosmetics: a secretary logs Thursday's chapter meeting and the app tells the chapter it was Wednesday. Attendance rows hang off that meeting, so the wrong day is what anyone reads back later.\n\nTHE FIX ALREADY EXISTS IN THIS CODEBASE, twice, which is what makes this a slip rather than a design question: app-mobile/app/(tabs)/chapter/dues.tsx:25 and app-mobile/app/(tabs)/chapter/treasurer.tsx:104 both build a Date from the day string plus T00:00:00 with NO Z, so the value parses as LOCAL midnight and the calendar day survives. secretary.tsx should do the same with the date half of meeting_date.\n\nALSO CHECK, not yet confirmed: app-mobile/app/(tabs)/chapter/treasurer.tsx:100 has the identical new Date(iso).toLocaleDateString(...) shape. Whether it bites depends on whether its iso is a real timestamp (fine) or a date-only value (same bug). Worth one look while the fix is open.\n\nWHY IT SURVIVED: it does not reproduce in the usual dev loop on a machine sitting at UTC - it needs a device or a machine in a western zone to show up - and c156's 446-test backend suite is entirely server-side, where the stored value is correct.\n\n=== FIXED AND MERGED Aug 24 ===\nThe fix is one helper, src/lib/dates.ts, used by dues.tsx, treasurer.tsx, president.tsx and secretary.tsx. treasurer.tsx's entryDate is deliberately NOT routed through it: created_at is a genuine instant and rendering it in the viewer's local zone is the point, not a bug. The helper states the test for telling the two apart - would two people in different timezones be right to disagree about this value?\n\nWHY IT NEEDED A NEW CI GATE rather than just a fix: this class of bug is invisible to tsc (both sides are strings), invisible to the backend suite (the stored value was always correct), and does not reproduce on a machine sitting at UTC - which is exactly why it survived to a device. verify:dates therefore re-runs its assertions under several timezones on both sides of Greenwich AND asserts the naive implementation still fails in them, so the check cannot quietly go vacuous and keep reporting ALL PASS."

s my big\" -> prompt gone, footer drops to \"6 unplaced\", server reports confirmed_by_little=true. COLD-RESTARTED THE APP: the pair persists and the edge is now SOLID, matching TreeCanvas.tsx:145 (strokeDasharray only when unconfirmed). Persistence verified, not assumed.\n\nc70 PARTIAL - everything except the bytes. The real iOS permission dialog fires and renders app.json's photosPermission string verbatim (\"Chirp needs access to your photos so you can attach one to a post.\"), Allow Full Access works, the native picker opens with the simulator's photo library, and selecting a photo drives the upload request. It then FAILS CLOSED with the server's honest 503, surfaced as \"Couldn't upload that photo / media_not_configured\" - correct behaviour, because the local stack has no media_bucket_name. The upload+render leg therefore CANNOT be closed against a local stack at all; it needs a configured GCS bucket, i.e. prod, which also means writing a real photo and a real post into production - a call for Jose, not a session. NIT: the alert shows the raw server code media_not_configured to the student rather than human copy, the same class of gap c158 fixed for email.\n\nc39 (this build) - launched, navigated Home / Orgs / Tools / Secretary / Family Tree, and cold-restarted the app four times across three different identities with no crash.\n\nTWO REAL FINDINGS RAISED BY THIS RUN:\n(1) c165 - meeting dates render ONE DAY EARLY. Confirmed visually; see that card.\n(2) FIREBASE AUTH HAS NO PERSISTENCE ON NATIVE. Metro logs a Firebase warning on every launch: auth is initialised without AsyncStorage, so \"Auth state will default to memory persistence and will not persist between sessions\". On web this is invisible; on a phone it means a real signed-in student is signed out every time the app is killed. This run could not feel it because EXPO_PUBLIC_DEV_UID re-establishes the session on each launch, which is likely why it has never been noticed. Needs @react-native-async-storage/async-storage - A NATIVE MODULE, so adding it STALES build a2cea56d and forces a new EAS build. Not filed as its own card yet; raise it before anyone plans the next build.\n\nLAYOUT, on several screens: the floating tab bar and the FAB sit ON TOP of scrollable content rather than above padding - the Orgs feed loses a line of post text under the FAB, and the Secretary member list and Tools grid lose a row under the tab bar. Cosmetic, consistent, and easy to miss on web where the bar is not floating.\n\nSERVICES: the c162 session owns :8000 and :8081 out of .claude/worktrees/c162 and was NOT disturbed; this card used :8001, :8082 and container chirp-c164-pg on :5441, with launch.json configs c164-api / c164-native-signin / c164-native-secretary / c164-native-historian / c164-native-pledge. Switching identity on native costs a full Metro restart with --clear (~90s) because EXPO_PUBLIC_DEV_UID is inlined at transform time - there is no URL bar to do what ?uid= does on web."

ouched. Crashed runs are reclaimed by a startup sweep that decides liveness from the pid embedded in the name, so abandoned databases cannot pile up. SECOND BUG THIS EXPOSED, and the more interesting one: migrated_db ran DROP SCHEMA public CASCADE to reset the shared database. A database created by the chirp role inherits its public schema from template1, where it is owned by the bootstrap superuser, so a non-superuser cannot drop it - InsufficientPrivilegeError, 'must be owner of schema public', 154 errors on Jose's Homebrew PG14 - WHILE PASSING IN CI, where POSTGRES_USER is a superuser that owns everything. A works-in-CI-fails-locally split sitting in the suite. The reset is DELETED rather than worked around with an ownership grant, because the database is brand new by construction and there is nothing to reset. NOTE FOR HANDOFF: this obsoletes the 'ALTER SCHEMA public OWNER TO chirp' workaround written there today - after #22 the setup instruction is just 'run pytest', and leaving the grant documented will send the next person chasing something they do not need. The deadlock is also legible now: if anyone ever points two runs at one database again, the TRUNCATE raises a message naming the cause instead of 39 identical tracebacks. VERIFIED UNDER THE FAILING CONDITION ITSELF - full suite run with other sessions active: 176 passed, 3 skipped, 0 failed, 0 deadlocks, 0 leaked databases. That run exited 1 for one reason only: CHIRP_REQUIRE_DB=1 was set and this Mac has no redis-server, so the 3 fan-out tests skipped and c103's own skip ceiling caught them - working as designed, the flag is CI-only and CI has redis, and it incidentally proved that hook against the real suite rather than the scratch one it was built on. ADVERSARIAL REVIEW, run after the fix and reported here rather than quietly patched: four lenses, every finding independently refuted before acceptance - 9 raised, 5 refuted, 4 real, all four mine and all four fixed. HIGH: the stale sweep decided 'abandon       "detail": "FIXED in PR #13. pubsub.subscribe() ran AFTER websocket.accept() with no try/except, so an unreachable Redis raised mid-handler and the client saw a socket that opened and instantly died: shaped exactly like a flaky network, with nothing server-side saying the cause was missing infrastructure. Since c61 proved Redis was never provisioned in prod, that was EVERY connection, not an edge case. Now closes with 4503 (mirrors HTTP 503) and logs at error level. The split from 4401 is the entire point: 4401 means the session is bad and the user should be sent to sign-in, 4503 means the session is fine and the client should back off \u2014 one generic code would let a Redis outage silently sign every user out. Teardown is suppressed too, so a Redis death mid-connection cannot raise in the finally block and mask whatever actually ended the connection. 3 tests in backend/tests/test_ws_redis_down.py, deliberately a separate file from Q's test_ws_fanout.py so PR #12 and PR #13 do not collide. Proven load-bearing by restoring the unguarded subscribe and watching the two behavioural tests fail, while the third (auth resolves BEFORE anything touches Redis) correctly kept passing since that ordering was never broken. 145 backend tests green. REVIEW FOLLOW-UP Aug 15: reviewing my own PR found TWO more bugs in this very fix. (1) The teardown sat on the wrong side of a re-raise \u2014 awaiting the forward task re-raises whatever it stored, and suppress(CancelledError) does not catch a ConnectionError, so a Redis that died after subscribe skipped the pubsub cleanup entirely and the exception escaped the finally block. CancelledError is a BaseException; suppressing one of the two lets the other through. (2) Nothing observed the forwarder dying at all: the handler only awaited the client drain, so a Redis dropping AFTER connect left the socket open delivering zero events with no log and no close frame \u2014 the exact c62 symptom, moved from connect time to steady state. es' and :158 says 'We can suspend or close an account'. Checked against the code, not assumed: there is NO suspend / banned / is_active / disabled field on ANY model in backend/app/models, NO suspend-ban-deactivate endpoint in any router, and deletePost (src/api/feed.ts:102) and removeYak (src/api/moderation.ts:67) both exist in the API client with ZERO call sites in any .tsx \u2014 nothing in the app can invoke either. So a student who reports someone is told in writing that we can act, and we cannot. This is the same failure mode as section 14 of the privacy policy and c69: a written promise with nothing behind it. Note the honest distinction before rewriting \u2014 a reservation of RIGHT ('we may remove content') is normal and fine in a ToS; a statement of CAPABILITY is what this is and what is false. FIX: either wire a real removal path and an account disable (bigger than it sounds, needs a model field, an endpoint, an admin surface and an audit trail), or reword both clauses to reserve the right without asserting the button exists. Whichever way it goes, the fix is one PR touching Terms.tsx and the code together, same rule as c69. HEADS-UP FOR WHOEVER LANDS 0011: migration 0013 already exists on the PR #16 branch (c71) with down_revision = '0010', so the moment 0011 lands there are two migrations parented on 0010 and alembic upgrade head hits multiple heads. The fix belongs on the c71 side \u2014 re-point 0013 at the new head before PR #16 merges, not renumber it \u2014 so just say on the board when 0011 is in and c71 can re-point at the right parent."

      "detail": "CODE DONE, PR #19. campus_id removed from UserCreate and UserUpdate; bootstrap leaves the column null; the .edu redemption in c86 will be its only writer. SCOPE CORRECTION, recorded because the first telling overstated it: the deployed app NEVER exploited this - account-type.tsx sends email, display_name and account_type only, so every real signup already got a null campus. It was an open door nobody had walked through, not an active path. Removing the field beats validating it here because _Schema does not set extra=forbid, so an older client still sending campus_id has it IGNORED rather than 422d - no signup outage. THE FINDING INSIDE THE FINDING: removing it broke 23 tests, because bootstrapping with a claimed campus was the ONLY way anything in the suite assigned one. The vulnerability WAS the mechanism, which is exactly why a five-lens security review missed it - that review asked whether scoping was applied consistently, and it is. Tests now use a set_campus helper writing the column directly, the same shape _grant_platform_admin already uses. KNOWN CONSEQUENCE: a brand-new signup has no campus and therefore no campus feed or Yak until c86 ships; per the two-tier decision, chapter membership still grants org content, so the alpha path is unaffected. ORIGINAL: CAMPUS IS SELF-ASSERTED \u2014 ANY USER CAN READ ANY UNIVERSITY'S FEED AND YAKS TODAY. Found Aug 16 while designing the .edu rule, and it is the reason that rule is not a new restriction but the boundary itself. POST /auth/bootstrap takes campus_id STRAIGHT FROM THE REQUEST BODY (routers/auth.py:58, schemas/identity.py:37 UserCreate.campus_id) and writes it with no check against anything. UserUpdate.campus_id exists too, so it can be changed later at will. The campus feed's guard at routers/feed.py:113 is 'if user.campus_id != campus_id: 403' \u2014 which compares the path against a value THE USER CHOSE, so it enforces consistency and not identity. Note why the Aug 15 five-lens review missed it: the authorization lens checked that campus and org scoping were applied CONSISTENTLY everywhere, and they are. It never asked whether campus_id was trustworthy in the first place. FIX, and it is small and should land before any verification feature: campus_id becomes SERVER-OWNED. Remove it from UserCreate and UserUpdate, have bootstrap leave it null, and let the only writer be the verification flow in c86. A user with no verified campus simply has no campus feed \u2014 which is the correct state for someone who has not proven anything."

      "detail": "BUILT Aug 16 on jose/c87-email alongside c88's gate. MIGRATION 0015 - NOT 0014, which c96 took; this card's original text claiming 0014 was corrected earlier today. SCHEMA: users.campus_verified_at, campuses.email_domains (text[]), and a campus_verifications table holding a SALTED HASH of the code plus expiry, single-use consumption and an attempt counter. ENDPOINTS: GET /auth/campus-verification (status, shaped for c90 - returns verified_at even when verified is false, so the screen can tell a LAPSED verification from one that never happened), POST /auth/campus-verification (202, mails a code), POST /auth/campus-verification/redeem. THE CAMPUS IS NEVER TAKEN FROM THE BODY. The caller sends an address and the server resolves the campus from its domain at send time. Accepting both would let someone pair a domain they control with the campus they want to read, which is c85's vulnerability rebuilt one layer up. c96's ORDERING RULE IS IMPLEMENTED AND TESTED: redeem OVERWRITES campus_id rather than filling a NULL, because a proved .edu is strictly stronger than a forwarded invite code. c96's join path only ever fills a NULL so this can win; the reverse must never happen, and there is a test named for it. SUBDOMAIN POLICY, decided rather than left implicit: EXACT match. uncg.edu does not admit students.uncg.edu - a campus needing the subdomain lists it explicitly, so the rule widens only by a visible data change. Fails CLOSED: no domains configured means no code is ever sent. ON THE HASH, honestly: a six-digit code has a million values, so hashing does not make a stolen DB safe. Salting with the row id defeats one precomputed table covering every row; the protections that actually matter are on the live path - 15-minute expiry, 5-attempt cap, single use, and a send rate limit. A wrong guess is COMMITTED before the error is raised, or the rollback would refund the attempt and the cap would never bind. Resending retires the previous code, so two live codes pleid.com address, and Google hands us gmail.com, so the SIGN-IN email can never serve as the .edu proof. Verification has to be a separate step against a separate address \u2014 which is exactly the flow Jose described, and it is right for that reason. PRODUCT CALLS ANSWERED Aug 16, build to these: chapter membership grants ORG content only (private feed, events, dues) and never the campus feed or Yak, so the .edu gate covers campus-wide surfaces alone; and verification RE-CHECKS YEARLY, so the schema needs verified_at plus an expiry read, not a one-shot boolean. THE ALPHA CONSEQUENCE: the chapter experience needs no email at all, so this card and c87 block Yak and the campus feed but NOT Q's old chapter using org tools and paying dues. Superseded question, kept so nobody re-opens it: does a verified chapter membership at a campus grant campus access without an .edu, and what happens at graduation when the .edu stops working \u2014 is verification point-in-time or does it re-check."

eceive a verification code at all, so this gate darkens Yak and the campus feed for alpha until c73's domain lands. That moves the domain purchase onto the alpha path. ORIGINAL: the enforcement half of c86, separate because it is the part that is easy to get subtly wrong. Once campus_verified_at exists, every read of campus-scoped content must require BOTH a matching campus_id AND a non-null verification. Do it in ONE dependency that the routes depend on, not with a copied if-statement per route: routers/feed.py and routers/yaks.py each scope their own way today, and a per-route check is a check someone forgets to add to route number three. Include the write side \u2014 posting a yak to a campus you have not verified is the same hole facing the other direction. ANSWERED Aug 16: an unverified user gets a REAL VERIFY SCREEN with the form on it, not an empty feed and not a bare error toast - so the 403 this card enforces has a designed destination and c90 owns building it. Original wording, for the reasoning:: an empty feed is confusing and a 403 is honest, and the app needs a real screen for 'verify your .edu to see your campus' rather than an error toast. Tests are the point of this card: a user with a campus_id but no verification must be refused, and that test must fail if the dependency is removed from any single route."

      "detail": "Seen on the wire during c94's live verification, on every single sign-in, both before and after that fix: GET /auth/me returns 401, then a second GET /auth/me returns 200. The cause is a token race that mirrors c94's session race one layer down. signInWithEmail (src/auth/session.ts) only calls setAuthToken AFTER awaiting credential.user.getIdToken(), but Firebase fires onAuthStateChanged as soon as the credential lands - so SessionProvider's listener calls loadMe() and fetchMe() goes out with no bearer token attached. WHY IT IS MORE THAN COSMETIC: a 401 is not a 404, so loadMe treats it as a transient failure and SPENDS ONE OF ITS THREE RETRIES on it, on every sign-in, before the user is even through the door. On a good network the token lands almost immediately and the recovery is invisible (measured ~1s to /feed), but on a bad one the budget that exists to survive real network trouble has already been partly consumed by a self-inflicted failure. It also means the c94 fix's wait is longer than it needs to be. FIX: have the SessionProvider auth listener set the token itself before calling loadMe (await firebaseUser.getIdToken() then setAuthToken), or make loadMe not count a 401-with-no-token-set against the retry budget. Prefer the former - it removes the failed request instead of tolerating it. Touching a shared file (SessionProvider), so claim it here first. FIXED Aug 16, commit 4a22a98, and the diagnosis held exactly. The auth listener now awaits firebaseUser.getIdToken() and calls setAuthToken BEFORE calling loadMe, and clears the token on sign-out. It is not redundant with signInWithEmail or the root layout's onIdTokenChanged, both of which also set the token: it is the only one ORDERED before the fetch that needs it, which was the whole bug. A failed token fetch still falls through to loadMe rather than stranding the session. VERIFIED LIVE against prod, both paths that showed the 401: a fresh sign-in now makes exactly ONE /auth/me call returning 200, and a cold page reload with a restored session likewise - zero 401s anywhere in either network trace, where before each produced a 401 followed by a 200. tsc clean."

e closed: a suite that skipped and still exited 0 (c103, fixed in PR #22); a card that parses fine and renders nowhere (fixed in c01d4e0, red banner plus scripts/board-check); a commit sitting on a branch nobody reads, where git commit and git push both succeed and the board simply never changes (fixed by the branch guard in the same commit). All four share one shape: a green signal that answers a question nobody asked. JOSE'S DECISION, and it is genuinely his because it reverses a call he made deliberately: the real fix is branch protection on main with 'require branches to be up to date before merging', which forces a re-run whenever the base moves. He has kept CI ADVISORY on purpose and no branch protection exists. OPTION A, turn on require-up-to-date for main only - closes this class entirely, costs a re-run and a wait on every merge that follows another merge, which with five sessions merging in a burst is real friction. OPTION B, leave CI advisory and adopt a manual rule: before merging, if main has moved since the PR's last run, push an empty commit or re-run checks and wait. Cheap, free, and depends on somebody remembering, which is exactly what failed today. OPTION C, a merge-queue, correct and more setup than this project wants right now. MY RECOMMENDATION IS A, scoped to main and to the three existing jobs, because the friction it adds is bounded and predictable while the failure it prevents is silent and lands on prod migrations. Note it does NOT make CI blocking in the sense Jose rejected - required-checks and up-to-date are separate settings, and A can be taken without making any check a merge blocker."

      "detail": "Claimed Aug 22, branch jose/c126-suspension-enforcement (worktree /Users/joseperdomo/Desktop/chirp-c126). From the approved security-hardening list, items 3 and 4, one card and one PR since they're related. VERIFIED BEFORE BUILDING rather than assumed: users.suspended_at / suspension_reason / suspended_by all exist (identity.py:57-59), so this is a wiring gap, not a missing data model - the ticket's size is as scoped, not bigger. (1) UserOut (identity.py, wrapped by MeOut) has no suspension field at all, and is used ONLY in self-facing contexts - POST /auth/bootstrap and GET /auth/me, never another user's view - so adding suspended_at here cannot leak anyone else's status. (2) The HTTP precedent is middleware/auth.py's get_current_user: `if user.suspended_at is not None: raise 403`, checked once at the one place every router's current-user dependency passes through. ws/gateway.py's websocket_gateway resolves the user at connect time and never makes this check - accepts unconditionally. Matching the HTTP pattern rather than inventing one: check at connection time, refuse with a distinct WS close code (4401 already means 'credentials didn't resolve to a user' per the existing comment; suspension is a different case - a resolved user who is blocked - same split as HTTP's 401 vs 403). SCOPE NOTE, stated up front: this closes new connections, matching what the ticket asks and what the HTTP precedent itself does (checked per-request, not continuously monitored). An already-open WS session for a user suspended mid-session is a different problem (would need periodic re-checks or a suspend-triggered kill) and is NOT part of this ticket - flagging it as a known residual gap rather than silently leaving it unmentioned. Tests: suspended user gets the field in MeOut, suspended user is refused at the gateway, non-suspended path unchanged on both. sally is taking c127/c128 in parallel - no overlap, different files. BUILT Aug 22, PR #55, branch jose/c126-suspension-enforcement. UserOut gains suspended_at, safe because it's self-facing only (grepped every call site: POST /auth/bootstrap, GET /auth/me, never another user's view). WS gateway mirrors the HTTP precedent exactly (suspended_at is not None -> refuse), new close code WS_ACCOUNT_SUSPENDED=4403 distinct from 4401 the same way HTTP splits 401/403. SCOPE HELD: closes new connections only, matching what HTTP does (checked per-request) - an already-open socket for someone suspended mid-session is a different problem, not built here. REAL FINDING, not assumed - a test that expected a 403 on /auth/me while suspended got 200 instead. GET /auth/me does NOT go through get_current_user at all; its own docstring says why, predating c76 by design (unregistered caller needs 404, not 401), and nobody revisited it when c76 landed. So /auth/me was NEVER suspension-gated - a suspended account gets a full 200 with real profile and memberships today, on main, before this change, while every other authenticated route 403s them. This field's addition makes that gap OBSERVABLE for the first time. Documented in the schema comment, the mobile type comment, and the test file rather than silently patched - whether /auth/me SHOULD be suspension-gated too is a separate, unresolved product question, not answered here. EVIDENCE: tests cover null-when-never-suspended, the real (200, field set) behavior once suspended plus a sibling route still 403ing the same caller, a schema-level test independent of route enforcement, and three WS cases (refused/still-connects/unsuspend-restores) - none need Redis, same as the existing 4401 tests. No migration - suspended_at already existed. Single alembic head (0013, chained onto 0016 per this project's numbering convention), unchanged. tsc clean. 285 pass / 3 skip / 0 fail on a fresh isolated db. MERGED Aug 22, PR #55, d512e62. Manager verified before merging: the self-facing-only claim checked against every UserOut usage site (holds), the gateway check sits before accept() mirroring the 4401 path, and the unsuspend-restores test pins that the column is read fresh per attempt. RULING on /auth/me (see decisions log): it stays reachable for suspended users, deliberately - the accident becomes the design, on the record, Jose can veto. FOLLOW-ON CARD: c129, the client side of this - nothing renders suspended_at or handles WS 4403 yet."

ackend tests pass. Branch q/c162-live-polls pushed and merged with main. FOUND AND FIXED: realtime was unreachable for ALL 12 seeded accounts, messages included.",
      "detail": "Asked for as 'minutes + live polls + attendance' on the secretary dashboard. Two of those three ALREADY EXIST and must not be rebuilt: \n\n- MINUTES: shipped. models/meetings.py has Meeting.minutes_md (markdown), routers/meetings.py does create/read/update/delete gated on MINUTES_ADMIN, and app/(tabs)/chapter/secretary.tsx (782 lines, subtitle 'Minutes and attendance') edits them. Original card c12. \n- ATTENDANCE: shipped. MeetingAttendance with present/absent/excused, bulk PUT upsert, attendance-summary and export.csv, plus c156's windowed meetings+attendance bundle deployed in rev 00029-s4d. The 405 that used to break it died in c124. \n- POLLS: DO NOT EXIST. `grep -rn 'poll'` over backend/app and app-mobile/src returns NOTHING. No model, no route, no schema, no UI, no mock. This card is that gap and only that gap. \n\nSCOPE NOTE: polls are NOT in SPEC. SPEC m9 defines the secretary dashboard as 'minutes, attendance' and stops there. This is a deliberate product addition - see the Decisions log. \n\nMIGRATION 0018 IS CLAIMED HERE per CLAUDE.md, before the file is written. `alembic heads` reads 0013 and the chain is 0011->0014->0017->0015->0016->0013, so 0018 parents on 0013 - NOT on the highest filename. 0012 remains a released hole. \n\n'Live' is the design question worth deciding before building: the WS + Redis fan-out from c21/c63 exists and is proven on prod, so a poll can push results as they land rather than polling an endpoint. Start with correct persisted results and a manual refresh; wire the socket second, so a broken socket degrades to a working poll instead of a blank screen.\n\nBUILT Aug 24, two commits on q/c162-live-polls: f1e2fa1 (backend) and 730a12c (mobile). \n\nEVIDENCE, gathered because mobile CI is tsc-only and 'it compiles' is not 'it works': backend suite 471 passed / 3 skipped against PG16 on 5434, up from 456 - the 15 new tests are polls. tsc 5.9.3 clean. verify:contract passes with all five new poll routes matched to real backend routes; verify:charts passes. Migration 0018 applied to the dev DB (5440) and created polls, poll_options, poll_votes. The API answers /polls with 401 rather than 404, so the router is registered. Then the real thing: four seeded members voted, the president switched Yes -> No, and the tally read 4 VOTES NOT 5. The secretary, who had not voted, saw '4 votes - you have not voted'. Meter geometry measured in the DOM: Yes 590/1180px, No 590/1180px, Abstain 0px - exactly 50/50/0. \n\nTWO DESIGN CALLS, both cheap to reverse and both worth a second opinion: (1) BALLOTS ARE SECRET. The tally is a GROUP BY so no voter identity is loaded on the read path, and my_option_id describes only the caller. A test asserts a voter's id appears nowhere in the raw response body, so a future field carrying an identity fails it. (2) RESULTS ARE VISIBLE WHILE VOTING IS OPEN, which is what makes it 'live' and what was asked for. The cost is real: a running tally pulls late voters toward the leader. Hiding the bars until a member has voted is a one-file change - the server already returns what that needs. \n\nSTILL OPEN: no realtime yet. Results move on load and after your own vote, not on someone else's - a second member voting does not push. The WS + Redis fan-out from c21/c63 is proven on prod and is the obvious next step, deliberately left until the persisted version was correct so a broken socket degrades to a working poll instead of a blank screen. \n\nNOT DEPLOYED. 0018 has NOT been applied to prod, and prod has no polls code. Migrate first, then deploy - and that is Jose's call, not a worker session's.\n\nSOCKET WIRED Aug 24 (commit 4790cdc). open/vote/close/delete publish to every ACTIVE member through the existing per-user Redis channels (c21/c63). Fire-and-forget like the message path - a test asserts a dead Redis does not lose a vote. A no-op second close does not re-push. The broadcast is aggregate-only and deliberately omits my_option_id, since one event reaches every member and that field means something different to each; clients keep their local value through the merge, which is always right because only your own vote changes it. \n\nPROVEN LIVE, not just typed: with the app's own socket subscribed (Redis PUBSUB NUMSUB = 1), dev-alumni voted through the API while nobody touched the browser. The screen moved from '5 votes / Yes 2-40% / No 2-40%' to '6 votes / Yes 2-33% / No 2-33%' with NO RELOAD, all three meter fills measuring 393.328/1180px - exactly 2/6 each. 'you have not voted' survived, so my_option_id was preserved through the merge. \n\nTHE FIX NOBODY ASKED FOR BUT EVERYONE NEEDED: SessionProvider had a DEV_UID guard that disconnected the socket for every impersonated session. Its stated reason was that wsAuthProtocol() 'reads whatever setAuthToken last set, which is null here'. That is wrong - the function is `authToken ?? debugFirebaseUid`, so it returns the dev uid, and gateway.py's _resolve_uid accepts exactly that as the offered subprotocol under AUTH_MODE=emulated. Measured before touching it: a browser WebSocket opened with ['dev-secretary'] reached OPEN, Redis reported NUMSUB 1, and another member's vote arrived on it. So REALTIME WAS UNREACHABLE FOR ALL TWELVE c159 ACCOUNTS - not just polls, MESSAGES TOO. Anyone who tried to test c63's live messaging with a seeded account was testing a socket that had been told not to connect. Production is unaffected: DEV_UID is null in release builds behind devAuth's three locks. \n\nMerged origin/main and RE-RAN everything on the merged state rather than trusting the pre-merge green: 485 passed (main brought conversation-authz and social-auth work), alembic still a single head at 0018. Local dev now needs a Redis - chirp-dev-redis on port 6380, NOT 6379, which belongs to the unrelated leadgen containers. \n\nSTILL NOT DEPLOYED. 0018 has not touched prod and prod has no polls code. Migrate first, then deploy, and that is Jose's call."

      "detail": "THE REVIEW BLAMED THE QUERY SHAPE AND THAT WAS THE WRONG DIAGNOSIS, recorded because the wrong fix was one step away. S4 said the correlated scalar subqueries were the problem and proposed a LATERAL join or pre-aggregation. The EXPLAIN says otherwise: `loops=50` confirms the subqueries run once per OUTPUT row, not per candidate row, so 50 cheap index probes per page is a perfectly good shape. Rewriting to LATERAL would have been a large, risky change to the c109 count/blocked-author agreement and bought almost nothing. The shape is fine. The index was missing. Nothing here changes a single line of query logic.\\n\\nMEASURED, not argued (5000 posts, 100000 comments, ~20 per post - the cardinality that decides whether an index helps at all):\\n  BEFORE: Seq Scan on post_comments, loops=50, Execution Time 612.768 ms\\n  AFTER:  Bitmap Index Scan on the new index, loops=50, Execution Time 2.603 ms\\nAnd it degrades LINEARLY with the comments table, so this gets worse forever until fixed - 1M comments is roughly six seconds per feed page.\\n\\nTWO BENCHMARKS WERE THROWN AWAY BEFORE THIS ONE, and the reason is worth keeping: both put every comment on ONE post, because `CROSS JOIN LATERAL (SELECT id FROM posts ORDER BY random() LIMIT 1)` is not correlated and Postgres evaluates it once. With 1-3 distinct post_id values an index is genuinely useless and a seq scan is genuinely correct, so the first run 'proved' the index did nothing. A benchmark whose data shape is wrong does not measure the thing it names.\\n\\nINDEX IS (post_id, created_at) WHERE deleted_at IS NULL. Partial because every reader filters deleted_at IS NULL, so index-only the live rows; created_at trailing because list_comments orders by it, so one index serves the count AND the comment list.\\n\\nCREATE INDEX CONCURRENTLY in an alembic autocommit_block: a plain CREATE INDEX takes a SHARE lock and blocks writes to post_comments for its duration, which is fine on a small table and an outage on a big one. The cost is that a failed CONCURRENTLY build leaves an INVALID index that must be dropped by hand before retrying - documented in the migration rather than discovered."

      "detail": "THE CURRENT CODE IS CORRECT AND THAT IS WHY IT SURVIVED REVIEW. Recomputing from the source of truth means the stored score can never drift from the votes that justify it, which is a real property worth having - the fix must keep it rather than trade it away for speed.\\n\\nFIX: an AFTER INSERT/UPDATE/DELETE trigger on chirp_votes that applies a DELTA (score = score + NEW.value - OLD.value). O(1) per vote, and the row lock is held for a trivial arithmetic update instead of an index scan over every vote on that chirp.\\n\\nA TRIGGER RATHER THAN THE SAME DELTA IN THE ROUTER, deliberately, and this repo already has the precedent: ledger_append_only. An application-side delta is correct only as long as every current AND FUTURE write path remembers to apply it - a moderation tool that deletes votes, a backfill script, a psql session. The trigger is driven by the source of truth itself, so drift stops being a discipline anyone can forget and becomes structurally impossible. Same argument the composite FKs and the one-ballot-per-week PK are already built on.\\n\\nThe migration also RECOMPUTES every score once on upgrade, so any drift already sitting in prod is healed at the moment the trigger takes over rather than being frozen in.\\n\\nWHAT THIS DOES NOT FIX, stated so a green suite is not misread: concurrent votes on ONE chirp still serialise on that chirp's row lock. That is inherent to keeping a counter in the row and no trigger removes it. What changes is how long the lock is held (microseconds, not a scan) and that the cost stops growing with vote count - the degrade-with-scale property is the actual DDIA problem here. Genuinely lock-free counting needs sharded counter rows or an append-only delta table summed periodically; both are real options and both are OUT of this card. Do not add them quietly.\\n\\nFALSIFY-FIRST: the tests must fail with the trigger dropped, or they are testing nothing."
