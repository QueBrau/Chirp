[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp-backend"
version = "0.1.0"
description = "Chirp backend API: FastAPI + async SQLAlchemy + Redis fan-out"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "redis>=5",
    "greenlet",
    "stripe>=12",
    # Async HTTP for the Resend adapter (c87). It was already installed as a dev
    # dependency via the test client, which is exactly how a runtime import ends up
    # working locally and failing in the Cloud Run image — so it is declared here.
    "httpx",
    # Signed GCS upload URLs for post media (c70). Base dependency, not the "firebase"
    # optional extra's shape: there is no config toggle that turns this feature off at
    # runtime the way auth_mode switches firebase-admin on/off, so it always needs to
    # be importable once app.routers.media exists.
    "google-cloud-storage",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite",
]
firebase = [
    "firebase-admin",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
